<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>별빛 수비대</title>
<style>
  html, body {
    margin: 0;
    height: 100%;
    background: #04050d;
    overflow: hidden;
    font-family: "Malgun Gothic", "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
    color: #fff;
  }
  #wrap {
    width: 100vw;
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  #box { position: relative; }
  canvas {
    width: 100%;
    height: 100%;
    display: block;
    border-radius: 14px;
    box-shadow: 0 0 50px rgba(110, 150, 255, 0.25);
    cursor: crosshair;
  }
  .overlay {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 14px;
    text-align: center;
    background: rgba(4, 5, 13, 0.72);
    border-radius: 14px;
    padding: 20px;
    box-sizing: border-box;
  }
  .hidden { display: none; }
  #title {
    margin: 0;
    font-size: 64px;
    font-weight: 900;
    letter-spacing: 4px;
    line-height: 1.1;
  }
  #title.ready { color: #bfe9ff; text-shadow: 0 0 18px #4fa8ff, 0 0 40px #4f6bff; }
  #title.over  { color: #ff5a6e; text-shadow: 0 0 18px #ff2244, 0 0 44px #ff2244; font-size: 80px; }
  #sub {
    margin: 0;
    font-size: 18px;
    line-height: 1.7;
    color: #d6defa;
  }
  #sub b { color: #fff; }
  .g { color: #5dff7a; font-weight: 800; }
  .y { color: #ffd84a; font-weight: 800; }
  #btn {
    margin-top: 10px;
    font-family: inherit;
    font-size: 24px;
    font-weight: 800;
    color: #04050d;
    background: linear-gradient(180deg, #8ef0ff, #3fb3ff);
    border: none;
    border-radius: 999px;
    padding: 14px 44px;
    cursor: pointer;
    box-shadow: 0 0 24px rgba(80, 190, 255, 0.6);
    transition: transform 0.1s;
  }
  #btn:hover { transform: scale(1.06); }
  #btn:active { transform: scale(0.97); }
</style>
</head>
<body>
<div id="wrap">
  <div id="box">
    <canvas id="game"></canvas>
    <div id="overlay" class="overlay">
      <h1 id="title" class="ready">별빛 수비대</h1>
      <p id="sub">
        <b>← →</b> 방향키 또는 <b>마우스</b>로 이동<br>
        <b>스페이스바</b> 또는 <b>마우스 클릭</b>으로 발사<br><br>
        <span class="g">초록 아이템</span> 10초 동안 총알 두 발<br>
        <span class="y">노란 아이템</span> 한 번 막아 주는 방어막
      </p>
      <button id="btn">게임 시작</button>
    </div>
  </div>
</div>

<script>
// ===== 기본 설정 =====
const W = 600, H = 800;            // 게임 화면 크기
const cv = document.getElementById('game');
const ctx = cv.getContext('2d');
cv.width = W; cv.height = H;

const box = document.getElementById('box');
const overlay = document.getElementById('overlay');
const titleEl = document.getElementById('title');
const subEl = document.getElementById('sub');
const btn = document.getElementById('btn');

// 창 크기에 맞게 화면 크기 맞추기
function fit() {
  const s = Math.min(innerWidth / W, innerHeight / H) * 0.96;
  box.style.width = W * s + 'px';
  box.style.height = H * s + 'px';
}
addEventListener('resize', fit);
fit();

const ROWS = 4, COLS = 8;
const ROW_COLORS = ['#ff5fd2', '#ffb547', '#4fe3ff', '#8dff6a']; // 줄마다 다른 색
const POINTS = 10;          // 외계인 한 마리 점수
const MAX_LIVES = 3;        // 목숨 수
const ITEM_CHANCE = 0.1;    // 아이템 나올 확률 (10%)
const DOUBLE_TIME = 10;     // 두 발 아이템 지속 시간 (초)

// ===== 게임 상태 =====
// ready(시작 전) / play(게임 중) / between(스테이지 사이) / over(게임 오버)
let state = 'ready';
let score = 0, time = 0, stage = 1, lives = MAX_LIVES;
let player, pBullets, aBullets, aliens, particles, items;
let fx, fy, fDir;            // 외계인 무리 전체가 움직인 거리와 방향
let fireCd, alienFireT, diveT;
let invuln = 0;              // 맞은 뒤 잠깐 무적인 시간
let shield = false;          // 방어막 있음?
let doubleT = 0;             // 두 발 아이템 남은 시간
let bannerT = 0;             // "클리어!" 글자 보여 주는 시간
let introT = 0;              // "스테이지 N" 글자 보여 주는 시간

// 배경 별
const stars = [];
for (let i = 0; i < 120; i++) {
  stars.push({ x: Math.random() * W, y: Math.random() * H, s: Math.random() * 1.8 + 0.3, sp: Math.random() * 30 + 10 });
}

function newGame() {
  score = 0; stage = 1; lives = MAX_LIVES;
  shield = false; doubleT = 0;
  player = { x: W / 2, y: H - 80, dead: false };
  particles = [];
  setupStage();
}

function setupStage() {
  pBullets = []; aBullets = []; items = []; aliens = [];
  const gapX = 58, gapY = 56;
  const startX = (W - (COLS - 1) * gapX) / 2;
  for (let r = 0; r < ROWS; r++) {
    for (let c = 0; c < COLS; c++) {
      const hx = startX + c * gapX, hy = 120 + r * gapY;   // 대열 속 자기 자리
      aliens.push({ hx, hy, x: hx, y: hy, row: r, col: c, alive: true, mode: 'form' });
    }
  }
  fx = 0; fy = 0; fDir = 1;
  fireCd = 0; alienFireT = 1.5; diveT = diveInterval();
  invuln = 1.5; introT = 1.6;
}

// 급강하 간격: 스테이지가 오를수록 짧아짐
function diveInterval() {
  return Math.max(0.8, 4.4 - stage * 0.6) * (0.7 + Math.random() * 0.6);
}

// ===== 입력 (키보드, 마우스, 터치) =====
const keys = {};
let mouseX = null, mouseDown = false;

addEventListener('keydown', e => {
  if (['ArrowLeft', 'ArrowRight', 'Space'].includes(e.code)) {
    e.preventDefault();
    keys[e.code] = true;
  }
  if (e.code === 'Enter' && (state === 'ready' || state === 'over')) startGame();
});
addEventListener('keyup', e => { keys[e.code] = false; });

function toGameX(clientX) {
  const r = cv.getBoundingClientRect();
  return (clientX - r.left) * W / r.width;
}
cv.addEventListener('mousemove', e => { mouseX = toGameX(e.clientX); });
cv.addEventListener('mousedown', e => { mouseX = toGameX(e.clientX); mouseDown = true; });
addEventListener('mouseup', () => { mouseDown = false; });
cv.addEventListener('touchstart', e => { e.preventDefault(); mouseX = toGameX(e.touches[0].clientX); mouseDown = true; }, { passive: false });
cv.addEventListener('touchmove', e => { e.preventDefault(); mouseX = toGameX(e.touches[0].clientX); }, { passive: false });
cv.addEventListener('touchend', () => { mouseDown = false; });

btn.addEventListener('click', startGame);

// ===== 화면 전환 =====
function startGame() {
  if (state === 'play' || state === 'between') return;
  newGame();
  state = 'play';
  mouseDown = false;
  overlay.classList.add('hidden');
  btn.blur();
}

function loseGame() {
  player.dead = true;
  explode(player.x, player.y, '#2bd6c4', 40);
  explode(player.x, player.y, '#ffffff', 20);
  state = 'over';
  titleEl.className = 'over';
  titleEl.textContent = '게임 오버';
  subEl.innerHTML = '스테이지 <b>' + stage + '</b>까지 왔어요!<br>점수: <b>' + score + '</b>';
  btn.textContent = '다시 하기';
  setTimeout(() => { if (state === 'over') overlay.classList.remove('hidden'); }, 700);
}

// 내가 맞았을 때
function hitPlayer() {
  if (invuln > 0) return;
  if (shield) {                 // 방어막이 대신 막아 줌
    shield = false;
    invuln = 1;
    explode(player.x, player.y, '#ffd84a', 26);
    return;
  }
  lives--;
  explode(player.x, player.y, '#2bd6c4', 30);
  if (lives <= 0) { lives = 0; loseGame(); return; }
  invuln = 2;                   // 2초 동안 깜빡이며 무적
  aBullets = [];
}

// ===== 폭발 효과 =====
function explode(x, y, color, n = 18) {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2, sp = Math.random() * 200 + 60;
    particles.push({ x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, life: 1, color });
  }
}

function killAlien(a) {
  a.alive = false;
  score += POINTS;
  explode(a.x, a.y, ROW_COLORS[a.row]);
  if (Math.random() < ITEM_CHANCE) {
    items.push({ x: a.x, y: a.y, type: Math.random() < 0.5 ? 'double' : 'shield' });
  }
}

function movePlayer(dt) {
  let move = 0;
  if (keys.ArrowLeft) move -= 1;
  if (keys.ArrowRight) move += 1;
  if (move) { player.x += move * 380 * dt; mouseX = null; }
  else if (mouseX !== null) {
    const d = mouseX - player.x;
    player.x += Math.sign(d) * Math.min(Math.abs(d), 700 * dt);
  }
  player.x = Math.max(28, Math.min(W - 28, player.x));
}

// ===== 게임 진행 =====
function update(dt) {
  time += dt;
  for (const s of stars) { s.y += s.sp * dt; if (s.y > H) { s.y = 0; s.x = Math.random() * W; } }
  for (const p of particles) { p.x += p.vx * dt; p.y += p.vy * dt; p.vx *= 0.96; p.vy *= 0.96; p.life -= dt * 1.4; }
  particles = particles.filter(p => p.life > 0);

  // 스테이지 사이: "클리어!" 보여 준 뒤 다음 스테이지로
  if (state === 'between') {
    movePlayer(dt);
    bannerT -= dt;
    if (bannerT <= 0) { stage++; setupStage(); state = 'play'; }
    return;
  }
  if (state !== 'play') return;

  invuln = Math.max(0, invuln - dt);
  doubleT = Math.max(0, doubleT - dt);
  introT = Math.max(0, introT - dt);

  movePlayer(dt);

  // 총알 쏘기 (초록 아이템이면 두 발)
  fireCd -= dt;
  if ((keys.Space || mouseDown) && fireCd <= 0) {
    if (doubleT > 0) {
      pBullets.push({ x: player.x - 10, y: player.y - 18 });
      pBullets.push({ x: player.x + 10, y: player.y - 18 });
    } else {
      pBullets.push({ x: player.x, y: player.y - 26 });
    }
    fireCd = 0.28;
  }
  for (const b of pBullets) b.y -= 640 * dt;

  const alive = aliens.filter(a => a.alive);
  const inForm = alive.filter(a => a.mode === 'form');
  const killed = ROWS * COLS - alive.length;

  // 외계인 무리 좌우로 움직이기 (스테이지가 높을수록, 남은 수가 적을수록 빠름)
  const speed = 25 + stage * 15 + killed * 4.5;
  let minX = Infinity, maxX = -Infinity;
  for (const a of alive) { minX = Math.min(minX, a.hx + fx); maxX = Math.max(maxX, a.hx + fx); }
  const dx = fDir * speed * dt;
  if ((fDir > 0 && maxX + 20 + dx > W - 12) || (fDir < 0 && minX - 20 + dx < 12)) {
    fDir *= -1;
    fy += 20;
  } else {
    fx += dx;
  }
  for (const a of inForm) { a.x = a.hx + fx; a.y = a.hy + fy; }

  // 급강하 시작 (스테이지 2부터)
  if (stage >= 2) {
    diveT -= dt;
    if (diveT <= 0 && inForm.length) {
      const d = inForm[Math.floor(Math.random() * inForm.length)];
      d.mode = 'dive'; d.t = 0; d.shot = false;
      d.dir = player.x > d.x ? 1 : -1;
      diveT = diveInterval();
    }
  }

  // 급강하 중이거나 자리로 돌아가는 외계인 움직이기
  for (const a of alive) {
    if (a.mode === 'dive') {
      a.t += dt;
      // 좌우로 흔들리며(곡선) 내 쪽으로 내려옴
      a.x += (Math.cos(a.t * 2.6) * 170 * a.dir + (player.x - a.x) * 0.9) * dt;
      a.x = Math.max(16, Math.min(W - 16, a.x));
      a.y += (140 + stage * 20) * dt;
      if (!a.shot && a.t > 0.7) { a.shot = true; aBullets.push({ x: a.x, y: a.y + 16, vy: 320 }); }
      if (a.y > H + 30) { a.mode = 'return'; a.y = -30; a.x = a.hx + fx; }
    } else if (a.mode === 'return') {
      const tx = a.hx + fx, ty = a.hy + fy;
      const d = Math.hypot(tx - a.x, ty - a.y), step = 260 * dt;
      if (d <= step) { a.x = tx; a.y = ty; a.mode = 'form'; }
      else { a.x += (tx - a.x) / d * step; a.y += (ty - a.y) / d * step; }
    }
  }

  // 외계인 총알 쏘기 (대열에 있는 각 칸의 맨 아래 외계인만)
  alienFireT -= dt;
  if (alienFireT <= 0 && inForm.length) {
    const bottoms = {};
    for (const a of inForm) if (!bottoms[a.col] || a.y > bottoms[a.col].y) bottoms[a.col] = a;
    const list = Object.values(bottoms);
    const s = list[Math.floor(Math.random() * list.length)];
    aBullets.push({ x: s.x, y: s.y + 16, vy: 220 + stage * 15 + Math.random() * 90 });
    alienFireT = Math.max(0.3, 1.3 - killed * 0.03 - stage * 0.08) * (0.6 + Math.random() * 0.8);
  }
  for (const b of aBullets) b.y += b.vy * dt;

  // 내 총알이 외계인에 맞았는지
  for (const b of pBullets) {
    for (const a of alive) {
      if (a.alive && Math.abs(b.x - a.x) < 19 && Math.abs(b.y - a.y) < 17) {
        killAlien(a); b.dead = true;
        break;
      }
    }
  }
  pBullets = pBullets.filter(b => !b.dead && b.y > -20);
  aBullets = aBullets.filter(b => b.y < H + 20);

  // 아이템 떨어지기 + 줍기
  for (const it of items) {
    it.y += 150 * dt;
    if (Math.abs(it.x - player.x) < 28 && Math.abs(it.y - player.y) < 28) {
      it.got = true;
      if (it.type === 'double') doubleT = DOUBLE_TIME; else shield = true;
      explode(it.x, it.y, it.type === 'double' ? '#5dff7a' : '#ffd84a', 12);
    }
  }
  items = items.filter(it => !it.got && it.y < H + 20);

  // 외계인 총알이 나에게 맞았는지
  for (const b of aBullets) {
    if (Math.abs(b.x - player.x) < 18 && b.y > player.y - 20 && b.y < player.y + 18) {
      b.dead = true;
      hitPlayer();
      if (state !== 'play') return;
    }
  }
  aBullets = aBullets.filter(b => !b.dead);

  // 외계인이 나에게 부딪혔는지
  for (const a of alive) {
    if (a.alive && Math.abs(a.x - player.x) < 34 && Math.abs(a.y - player.y) < 32) {
      if (invuln > 0) continue;
      killAlien(a);
      hitPlayer();
      if (state !== 'play') return;
    }
  }

  // 대열이 바닥까지 내려오면 바로 게임 오버
  for (const a of aliens) {
    if (a.alive && a.mode === 'form' && a.y + 16 >= player.y - 20) { lives = 0; return loseGame(); }
  }

  // 다 물리치면 다음 스테이지 준비
  if (aliens.every(a => !a.alive)) {
    state = 'between';
    bannerT = 2.5;
    pBullets = []; aBullets = []; items = [];
  }
}

// ===== 그리기: 내 우주선 =====
function drawShip(x, y) {
  ctx.save();
  ctx.translate(x, y);
  // 엔진 불꽃
  const f = 9 + Math.sin(time * 40) * 3;
  ctx.fillStyle = '#ffb347';
  ctx.beginPath(); ctx.moveTo(-7, 16); ctx.lineTo(0, 16 + f); ctx.lineTo(7, 16); ctx.fill();
  ctx.fillStyle = '#fff3c0';
  ctx.beginPath(); ctx.moveTo(-3, 16); ctx.lineTo(0, 16 + f * 0.55); ctx.lineTo(3, 16); ctx.fill();
  // 날개
  ctx.fillStyle = '#2bd6c4';
  ctx.beginPath();
  ctx.moveTo(0, -8); ctx.lineTo(25, 14); ctx.lineTo(16, 19); ctx.lineTo(0, 10);
  ctx.lineTo(-16, 19); ctx.lineTo(-25, 14); ctx.closePath(); ctx.fill();
  // 몸통
  ctx.fillStyle = '#e8f4ff';
  ctx.beginPath();
  ctx.moveTo(0, -26);
  ctx.quadraticCurveTo(11, -4, 8, 16); ctx.lineTo(-8, 16);
  ctx.quadraticCurveTo(-11, -4, 0, -26); ctx.fill();
  // 조종석
  ctx.fillStyle = '#3a7bff';
  ctx.beginPath(); ctx.ellipse(0, -5, 3.6, 7.5, 0, 0, Math.PI * 2); ctx.fill();
  // 날개 끝 불빛 (두 발 모드면 초록색)
  ctx.fillStyle = doubleT > 0 ? '#5dff7a' : (Math.sin(time * 6) > 0 ? '#ff5fd2' : '#ffffff');
  ctx.fillRect(-24, 12, 4, 4); ctx.fillRect(20, 12, 4, 4);
  ctx.restore();

  // 방어막
  if (shield) {
    ctx.save();
    ctx.strokeStyle = '#ffd84a';
    ctx.shadowColor = '#ffd84a'; ctx.shadowBlur = 14;
    ctx.globalAlpha = 0.6 + Math.sin(time * 5) * 0.25;
    ctx.lineWidth = 3;
    ctx.beginPath(); ctx.arc(x, y - 2, 34, 0, Math.PI * 2); ctx.stroke();
    ctx.restore();
  }
}

// ===== 그리기: 외계인 4종류 (줄마다 다름) =====
function eyes(xs, y, r) {
  for (const ex of xs) {
    ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(ex, y, r, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#14102a'; ctx.beginPath(); ctx.arc(ex, y + r * 0.2, r * 0.5, 0, Math.PI * 2); ctx.fill();
  }
}

// 1줄: 해파리
function alienJelly(c, t) {
  ctx.fillStyle = c;
  ctx.beginPath(); ctx.arc(0, 0, 15, Math.PI, 0); ctx.lineTo(15, 4); ctx.lineTo(-15, 4); ctx.closePath(); ctx.fill();
  ctx.strokeStyle = c; ctx.lineWidth = 3; ctx.lineCap = 'round';
  for (let i = 0; i < 4; i++) {
    const bx = -11 + i * 7.3;
    ctx.beginPath(); ctx.moveTo(bx, 4);
    ctx.quadraticCurveTo(bx + Math.sin(t * 6 + i) * 5, 10, bx + Math.sin(t * 6 + i + 1) * 3, 17);
    ctx.stroke();
  }
  eyes([-5.5, 5.5], -5, 3.2);
}

// 2줄: 나방
function alienMoth(c, t) {
  const flap = 0.55 + 0.45 * Math.abs(Math.sin(t * 5));
  ctx.globalAlpha = 0.75; ctx.fillStyle = c;
  ctx.beginPath(); ctx.ellipse(-11, -1, 9, 13 * flap, -0.5, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.ellipse(11, -1, 9, 13 * flap, 0.5, 0, Math.PI * 2); ctx.fill();
  ctx.globalAlpha = 1;
  ctx.strokeStyle = c; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(-2, -12); ctx.lineTo(-6, -18); ctx.moveTo(2, -12); ctx.lineTo(6, -18); ctx.stroke();
  ctx.fillStyle = '#fff1d6';
  ctx.beginPath(); ctx.moveTo(0, -14); ctx.lineTo(7, 0); ctx.lineTo(0, 15); ctx.lineTo(-7, 0); ctx.closePath(); ctx.fill();
  ctx.fillStyle = '#14102a';
  ctx.beginPath(); ctx.arc(-2.5, -4, 1.8, 0, Math.PI * 2); ctx.arc(2.5, -4, 1.8, 0, Math.PI * 2); ctx.fill();
}

// 3줄: 눈알 구슬
function alienOrb(c, t) {
  ctx.strokeStyle = c; ctx.lineWidth = 2.5;
  ctx.beginPath(); ctx.ellipse(0, 0, 19, 6, Math.sin(t * 2) * 0.5, 0, Math.PI * 2); ctx.stroke();
  ctx.fillStyle = c;
  ctx.beginPath(); ctx.arc(0, 0, 12, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(0, 0, 7, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#14102a'; ctx.beginPath(); ctx.arc(Math.sin(t * 3) * 3, 0, 3.5, 0, Math.PI * 2); ctx.fill();
}

// 4줄: 말랑이
function alienBlob(c, t) {
  const sq = 1 + Math.sin(t * 7) * 0.08;
  ctx.save(); ctx.scale(sq, 2 - sq);
  ctx.fillStyle = c;
  ctx.beginPath();
  ctx.moveTo(-16, 8);
  ctx.quadraticCurveTo(-18, -14, 0, -14);
  ctx.quadraticCurveTo(18, -14, 16, 8);
  ctx.quadraticCurveTo(0, 14, -16, 8);
  ctx.fill();
  ctx.restore();
  ctx.fillStyle = c;
  ctx.fillRect(-12, 9, 5, 5); ctx.fillRect(7, 9, 5, 5);
  eyes([-7, 0, 7], -3, 3);
}

const ALIEN_DRAW = [alienJelly, alienMoth, alienOrb, alienBlob];

function drawAlien(a) {
  ctx.save();
  const bob = a.mode === 'form' ? Math.sin(time * 3 + a.col) * 2 : 0;
  ctx.translate(a.x, a.y + bob);
  if (a.mode === 'dive') ctx.rotate(Math.cos(a.t * 2.6) * 0.5 * a.dir);  // 급강하 중엔 기울어짐
  ctx.shadowColor = ROW_COLORS[a.row]; ctx.shadowBlur = 10;
  ALIEN_DRAW[a.row](ROW_COLORS[a.row], time + a.col * 0.3);
  ctx.restore();
}

// ===== 그리기: 아이템, 하트 =====
function itemIcon(x, y, type, r) {
  const c = type === 'double' ? '#5dff7a' : '#ffd84a';
  ctx.save();
  ctx.translate(x, y);
  ctx.shadowColor = c; ctx.shadowBlur = 16;
  ctx.fillStyle = c;
  ctx.beginPath(); ctx.arc(0, 0, r, 0, Math.PI * 2); ctx.fill();
  ctx.shadowBlur = 0;
  ctx.fillStyle = '#0b0a24';
  const k = r / 12;
  ctx.scale(k, k);
  if (type === 'double') {          // 총알 두 개 모양
    ctx.fillRect(-6, -7, 4, 14);
    ctx.fillRect(2, -7, 4, 14);
  } else {                          // 방패 모양
    ctx.beginPath();
    ctx.moveTo(0, -8); ctx.lineTo(7, -5);
    ctx.quadraticCurveTo(7, 5, 0, 9);
    ctx.quadraticCurveTo(-7, 5, -7, -5);
    ctx.closePath(); ctx.fill();
  }
  ctx.restore();
}

function heart(x, y, full) {
  ctx.save();
  ctx.translate(x, y);
  ctx.beginPath();
  ctx.moveTo(0, 8);
  ctx.bezierCurveTo(-14, -2, -9, -14, 0, -6);
  ctx.bezierCurveTo(9, -14, 14, -2, 0, 8);
  ctx.closePath();
  if (full) {
    ctx.fillStyle = '#ff4d6d';
    ctx.shadowColor = '#ff4d6d'; ctx.shadowBlur = 10;
    ctx.fill();
  } else {
    ctx.strokeStyle = 'rgba(255, 120, 140, 0.45)';
    ctx.lineWidth = 2;
    ctx.stroke();
  }
  ctx.restore();
}

function bigText(text, y, size, color, glow, alpha = 1) {
  ctx.save();
  ctx.globalAlpha = alpha;
  ctx.font = '900 ' + size + 'px "Malgun Gothic", sans-serif';
  ctx.textAlign = 'center';
  ctx.shadowColor = glow; ctx.shadowBlur = 24;
  ctx.fillStyle = color;
  ctx.fillText(text, W / 2, y);
  ctx.restore();
}

// ===== 화면 전체 그리기 =====
function draw() {
  const g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, '#0b0a24'); g.addColorStop(1, '#04050d');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);

  for (const s of stars) {
    ctx.globalAlpha = 0.4 + 0.6 * Math.abs(Math.sin(time + s.x));
    ctx.fillStyle = '#fff'; ctx.fillRect(s.x, s.y, s.s, s.s);
  }
  ctx.globalAlpha = 1;

  // 바닥 선
  ctx.strokeStyle = 'rgba(80, 200, 255, 0.35)'; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(0, H - 40); ctx.lineTo(W, H - 40); ctx.stroke();

  for (const a of aliens) if (a.alive) drawAlien(a);

  for (const it of items) itemIcon(it.x, it.y, it.type, 12 + Math.sin(time * 8) * 1.5);

  // 내 총알
  ctx.shadowBlur = 12;
  ctx.shadowColor = doubleT > 0 ? '#5dff7a' : '#7ff6ff';
  ctx.fillStyle = doubleT > 0 ? '#c9ffd2' : '#c9fbff';
  for (const b of pBullets) ctx.fillRect(b.x - 2, b.y - 9, 4, 18);
  // 외계인 총알
  ctx.shadowColor = '#ff3355'; ctx.fillStyle = '#ff6b81';
  for (const b of aBullets) {
    ctx.beginPath(); ctx.arc(b.x, b.y, 5, 0, Math.PI * 2); ctx.fill();
  }
  ctx.shadowBlur = 0;

  // 내 우주선 (맞은 직후엔 깜빡깜빡)
  const blink = invuln > 0 && state === 'play' && Math.floor(time * 12) % 2 === 0;
  if (!player.dead && !blink) drawShip(player.x, player.y);

  for (const p of particles) {
    ctx.globalAlpha = Math.max(0, p.life);
    ctx.fillStyle = p.color; ctx.fillRect(p.x - 2, p.y - 2, 4, 4);
  }
  ctx.globalAlpha = 1;

  if (state === 'ready') return;

  // ----- 위쪽 정보판 -----
  ctx.font = 'bold 22px "Malgun Gothic", sans-serif';
  ctx.fillStyle = '#e8f4ff';
  ctx.textAlign = 'left'; ctx.fillText('점수 ' + score, 20, 40);
  ctx.textAlign = 'center'; ctx.fillStyle = '#bfe9ff'; ctx.fillText('스테이지 ' + stage, W / 2, 40);
  for (let i = 0; i < MAX_LIVES; i++) heart(W - 30 - i * 32, 32, i < lives);

  // 지금 켜져 있는 아이템
  let ix = 30;
  ctx.font = 'bold 16px "Malgun Gothic", sans-serif';
  ctx.textAlign = 'left';
  if (doubleT > 0) {
    itemIcon(ix, 68, 'double', 10);
    ctx.fillStyle = '#5dff7a'; ctx.fillText('두 발 ' + Math.ceil(doubleT) + '초', ix + 16, 74);
    ix += 110;
  }
  if (shield) {
    itemIcon(ix, 68, 'shield', 10);
    ctx.fillStyle = '#ffd84a'; ctx.fillText('방어막', ix + 16, 74);
  }

  // 스테이지 시작 글자
  if (state === 'play' && introT > 0) {
    bigText('스테이지 ' + stage, H / 2 + 60, 56, '#bfe9ff', '#4f8bff', Math.min(1, introT / 0.5));
  }
  // 스테이지 클리어 글자
  if (state === 'between') {
    bigText('클리어!', H / 2, 96, '#ffe066', '#ffb000');
    bigText('다음은 스테이지 ' + (stage + 1), H / 2 + 60, 28, '#ffffff', '#4f8bff');
  }
}

// ===== 반복 실행 =====
let last = performance.now();
function loop(now) {
  const dt = Math.min(0.033, (now - last) / 1000);
  last = now;
  update(dt);
  draw();
  requestAnimationFrame(loop);
}
newGame();
requestAnimationFrame(loop);
</script>
</body>
</html>
