<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>부자되기 대작전</title>
<style>
  :root {
    --bg: #0b0f19;
    --panel: #161d2d;
    --panel2: #1e273b;
    --line: #2b3650;
    --text: #e9edf6;
    --muted: #8d99b6;
    --gold: #ffcc4d;
    --gold2: #ff9f1c;
    --up: #ff5a6e;     /* 한국식: 오르면 빨강 */
    --down: #4f9dff;   /* 내리면 파랑 */
    --good: #4ee08a;
    --bad: #ff6b6b;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100%; overflow: hidden;
    background: #05070d; color: var(--text);
    font-family: "Malgun Gothic", "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
    font-size: 14px;
    -webkit-tap-highlight-color: transparent;
  }
  button {
    font-family: inherit; font-weight: 700; font-size: 13px;
    border-radius: 9px; padding: 7px 9px; cursor: pointer;
    background: var(--panel2); color: var(--text); border: 1px solid var(--line);
    transition: transform .08s, filter .15s; touch-action: manipulation;
  }
  button:hover:not(:disabled) { filter: brightness(1.2); }
  button:active:not(:disabled) { transform: scale(.95); }
  button:disabled { opacity: .35; cursor: not-allowed; }
  button.gold { background: linear-gradient(180deg, var(--gold), var(--gold2)); color: #2a1a00; border: none; }
  button.red { background: #45202d; border-color: #7a3448; }
  button.blue { background: #1b3253; border-color: #2f5b8f; }
  button.xs { padding: 5px 7px; font-size: 12px; }

  /* 앱 전체: 폰 한 화면 */
  #app {
    max-width: 480px; margin: 0 auto; height: 100vh; height: 100dvh;
    display: flex; flex-direction: column; background: var(--bg);
    border-left: 1px solid #141a28; border-right: 1px solid #141a28;
  }

  header { padding: 8px 12px 6px; background: var(--panel); border-bottom: 1px solid var(--line); }
  .hrow { display: flex; align-items: center; gap: 8px; }
  .logo { font-size: 16px; font-weight: 900; color: var(--gold); white-space: nowrap; }
  #sAge { font-weight: 800; font-size: 14px; flex: 1; text-align: center; white-space: nowrap; }
  .speed { display: flex; gap: 3px; }
  .speed button { padding: 4px 7px; font-size: 12px; }
  .speed button.on { background: var(--gold); color: #2a1a00; border-color: var(--gold); }
  .stats { display: grid; grid-template-columns: 1fr 1fr 1fr 0.8fr; gap: 4px; margin-top: 6px; }
  .stat .k { font-size: 11px; color: var(--muted); }
  .stat .v { font-size: 14px; font-weight: 800; font-variant-numeric: tabular-nums; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .stat .v.gold { color: var(--gold); }
  #timebar { height: 3px; background: var(--line); }
  #timebar div { height: 100%; width: 0; background: var(--gold); }

  main { flex: 1; overflow-y: auto; padding: 8px 10px; display: flex; flex-direction: column; gap: 8px; }

  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 10px 12px; }
  .card h4 { margin: 0 0 6px; font-size: 14px; display: flex; justify-content: space-between; align-items: center; }
  .muted { color: var(--muted); font-size: 12px; }
  .row { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .b { font-weight: 800; }

  .jobname { font-size: 18px; font-weight: 900; }
  .ladder { display: flex; gap: 3px; margin: 6px 0; }
  .ladder span { flex: 1; height: 5px; border-radius: 3px; background: var(--line); }
  .ladder span.on { background: var(--gold); }

  .bar { height: 8px; background: var(--line); border-radius: 4px; overflow: hidden; flex: 1; }
  .bar div { height: 100%; border-radius: 4px; }
  .acts { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin-top: 8px; }
  .acts button { padding: 8px 2px; line-height: 1.25; }
  .acts button small { display: block; font-size: 11px; font-weight: 600; opacity: .85; }

  .ledger { display: grid; grid-template-columns: 1fr 1fr; gap: 2px 14px; font-size: 12px; }
  .ledger div { display: flex; justify-content: space-between; }

  .item { background: var(--panel2); border: 1px solid var(--line); border-radius: 12px; padding: 8px 10px; }
  .item .name { font-weight: 800; font-size: 14px; }
  .item .price { font-weight: 800; font-variant-numeric: tabular-nums; text-align: right; white-space: nowrap; }
  .item .btns { display: flex; align-items: center; gap: 4px; margin-top: 6px; flex-wrap: wrap; }
  .item .btns .lbl { font-size: 11px; color: var(--muted); margin: 0 2px 0 4px; }
  .item .btns .lbl:first-child { margin-left: 0; }
  .sp { flex: 1; }
  .up { color: var(--up); } .down { color: var(--down); }
  .good { color: var(--good); } .bad { color: var(--bad); }
  svg.spark { width: 76px; height: 28px; display: block; }
  .tip { font-size: 12px; color: var(--muted); line-height: 1.5; }

  #chart { width: 100%; height: 70px; display: block; }

  #ticker {
    padding: 6px 12px; font-size: 12.5px; background: var(--panel); border-top: 1px solid var(--line);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; cursor: pointer;
  }
  #ticker .t { color: var(--muted); margin-right: 6px; }

  nav { display: grid; grid-template-columns: repeat(5, 1fr); background: var(--panel); border-top: 1px solid var(--line);
        padding-bottom: env(safe-area-inset-bottom); }
  nav button { background: none; border: none; border-radius: 0; padding: 7px 0 8px; font-size: 11px; color: var(--muted); line-height: 1.3; }
  nav button span { display: block; font-size: 19px; }
  nav button.on { color: var(--gold); }

  .float { position: fixed; pointer-events: none; font-weight: 900; color: var(--gold); text-shadow: 0 2px 4px #000;
           animation: up .9s ease-out forwards; z-index: 50; font-size: 14px; }
  @keyframes up { to { transform: translateY(-50px); opacity: 0; } }

  .modal { position: fixed; inset: 0; background: rgba(5, 8, 15, .8); display: flex; align-items: center;
           justify-content: center; z-index: 100; padding: 16px; }
  .modal.hidden { display: none; }
  .modal .box { background: var(--panel); border: 2px solid var(--gold); border-radius: 18px; max-width: 420px; width: 100%;
                padding: 18px; text-align: center; max-height: 90vh; overflow-y: auto; }
  .modal h2 { margin: 0 0 6px; color: var(--gold); font-size: 22px; }
  .modal p { line-height: 1.65; margin: 6px 0 14px; }
  .modal .btns { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; }
  .modal .btns button { padding: 11px 18px; font-size: 15px; }
  .big { font-size: 34px; font-weight: 900; color: var(--gold); margin: 6px 0; }
  .loglist { text-align: left; font-size: 13px; line-height: 1.55; }
  .loglist div { border-bottom: 1px dashed var(--line); padding: 3px 0; }
  .loglist .t { color: var(--muted); font-size: 11px; margin-right: 6px; }

  #toast { position: fixed; left: 50%; bottom: 130px; transform: translateX(-50%); background: var(--gold); color: #2a1a00;
           font-weight: 900; padding: 8px 16px; border-radius: 999px; z-index: 90; opacity: 0; transition: opacity .3s;
           pointer-events: none; max-width: 92vw; text-align: center; font-size: 13px; }
  #toast.show { opacity: 1; }
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="hrow">
      <div class="logo">💰 부자되기</div>
      <div id="sAge"></div>
      <div class="speed" id="speed">
        <button data-speed="0">⏸</button>
        <button data-speed="1">1x</button>
        <button data-speed="2">2x</button>
        <button data-speed="4">4x</button>
      </div>
    </div>
    <div class="stats">
      <div class="stat"><div class="k">현금</div><div class="v" id="sCash"></div></div>
      <div class="stat"><div class="k">순자산</div><div class="v gold" id="sNet"></div></div>
      <div class="stat"><div class="k">월 수지(예상)</div><div class="v" id="sFlow"></div></div>
      <div class="stat"><div class="k">경기·금리</div><div class="v" id="sMarket"></div></div>
    </div>
  </header>
  <div id="timebar"><div></div></div>
  <main id="main"></main>
  <div id="ticker"></div>
  <nav id="nav">
    <button data-tab="home"><span>🏠</span>홈</button>
    <button data-tab="stock"><span>📈</span>투자</button>
    <button data-tab="estate"><span>🏘️</span>부동산</button>
    <button data-tab="biz"><span>🏪</span>사업</button>
    <button data-tab="bank"><span>🏦</span>은행</button>
  </nav>
</div>

<div class="modal hidden" id="modal"><div class="box">
  <h2 id="mTitle"></h2>
  <div id="mBody"></div>
  <div class="btns" id="mBtns"></div>
</div></div>
<div id="toast"></div>

<script>
// ===================== 기본 데이터 (2026년 한국 기준, 세후 금액) =====================
const START_AGE = 20, END_AGE = 60;
const MONTH_MS = 3000;            // 1배속: 한 달 = 3초
const ENERGY_MAX = 8;             // 한 달에 쓸 수 있는 활동 횟수

// 직업: sal=세후 월급, req=필요 역량, ten=현 직급 필요 근속(개월)
const JOBS = [
  { n: '편의점 알바',     sal: 200e4,  req: 0,  ten: 0 },
  { n: '중소기업 사원',   sal: 250e4,  req: 2,  ten: 12 },
  { n: '대기업 대리',     sal: 380e4,  req: 5,  ten: 24 },
  { n: '대기업 과장',     sal: 480e4,  req: 8,  ten: 36 },
  { n: '대기업 차장',     sal: 580e4,  req: 11, ten: 36 },
  { n: '대기업 부장',     sal: 700e4,  req: 14, ten: 48 },
  { n: '상무 (임원)',     sal: 1100e4, req: 18, ten: 48 },
  { n: '대표이사 (CEO)',  sal: 2500e4, req: 22, ten: 60 },
];

// 주식: 월 기준 기대수익(drift)과 변동성(vol)
const STOCKS = [
  { id: 'etf',  n: '코스피200 ETF', d: '시장 전체 분산 · 연 7% 내외', p: 40000, vol: .045, drift: .0055, beta: .9 },
  { id: 'star', n: '별빛전자',      d: '반도체 대형주',               p: 70000, vol: .075, drift: .006,  beta: 1.1 },
  { id: 'mal',  n: '말랑게임즈',    d: '신작에 울고 웃는 성장주',     p: 30000, vol: .13,  drift: .005,  beta: 1.4 },
  { id: 'coin', n: '멍멍코인',      d: '변동성 극심 · 0원도 가능',    p: 500,   vol: .24,  drift: -.002, beta: 2 },
];
const TRADE_FEE = .002;

// 부동산: rent=월세, prem=월 추가 상승률(입지), res=주거용
const ESTATE = [
  { id: 'villa', n: '빌라',           p: 2e8,  rent: 65e4,   prem: -.002,  res: true },
  { id: 'offi',  n: '오피스텔',       p: 3e8,  rent: 100e4,  prem: -.0012, res: true },
  { id: 'apt',   n: '수도권 아파트',  p: 6e8,  rent: 140e4,  prem: 0,      res: true },
  { id: 'seoul', n: '서울 아파트',    p: 15e8, rent: 280e4,  prem: .0016,  res: true },
  { id: 'shop',  n: '상가',           p: 20e8, rent: 650e4,  prem: -.0006, res: false },
  { id: 'bldg',  n: '꼬마빌딩',       p: 80e8, rent: 2300e4, prem: .0008,  res: false },
];
const ACQ_TAX = .025, SELL_FEE = .005, GAIN_TAX = .22, LTV = .6, DSR = .4;

// 사업: profit=매장당 평균 월 순이익, risk=매달 폐업 확률
const BIZ = [
  { id: 'ice',   n: '무인 아이스크림점', cost: 6000e4, profit: 110e4,  risk: .008 },
  { id: 'cafe',  n: '동네 카페',         cost: 1.5e8,  profit: 250e4,  risk: .012 },
  { id: 'chick', n: '치킨집',            cost: 2e8,    profit: 360e4,  risk: .012 },
  { id: 'acad',  n: '입시 학원',         cost: 6e8,    profit: 1100e4, risk: .006 },
  { id: 'fact',  n: '중소 제조공장',     cost: 60e8,   profit: 9000e4, risk: .003 },
];
const ANGEL_COST = 1e8;   // 스타트업 엔젤투자 1건
const BIZ_TAX = .2, RENT_TAX = .15, INT_TAX = .154;

const MILESTONES = [1e7, 1e8, 5e8, 1e9, 3e9, 1e10, 5e10, 1e11, 1e12];

// ===================== 유틸 =====================
const $ = id => document.getElementById(id);
const rand = (a, b) => a + Math.random() * (b - a);
const chance = p => Math.random() < p;
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
function gauss() { let u = 0, v = 0; while (!u) u = Math.random(); while (!v) v = Math.random(); return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v); }

function fmt(n) {
  const s = n < 0 ? '-' : '';
  n = Math.abs(n);
  if (n >= 1e12) return s + (n / 1e12).toFixed(2).replace(/\.?0+$/, '') + '조';
  if (n >= 1e8) {
    const eok = Math.floor(n / 1e8), man = Math.floor((n % 1e8) / 1e6) * 100;
    return s + eok.toLocaleString() + '억' + (man && eok < 100 ? ' ' + man.toLocaleString() + '만' : '');
  }
  if (n >= 1e4) return s + Math.floor(n / 1e4).toLocaleString() + '만';
  return s + Math.floor(n).toLocaleString() + '원';
}
const won = n => fmt(n) + (Math.abs(n) >= 1e4 && Math.abs(n) < 1e12 ? '원' : '');
const pct = x => (x >= 0 ? '+' : '') + (x * 100).toFixed(1) + '%';

// ===================== 상태 =====================
let S;
function newState() {
  const st = {
    month: 0, cash: 300e4, cpi: 1, raise: 1,
    job: 0, tenure: 0, skill: 0, promoCd: 0,
    health: 85, energy: ENERGY_MAX,
    deposit: 0, credit: 0, rate: 2.75,
    stocks: {}, estate: {}, hidx: {}, biz: {}, angel: 0,
    married: false, kids: [], karma: 0,
    market: { s: 'norm', left: 12 }, lastBiz: 0,
    hist: [], log: [], miles: 0, over: false,
  };
  STOCKS.forEach(k => st.stocks[k.id] = { p: k.p, qty: 0, cost: 0, h: [k.p] });
  ESTATE.forEach(e => { st.estate[e.id] = { n: 0, cost: 0, debt: 0 }; st.hidx[e.id] = 1; });
  BIZ.forEach(b => st.biz[b.id] = 0);
  return st;
}
const SAVE_KEY = 'richgame_v2';
function save() { try { localStorage.setItem(SAVE_KEY, JSON.stringify(S)); } catch (e) {} }
function load() { try { const t = localStorage.getItem(SAVE_KEY); if (t) return JSON.parse(t); } catch (e) {} return null; }

// ===================== 계산 =====================
const age = () => START_AGE + Math.floor(S.month / 12);
const job = () => JOBS[S.job];
const salary = () => Math.round(job().sal * (1 + S.skill * 0.02) * S.raise);
const partnerIncome = () => S.married ? Math.round(260e4 * S.raise) : 0;
const kidsActive = () => S.kids.filter(b => S.month - b < 240).length;
const living = () => Math.round((120e4 + (S.married ? 80e4 : 0) + kidsActive() * 100e4) * S.cpi);
const skillCost = () => Math.round(50e4 * Math.pow(1.28, S.skill) * S.cpi);

const ePrice = e => Math.round(e.p * S.hidx[e.id]);
const eRent = e => Math.round(e.rent * Math.sqrt(S.hidx[e.id]));
function homeId() {   // 가장 비싼 주거용 집에 직접 산다
  for (let i = ESTATE.length - 1; i >= 0; i--) if (ESTATE[i].res && S.estate[ESTATE[i].id].n > 0) return ESTATE[i].id;
  return null;
}
const housingCost = () => homeId() ? 0 : Math.round((S.married ? 100e4 : 60e4) * S.cpi);   // 월세살이
function rentGross() {
  const h = homeId();
  return ESTATE.reduce((a, e) => a + (S.estate[e.id].n - (e.id === h ? 1 : 0)) * eRent(e), 0);
}
const mortRate = () => (S.rate + 1.5) / 100;
const creditRate = () => (S.rate + 2.8) / 100;
const depRate = () => (S.rate + 0.3) / 100;
const mortDebt = () => ESTATE.reduce((a, e) => a + S.estate[e.id].debt, 0);
const marketMul = () => S.market.s === 'boom' ? 1.15 : S.market.s === 'bust' ? 0.75 : 1;
const bizCost = b => Math.round(b.cost * S.cpi);
function bizExpected() { return BIZ.reduce((a, b) => a + S.biz[b.id] * b.profit * S.cpi, 0) * marketMul() * (1 - BIZ_TAX); }

const stockValue = () => STOCKS.reduce((a, k) => a + S.stocks[k.id].qty * S.stocks[k.id].p, 0);
const estateValue = () => ESTATE.reduce((a, e) => a + S.estate[e.id].n * ePrice(e), 0);
const bizValue = () => BIZ.reduce((a, b) => a + S.biz[b.id] * bizCost(b) * 0.5, 0) + S.angel * ANGEL_COST;
const netWorth = () => S.cash + S.deposit + stockValue() + estateValue() + bizValue() - mortDebt() - S.credit;

const monthIncome = () => salary() + partnerIncome() + rentGross() * (1 - RENT_TAX) + bizExpected();
function annualDebtPay(extraMort = 0, extraCredit = 0) {   // 원리금 대략 (주담대 30년, 신용 5년)
  return (mortDebt() + extraMort) * (mortRate() + 1 / 30) + (S.credit + extraCredit) * (creditRate() + 1 / 5);
}
const dsrOK = (m, c) => annualDebtPay(m, c) <= monthIncome() * 12 * DSR;
const creditLimit = () => Math.max(0, Math.round((salary() + partnerIncome()) * 12) - S.credit);

function monthlyFlow() {
  return monthIncome() + S.deposit * depRate() / 12 * (1 - INT_TAX)
    - living() - housingCost() - mortDebt() * mortRate() / 12 - S.credit * creditRate() / 12;
}

// ===================== 로그 / 토스트 / 모달 =====================
const ageStr = (m = S.month) => (START_AGE + Math.floor(m / 12)) + '세 ' + (m % 12 + 1) + '월';
function log(msg) { S.log.unshift({ t: ageStr(), m: msg }); if (S.log.length > 80) S.log.length = 80; renderTicker(); }
let toastT;
function toast(msg) { const t = $('toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('show'), 2300); }

let paused = false;
function modal(title, html, buttons) {
  paused = true;
  $('mTitle').textContent = title; $('mBody').innerHTML = html;
  const mb = $('mBtns'); mb.innerHTML = '';
  buttons.forEach(([label, cls, fn]) => {
    const b = document.createElement('button'); b.textContent = label; if (cls) b.className = cls;
    b.onclick = () => { $('modal').classList.add('hidden'); paused = false; fn && fn(); render(); save(); };
    mb.appendChild(b);
  });
  $('modal').classList.remove('hidden');
}

// ===================== 이벤트 =====================
function shock(id, mul) { const s = S.stocks[id]; s.p = Math.max(1, s.p * mul); s.h[s.h.length - 1] = s.p; }
const ownsAny = () => ESTATE.some(e => S.estate[e.id].n > 0);
const EVENTS = [
  { w: 8, f: () => { const v = Math.round(rand(20, 60)) * 1e4; S.cash -= v; log('💌 친구 결혼식·경조사비 -' + won(v)); } },
  { w: 5, f: () => { const v = 15e4; S.cash -= v; S.health -= 5; log('🤧 독감으로 병원비 -' + won(v)); } },
  { w: 4, f: () => { const v = Math.round(150e4 * S.cpi); S.cash -= v; log('🚗 접촉사고 수리비 -' + won(v)); } },
  { w: 4, f: () => { const v = 5e4; S.cash += v; log('🎫 로또 4등 당첨! +' + won(v)); } },
  { w: .03, f: () => { const v = 20e8; S.cash += v; log('🎉 로또 1등 당첨!!! 세후 +' + won(v)); toast('🎉 로또 1등!!!'); } },
  { w: 3, f: () => { shock('coin', rand(1.8, 3.2)); log('🚀 멍멍코인, 해외 거래소 상장 소식에 폭등!'); } },
  { w: 3, f: () => { shock('coin', rand(.35, .6)); log('💥 코인 거래소 해킹 사태… 멍멍코인 폭락'); } },
  { w: 3, f: () => { shock('star', 1.15); log('📱 별빛전자 실적 서프라이즈! 주가 +15%'); } },
  { w: 3, f: () => { shock('star', .86); log('📉 반도체 업황 부진… 별빛전자 -14%'); } },

        ['기부한다', 'gold', () => { S.cash -= amt; S.karma++; log('❤️ ' + won(amt) + ' 기부. 마음이 따뜻해져요.'); }],

];
function randomEvent() {
  const list = EVENTS.filter(e => !e.c || e.c());
  let r = Math.random() * list.reduce((a, e) => a + e.w, 0);
  for (const e of list) { r -= e.w; if (r <= 0) { e.f(); return; } }
}

// ===================== 한 달 진행 =====================
function nextMonth() {
  if (S.over) return;
  S.month++; S.tenure++; S.promoCd = Math.max(0, S.promoCd - 1);
  S.energy = ENERGY_MAX;
  S.cpi *= 1.0021;   // 물가 연 2.5%
  if (S.month % 12 === 0) { S.raise *= 1.03; log(`🎂 ${age()}살! 연봉 3% 인상, 물가도 올랐어요.`); }

  // 경기 순환
  if (--S.market.left <= 0) {
    const r = Math.random(), ns = r < .3 ? 'boom' : r < .55 ? 'bust' : 'norm';
    S.market = { s: ns, left: Math.floor(rand(10, 36)) };
    log(ns === 'boom' ? '📈 경기 호황 시작! 주식·사업이 잘 돼요.' : ns === 'bust' ? '📉 경기 불황… 주가 하락·폐업 위험 증가' : '➖ 경기가 평범해졌어요.');
  }
  // 기준금리
  if (chance(.07)) {
    const d = S.market.s === 'boom' ? .25 : S.market.s === 'bust' ? -.25 : (chance(.5) ? .25 : -.25);
    const nr = clamp(S.rate + d, .5, 6);
    if (nr !== S.rate) { S.rate = nr; log(`🏦 한국은행 기준금리 ${d > 0 ? '인상' : '인하'} → ${S.rate.toFixed(2)}%`); }
  }
  const mDrift = S.market.s === 'boom' ? .012 : S.market.s === 'bust' ? -.018 : 0;
  const common = gauss() * .025;

  STOCKS.forEach(k => {
    const s = S.stocks[k.id];
    let r = k.drift + k.beta * (mDrift + common) + k.vol * gauss();
    s.p = Math.max(1, s.p * Math.exp(r));
    s.h.push(s.p); if (s.h.length > 36) s.h.shift();
  });
  ESTATE.forEach(e => {
    S.hidx[e.id] *= Math.exp(.0026 + e.prem + mDrift * .25 - (S.rate - 2.75) * .0007 + gauss() * .009);
  });

  // 수입
  let biz = 0;
  BIZ.forEach(b => {
    for (let i = 0; i < S.biz[b.id]; i++) biz += b.profit * S.cpi * marketMul() * (1 + .6 * gauss());
    if (S.biz[b.id] > 0 && chance(b.risk * S.biz[b.id] * (S.market.s === 'bust' ? 2 : 1))) {
      S.biz[b.id]--; const back = Math.round(bizCost(b) * .2); S.cash += back;
      log(`🚪 ${b.n} 한 곳이 경영난으로 폐업… 권리금 ${won(back)} 회수`);
    }
  });
  biz = biz > 0 ? biz * (1 - BIZ_TAX) : biz;
  S.lastBiz = biz;
  for (let i = S.angel; i > 0; i--) {
    if (chance(.006)) { S.angel--; const m = Math.round(rand(5, 25)); S.cash += ANGEL_COST * m * .78; log(`🦄 투자한 스타트업 상장! ${m}배 엑싯 → 세후 +${won(ANGEL_COST * m * .78)}`); toast(`🦄 스타트업 대박! ${m}배`); }
    else if (chance(.024)) { S.angel--; log('💀 투자한 스타트업이 문을 닫았어요. -' + won(ANGEL_COST)); }
  }

  S.cash += salary() + partnerIncome() + rentGross() * (1 - RENT_TAX) + biz;
  S.cash += S.deposit * depRate() / 12 * (1 - INT_TAX);
  S.cash -= living() + housingCost() + mortDebt() * mortRate() / 12 + S.credit * creditRate() / 12;

  if (S.month % 12 === 2) { const v = Math.round(salary() * rand(-.2, .6)); S.cash += v; log(v >= 0 ? `🧾 연말정산 환급 +${won(v)}` : `🧾 연말정산 추가 납부 ${won(v)}`); }
  if (S.month % 12 === 0 && S.job >= 1) {
    const v = Math.round(salary() * (S.market.s === 'boom' ? rand(1.5, 3) : S.market.s === 'bust' ? rand(0, .5) : rand(.5, 1.5)));
    if (v > 0) { S.cash += v; log('🎁 연말 성과급 +' + won(v)); }
  }

  // 건강
  const a = age();
  S.health += a < 40 ? 4 : a < 50 ? 3 : 2;
  if (a >= 50) S.health -= 1;
  S.health = clamp(S.health, 0, 100);
  if (S.health < 30 && chance(.25)) { const v = Math.round(300e4 * S.cpi); S.cash -= v; S.health += 10; log('🏥 과로로 쓰러져 입원… 병원비 -' + won(v)); toast('건강 관리하세요!'); }

  if (chance(.25)) randomEvent();

  // 현금 부족 → 예금 → 신용대출
  if (S.cash < 0) {
    let need = -S.cash;
    const fromDep = Math.min(need, S.deposit); S.deposit -= fromDep; need -= fromDep;
    S.cash = 0;
    if (fromDep) log('🏦 현금 부족, 예금에서 ' + won(fromDep) + ' 인출');
    if (need > 0) { S.credit += need; log('⚠️ 현금 부족으로 마이너스통장 ' + won(need) + ' 사용'); }
  }

  const nw = netWorth();
  S.hist.push(nw);
  if (nw < -1e8 || (nw < 0 && S.credit > Math.max(3000e4, (salary() + partnerIncome()) * 18))) { gameOver(true); return; }

  while (S.miles < MILESTONES.length && nw >= MILESTONES[S.miles]) {
    const m = MILESTONES[S.miles++]; log('🏆 순자산 ' + won(m) + ' 돌파!'); toast('🏆 순자산 ' + won(m) + ' 돌파!');
  }
  if (S.month >= (END_AGE - START_AGE) * 12) { gameOver(false); return; }
  save();
}

// ===================== 결말 =====================
function rankOf(nwReal) {   // 현재가치 기준 (대략 한국 순자산 분포)
  if (nwReal < 0) return ['💸 빚더미', '다음엔 대출을 조심해요…'];
  if (nwReal < 3e8) return ['🙂 평범한 서민', '그래도 성실히 살았어요!'];
  if (nwReal < 10e8) return ['🏡 중산층', '대한민국 중산층 진입!'];
  if (nwReal < 30e8) return ['💎 상위 5% 자산가', '노후 걱정 없는 부자!'];
  if (nwReal < 100e8) return ['🏰 상위 1% 부자', '진짜 부자 소리 듣는 수준!'];
  if (nwReal < 1000e8) return ['👑 슈퍼리치', '뉴스에 나올 만한 부자!'];
  return ['🌟 재벌', '전설적인 자수성가!'];
}
function gameOver(bankrupt) {
  S.over = true; save(); render();
  const nw = netWorth();
  if (bankrupt) {
    modal('💥 파산', `<p>빚을 감당하지 못해 ${ageStr()}에 개인회생을 신청했어요.</p><div class="big">${won(nw)}</div><p class="muted">레버리지와 몰빵 투자는 조심!</p>`, [['다시 시작', 'gold', restart]]);
  } else {
    const real = nw / S.cpi, [t, d] = rankOf(real);
    modal('🎊 60세 은퇴', `<p>40년의 경제생활이 끝났어요.</p><div class="muted">최종 순자산</div><div class="big">${won(nw)}</div>
      <div class="muted">오늘 돈 가치로 환산: ${won(real)}</div>
      <p style="font-size:20px;font-weight:900;margin-top:12px">${t}</p><p class="muted">${d}<br>${job().n} · ${S.married ? '기혼' : '미혼'} · 자녀 ${S.kids.length}명</p>`,
      [['다시 도전', 'gold', restart]]);
  }
}
function restart() { S = newState(); tab = 'home'; log('👋 20살, 통장 300만원으로 시작! 월세 살며 알바부터…'); render(); save(); }

// ===================== 행동 =====================
function doAct(a, id, arg, ev) {
  if (S.over) return;
  if (a === 'ot') {     // 야근
    if (S.energy < 1 || S.health < 10) return toast(S.health < 10 ? '너무 피곤해요! 쉬어야 해요' : '이번 달 에너지가 없어요');
    const v = Math.round(salary() / 20 * 1.5); S.cash += v; S.energy--; S.health -= 4; floatTxt(ev, '+' + won(v));
  }
  if (a === 'side') {   // 배달 부업
    if (S.energy < 1 || S.health < 10) return toast(S.health < 10 ? '너무 피곤해요! 쉬어야 해요' : '이번 달 에너지가 없어요');
    const v = Math.round(rand(6, 10) * 1e4 * S.cpi); S.cash += v; S.energy--; S.health -= 3; floatTxt(ev, '+' + won(v));
  }
  if (a === 'gym') {
    const c = Math.round(5e4 * S.cpi);
    if (S.energy < 1) return toast('이번 달 에너지가 없어요'); if (S.cash < c) return toast('돈이 부족해요');
    S.cash -= c; S.energy--; S.health = Math.min(100, S.health + 7); floatTxt(ev, '건강 +7');
  }
  if (a === 'study') {
    const c = skillCost();
    if (S.energy < 2) return toast('공부엔 에너지 2가 필요해요'); if (S.cash < c) return toast('학원비가 부족해요');
    S.cash -= c; S.energy -= 2; S.skill++; S.health -= 2; log(`📚 자격증·공부로 역량 Lv.${S.skill}`); floatTxt(ev, '역량 +1');
  }
  if (a === 'promo') {
    const nj = JOBS[S.job + 1]; if (!nj) return;
    const p = clamp(.55 + .06 * (S.skill - nj.req), .3, .92);
    if (chance(p)) { S.job++; S.tenure = 0; log(`🎊 승진 성공! ${job().n} (월급 ${won(salary())})`); toast('🎊 승진! ' + job().n); }
    else { S.promoCd = 6; log(`😢 승진 심사 탈락… 6개월 뒤 재도전 (합격률 ${Math.round(p * 100)}%)`); toast('승진 탈락…'); }
  }
  if (a === 'buyS') {
    const k = STOCKS.find(x => x.id === id), s = S.stocks[id];
    const qty = Math.floor(S.cash * arg / (s.p * (1 + TRADE_FEE)));
    if (qty < 1) return toast('현금이 부족해요');
    const cost = qty * s.p * (1 + TRADE_FEE);
    S.cash -= cost; s.cost += cost; s.qty += qty;
    log(`🛒 ${k.n} ${qty.toLocaleString()}주 매수 ${won(cost)}`);
  }
  if (a === 'sellS') {
    const k = STOCKS.find(x => x.id === id), s = S.stocks[id];
    const qty = arg === 1 ? s.qty : Math.floor(s.qty * arg);
    if (qty < 1) return toast('팔 주식이 없어요');
    const avg = s.cost / s.qty, get = qty * s.p * (1 - TRADE_FEE), gain = get - avg * qty;
    S.cash += get; s.cost -= avg * qty; s.qty -= qty; if (!s.qty) s.cost = 0;
    log(`💵 ${k.n} ${qty.toLocaleString()}주 매도 (${gain >= 0 ? '수익 +' : '손실 '}${won(gain)})`);
  }
  if (a === 'buyE') {
    const e = ESTATE.find(x => x.id === id), p = ePrice(e), tax = p * ACQ_TAX;
    const loan = arg ? Math.round(p * LTV) : 0, need = p + tax - loan;
    if (S.cash < need) return toast(`현금 ${won(need - S.cash)} 부족 (취득세 포함)`);
    if (loan && !dsrOK(loan, 0)) return toast('DSR 40% 초과! 소득 대비 빚이 많아 대출 불가');
    const first = !homeId() && e.res;
    S.cash -= need; const st = S.estate[id]; st.n++; st.cost += p + tax; st.debt += loan;
    log(`🏠 ${e.n} 매입 ${won(p)}${loan ? ` (주담대 ${won(loan)})` : ''}${first ? ' — 내 집 마련! 월세 탈출 🎉' : ''}`);
  }
  if (a === 'sellE') {
    const e = ESTATE.find(x => x.id === id), st = S.estate[id]; if (!st.n) return;
    const p = ePrice(e), avg = st.cost / st.n, debt = st.debt / st.n;
    const gain = p - avg, tax = gain > 0 ? gain * GAIN_TAX : 0, fee = p * SELL_FEE;
    const get = p - tax - fee - debt;
    S.cash += get; st.n--; st.cost -= avg; st.debt -= debt;
    log(`🔑 ${e.n} 매도 ${won(p)} (양도세 ${won(tax)}, 대출상환 ${won(debt)}) → ${won(get)}`);
  }
  if (a === 'biz') {
    const b = BIZ.find(x => x.id === id), c = bizCost(b);
    if (S.cash < c) return toast(`현금 ${won(c - S.cash)} 부족`);
    S.cash -= c; S.biz[id]++; log(S.biz[id] === 1 ? `🎉 ${b.n} 창업! (${won(c)})` : `📈 ${b.n} ${S.biz[id]}호점 오픈!`);
  }
  if (a === 'sellB') {
    const b = BIZ.find(x => x.id === id); if (!S.biz[id]) return;
    const v = Math.round(bizCost(b) * .5); S.biz[id]--; S.cash += v; log(`🤝 ${b.n} 한 곳 양도 +${won(v)}`);
  }
  if (a === 'angel') {
    if (S.cash < ANGEL_COST) return toast('현금이 부족해요');
    S.cash -= ANGEL_COST; S.angel++; log('🦄 스타트업에 엔젤투자 ' + won(ANGEL_COST));
  }
  if (a === 'dep') { const v = Math.floor(S.cash * arg); if (v <= 0) return toast('현금이 없어요'); S.cash -= v; S.deposit += v; log('🏦 예금 ' + won(v) + ' 입금'); }
  if (a === 'wd') { const v = Math.floor(S.deposit * arg); if (v <= 0) return toast('예금이 없어요'); S.deposit -= v; S.cash += v; log('🏦 예금 ' + won(v) + ' 출금'); }
  if (a === 'loan') {
    const v = Math.min(arg || Infinity, creditLimit());
    if (v < 1e4) return toast('신용대출 한도가 없어요');
    if (!dsrOK(0, v)) return toast('DSR 40% 초과! 소득 대비 빚이 많아요');
    S.credit += v; S.cash += v; log(`💳 신용대출 ${won(v)} (연 ${(creditRate() * 100).toFixed(1)}%)`);
  }
  if (a === 'repay') {
    const v = Math.min(S.cash, S.credit); if (v <= 0) return toast(S.credit ? '현금이 없어요' : '갚을 빚이 없어요');
    S.credit -= v; S.cash -= v; log('✅ 신용대출 ' + won(v) + ' 상환');
  }
  if (a === 'repayM') {
    let v = Math.min(S.cash, mortDebt()); if (v <= 0) return toast(mortDebt() ? '현금이 없어요' : '주담대가 없어요');
    S.cash -= v; log('✅ 주택담보대출 ' + won(v) + ' 상환');
    for (const e of ESTATE) { const st = S.estate[e.id], x = Math.min(st.debt, v); st.debt -= x; v -= x; }
  }
  render(); save();
}
function floatTxt(ev, text) {
  if (!ev) return;
  const f = document.createElement('div'); f.className = 'float'; f.textContent = text;
  const r = ev.target.closest('button').getBoundingClientRect();
  f.style.left = (r.left + r.width / 2 - 30) + 'px'; f.style.top = (r.top - 8) + 'px';
  document.body.appendChild(f); setTimeout(() => f.remove(), 900);
}

// ===================== 화면 =====================
let tab = 'home', speed = 1;

function spark(h) {
  if (h.length < 2) return '<svg class="spark"></svg>';
  const mn = Math.min(...h), mx = Math.max(...h), r = mx - mn || 1;
  const pts = h.map((v, i) => `${(i / (h.length - 1) * 100).toFixed(1)},${(27 - (v - mn) / r * 24).toFixed(1)}`).join(' ');
  return `<svg class="spark" viewBox="0 0 100 28" preserveAspectRatio="none"><polyline points="${pts}" fill="none" stroke="${h[h.length - 1] >= h[0] ? 'var(--up)' : 'var(--down)'}" stroke-width="1.5" vector-effect="non-scaling-stroke"/></svg>`;
}
const sign = (v, cls = true) => `<span class="${cls ? (v >= 0 ? 'good' : 'bad') : ''}">${v >= 0 ? '+' : ''}${won(v)}</span>`;
const dis = c => c ? '' : 'disabled';

function drawChart() {
  const c = $('chart'); if (!c) return;
  const dpr = devicePixelRatio || 1, w = c.clientWidth, hgt = c.clientHeight;
  c.width = w * dpr; c.height = hgt * dpr;
  const g = c.getContext('2d'); g.scale(dpr, dpr);
  const h = S.hist;
  if (h.length < 2) { g.fillStyle = '#8d99b6'; g.font = '12px sans-serif'; g.fillText('한 달이 지나면 그래프가 그려져요', 4, hgt / 2); return; }
  const mn = Math.min(0, ...h), mx = Math.max(...h), r = mx - mn || 1;
  const x = i => i / (h.length - 1) * (w - 2) + 1, y = v => hgt - 3 - (v - mn) / r * (hgt - 16);
  const grad = g.createLinearGradient(0, 0, 0, hgt); grad.addColorStop(0, 'rgba(255,204,77,.35)'); grad.addColorStop(1, 'rgba(255,204,77,0)');
  g.beginPath(); g.moveTo(x(0), y(mn)); h.forEach((v, i) => g.lineTo(x(i), y(v))); g.lineTo(x(h.length - 1), y(mn)); g.fillStyle = grad; g.fill();
  g.beginPath(); h.forEach((v, i) => i ? g.lineTo(x(i), y(v)) : g.moveTo(x(i), y(v))); g.strokeStyle = '#ffcc4d'; g.lineWidth = 2; g.stroke();
  g.fillStyle = '#8d99b6'; g.font = '11px sans-serif'; g.fillText('최고 ' + won(mx), 2, 10);
}

function renderTicker() {

  const ms = S.market.s;

  document.querySelectorAll('#speed button').forEach(b => b.classList.toggle('on', +b.dataset.speed === speed));
  document.querySelectorAll('#nav button').forEach(b => b.classList.toggle('on', b.dataset.tab === tab));
  const m = $('main'), top = m.scrollTop;
  m.innerHTML = tab === 'home' ? viewHome() : tab === 'stock' ? viewStock() : tab === 'estate' ? viewEstate() : tab === 'biz' ? viewBiz() : viewBank();
  m.scrollTop = top;
  drawChart();
  renderTicker();
}

// ===================== 입력 =====================
$('main').addEventListener('click', e => {
  const b = e.target.closest('button[data-a]'); if (!b || b.disabled) return;
  doAct(b.dataset.a, b.dataset.id, b.dataset.arg !== undefined ? +b.dataset.arg : undefined, e);
});
$('nav').addEventListener('click', e => { const b = e.target.closest('button'); if (b) { tab = b.dataset.tab; $('main').scrollTop = 0; render(); } });
$('speed').addEventListener('click', e => { const b = e.target.closest('button'); if (b) { speed = +b.dataset.speed; render(); } });
$('ticker').addEventListener('click', () => {
  modal('📰 지난 소식', `<div class="loglist">${S.log.slice(0, 40).map(l => `<div><span class="t">${l.t}</span>${l.m}</div>`).join('')}</div>`,
    [['닫기', 'gold', null], ['새 게임', 'red', () => modal('새 게임?', '<p>지금까지 기록이 사라져요.</p>', [['새로 시작', 'red', restart], ['취소', '', null]])]]);
});
addEventListener('resize', drawChart);

// ===================== 시간 흐름 =====================
let acc = 0, last = performance.now();
function loop(now) {
  const dt = Math.min(now - last, 200); last = now;
  if (!paused && !S.over && speed > 0) {
    acc += dt * speed;
    if (acc >= MONTH_MS) { acc -= MONTH_MS; nextMonth(); if (!S.over) render(); }
  }
  $('timebar').firstElementChild.style.width = (acc / MONTH_MS * 100) + '%';
  requestAnimationFrame(loop);
}

// ===================== 시작 =====================
S = load();
if (!S || S.over) {
  S = newState();
  log('👋 20살, 통장 300만원으로 시작! 월세 살며 알바부터…');

  modal('💰 부자되기 대작전', `<p style="text-align:left;font-size:14px">

    🏠 <b>홈</b> 야근·부업으로 돈 벌기, 공부해서 <b>승진</b><br>

    <span class="muted">물가·연봉 인상, 세금, 결혼·육아, 경기 순환까지 반영! 1달=3초, 위에서 일시정지·배속. 아래 소식줄을 누르면 지난 소식을 볼 수 있어요.</span></p>`,
    [['시작하기', 'gold', null]]);
} else { render(); toast('저장된 게임을 불러왔어요'); }
requestAnimationFrame(loop);
