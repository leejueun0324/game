<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>부자되기 대작전</title>
<style>
  :root {
    --bg: #0f1420;
    --panel: #182032;
    --panel2: #1f2940;
    --line: #2c3854;
    --text: #e8ecf6;
    --muted: #8e9ab8;
    --gold: #ffcc4d;
    --gold2: #ff9f1c;
    --up: #ff5a6e;     /* 한국식: 오르면 빨강 */
    --down: #4f9dff;   /* 내리면 파랑 */
    --good: #4ee08a;
    --bad: #ff6b6b;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: "Malgun Gothic", "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
    -webkit-tap-highlight-color: transparent;
  }
  button {
    font-family: inherit;
    font-weight: 700;
    border: none;
    border-radius: 10px;
    padding: 8px 12px;
    cursor: pointer;
    background: var(--panel2);
    color: var(--text);
    border: 1px solid var(--line);
    transition: transform .08s, filter .15s;
  }
  button:hover:not(:disabled) { filter: brightness(1.2); }
  button:active:not(:disabled) { transform: scale(.96); }
  button:disabled { opacity: .35; cursor: not-allowed; }
  button.gold { background: linear-gradient(180deg, var(--gold), var(--gold2)); color: #2a1a00; border: none; }
  button.red { background: #4a2030; border-color: #7a3448; }
  button.blue { background: #1d3557; border-color: #2f5b8f; }
  button.sm { padding: 6px 9px; font-size: 13px; }

  #app { max-width: 1080px; margin: 0 auto; padding: 12px 16px 40px; }

  /* 상단 */
  header {
    display: flex; flex-wrap: wrap; align-items: center; gap: 10px 16px;
    background: var(--panel); border: 1px solid var(--line); border-radius: 16px;
    padding: 12px 16px; margin-bottom: 12px;
  }
  .logo { font-size: 22px; font-weight: 900; color: var(--gold); white-space: nowrap; }
  .stats { display: flex; flex-wrap: wrap; gap: 6px 18px; flex: 1; }
  .stat .k { font-size: 12px; color: var(--muted); }
  .stat .v { font-size: 18px; font-weight: 800; font-variant-numeric: tabular-nums; }
  .stat .v.gold { color: var(--gold); }
  .speed { display: flex; gap: 4px; }
  .speed button.on { background: var(--gold); color: #2a1a00; border-color: var(--gold); }
  @media (max-width: 600px) {
    .logo { width: 100%; font-size: 20px; }
    .stats { display: grid; grid-template-columns: 1fr 1fr; width: 100%; }
    .stat .v { font-size: 16px; }
    .speed { width: 100%; }
    .speed button { flex: 1; }
  }
  .badge { display: inline-block; padding: 2px 8px; border-radius: 999px; font-size: 12px; font-weight: 800; }
  .badge.boom { background: #4a2030; color: var(--up); }
  .badge.bust { background: #1d3557; color: var(--down); }
  .badge.norm { background: #2a3550; color: var(--muted); }

  #timebar { height: 4px; background: var(--line); border-radius: 4px; overflow: hidden; margin: -6px 0 12px; }
  #timebar div { height: 100%; width: 0; background: var(--gold); transition: width .1s linear; }

  .grid { display: grid; grid-template-columns: 340px 1fr; gap: 12px; }
  @media (max-width: 820px) { .grid { grid-template-columns: 1fr; } }

  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 14px; }
  .card h3 { margin: 0 0 10px; font-size: 16px; }
  .muted { color: var(--muted); font-size: 13px; }

  /* 일하기 */
  #workBtn {
    width: 100%; height: 150px; font-size: 26px; border-radius: 20px; border: none;
    background: radial-gradient(circle at 50% 35%, #ffe08a, var(--gold) 45%, var(--gold2));
    color: #2a1a00; box-shadow: 0 6px 0 #b86a00, 0 0 30px rgba(255, 190, 60, .25);
    position: relative; user-select: none;
  }
  #workBtn:active { transform: translateY(4px); box-shadow: 0 2px 0 #b86a00; }
  #workBtn small { display: block; font-size: 15px; margin-top: 6px; }
  .float {
    position: fixed; pointer-events: none; font-weight: 900; color: var(--gold);
    text-shadow: 0 2px 4px #000; animation: up 0.9s ease-out forwards; z-index: 50;
  }
  @keyframes up { to { transform: translateY(-70px); opacity: 0; } }

  .row { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .jobname { font-size: 20px; font-weight: 900; }
  .ladder { display: flex; gap: 3px; margin: 8px 0; }
  .ladder span { flex: 1; height: 6px; border-radius: 3px; background: var(--line); }
  .ladder span.on { background: var(--gold); }
  .mt { margin-top: 10px; }

  /* 탭 */
  .tabs { display: flex; gap: 6px; margin-bottom: 10px; flex-wrap: wrap; }
  .tabs button.on { background: var(--gold); color: #2a1a00; border-color: var(--gold); }
  .item {
    background: var(--panel2); border: 1px solid var(--line); border-radius: 12px;
    padding: 10px 12px; margin-bottom: 8px;
  }
  .item .top { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  .item .name { font-weight: 800; font-size: 16px; }
  .item .price { font-weight: 800; font-variant-numeric: tabular-nums; text-align: right; }
  .item .btns { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
  .up { color: var(--up); } .down { color: var(--down); }
  .good { color: var(--good); } .bad { color: var(--bad); }
  svg.spark { width: 100%; height: 40px; display: block; margin-top: 6px; }

  /* 로그 */
  #log { max-height: 220px; overflow-y: auto; font-size: 14px; line-height: 1.6; }
  #log div { border-bottom: 1px dashed var(--line); padding: 3px 0; }
  #log .t { color: var(--muted); font-size: 12px; margin-right: 6px; }

  #chart { width: 100%; height: 120px; display: block; }

  /* 모달 */
  .modal {
    position: fixed; inset: 0; background: rgba(5, 8, 15, .78); display: flex;
    align-items: center; justify-content: center; z-index: 100; padding: 16px;
  }
  .modal.hidden { display: none; }
  .modal .box {
    background: var(--panel); border: 2px solid var(--gold); border-radius: 20px;
    max-width: 440px; width: 100%; padding: 22px; text-align: center;
  }
  .modal h2 { margin: 0 0 8px; color: var(--gold); font-size: 26px; }
  .modal p { line-height: 1.7; margin: 8px 0 16px; }
  .modal .btns { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; }
  .modal .btns button { padding: 12px 20px; font-size: 16px; }
  .big { font-size: 40px; font-weight: 900; color: var(--gold); margin: 8px 0; }

  #toast {
    position: fixed; left: 50%; top: 16px; transform: translateX(-50%);
    background: var(--gold); color: #2a1a00; font-weight: 900; padding: 10px 18px;
    border-radius: 999px; z-index: 90; opacity: 0; transition: opacity .3s; pointer-events: none;
    max-width: 90vw; text-align: center;
  }
  #toast.show { opacity: 1; }
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="logo">💰 부자되기 대작전</div>
    <div class="stats">
      <div class="stat"><div class="k">나이</div><div class="v" id="sAge"></div></div>
      <div class="stat"><div class="k">현금</div><div class="v" id="sCash"></div></div>
      <div class="stat"><div class="k">순자산</div><div class="v gold" id="sNet"></div></div>
      <div class="stat"><div class="k">월 수지</div><div class="v" id="sFlow"></div></div>
      <div class="stat"><div class="k">경기</div><div class="v" id="sMarket"></div></div>
    </div>
    <div class="speed" id="speed">
      <button class="sm" data-speed="0">⏸</button>
      <button class="sm" data-speed="1">1배</button>
      <button class="sm" data-speed="2">2배</button>
      <button class="sm" data-speed="4">4배</button>
    </div>
  </header>
  <div id="timebar"><div></div></div>

  <div class="grid">
    <div>
      <div class="card">
        <button id="workBtn">💼 일하기<small id="clickVal"></small></button>
        <div class="mt">
          <div class="row"><span class="muted">현재 직업</span><span class="muted" id="jobSal"></span></div>
          <div class="jobname" id="jobName"></div>
          <div class="ladder" id="ladder"></div>
        </div>
        <div class="row mt">
          <div>
            <div style="font-weight:800">📚 자기계발 Lv.<span id="skLv"></span></div>
            <div class="muted">클릭 수입 +10%, 월급 +3%</div>
          </div>
          <button class="gold" id="skBtn"></button>
        </div>
        <div class="row mt">
          <div>
            <div style="font-weight:800">🏢 승진 도전</div>
            <div class="muted" id="promoTxt"></div>
          </div>
          <button class="gold" id="promoBtn">승진!</button>
        </div>
      </div>

      <div class="card mt">
        <h3>📈 순자산 그래프</h3>
        <canvas id="chart"></canvas>
      </div>

      <div class="card mt">
        <div class="row" style="margin-bottom:6px">
          <h3 style="margin:0">📰 소식</h3>
          <button class="sm red" id="resetBtn">새 게임</button>
        </div>
        <div id="log"></div>
      </div>
    </div>

    <div class="card">
      <div class="tabs" id="tabs">
        <button data-tab="stock">📊 주식·코인</button>
        <button data-tab="estate">🏠 부동산</button>
        <button data-tab="biz">🏪 사업</button>
        <button data-tab="bank">🏦 은행</button>
      </div>
      <div id="tabBody"></div>
    </div>
  </div>
</div>

<div class="modal hidden" id="modal"><div class="box">
  <h2 id="mTitle"></h2>
  <div id="mBody"></div>
  <div class="btns" id="mBtns"></div>
</div></div>
<div id="toast"></div>

<script>
// ================= 데이터 =================
const START_AGE = 20, END_AGE = 60;
const MONTH_MS = 2500;          // 1배속에서 한 달 = 2.5초

const JOBS = [
  { n: '편의점 알바',    sal: 150e4,  click: 1e4,   req: 0 },
  { n: '중소기업 사원',  sal: 250e4,  click: 2e4,   req: 3 },
  { n: '대기업 대리',    sal: 400e4,  click: 4e4,   req: 6 },
  { n: '대기업 과장',    sal: 600e4,  click: 7e4,   req: 10 },
  { n: '대기업 부장',    sal: 900e4,  click: 12e4,  req: 15 },
  { n: '상무 이사',      sal: 1500e4, click: 25e4,  req: 20 },
  { n: '대표이사 CEO',   sal: 3000e4, click: 50e4,  req: 26 },
];

const STOCKS = [
  { id: 'gukbap', n: '든든국밥 ETF', d: '시장 전체에 분산. 느리지만 꾸준히',   p: 10000, vol: .025, drift: .006, beta: .8 },
  { id: 'star',   n: '별빛전자',     d: '튼튼한 대형 우량주',                  p: 70000, vol: .05,  drift: .007, beta: 1 },
  { id: 'mal',    n: '말랑게임즈',   d: '신작 하나에 울고 웃는 성장주',        p: 30000, vol: .11,  drift: .008, beta: 1.5 },
  { id: 'dog',    n: '멍멍코인 🐶',  d: '오늘 10배, 내일 반토막. 책임은 본인', p: 100,   vol: .28,  drift: -.004, beta: 2.2 },
];

const ESTATE = [
  { id: 'goshi', n: '고시원 한 칸',  p: 5e7,   rent: 35e4 },
  { id: 'one',   n: '원룸',          p: 15e7,  rent: 85e4 },
  { id: 'offi',  n: '오피스텔',      p: 3e8,   rent: 150e4 },
  { id: 'apt',   n: '아파트',        p: 9e8,   rent: 250e4 },
  { id: 'shop',  n: '상가 건물',     p: 40e8,  rent: 1500e4 },
  { id: 'tower', n: '도심 빌딩',     p: 300e8, rent: 1.2e8 },
];

const BIZ = [
  { id: 'fish',  n: '붕어빵 노점 🐟',  cost: 300e4,  profit: 25e4 },
  { id: 'cafe',  n: '동네 카페 ☕',     cost: 5000e4, profit: 300e4 },
  { id: 'chick', n: '치킨집 🍗',        cost: 2e8,    profit: 1000e4 },
  { id: 'mart',  n: '편의점 체인 🏪',   cost: 20e8,   profit: 8000e4 },
  { id: 'game',  n: '게임 회사 🎮',     cost: 150e8,  profit: 5e8 },
  { id: 'ai',    n: 'AI 스타트업 🤖',   cost: 1000e8, profit: 30e8 },
];
const BIZ_GROW = 1.7;   // 확장할 때마다 비용 증가 배수

const MILESTONES = [1e7, 1e8, 1e9, 1e10, 1e11, 1e12];

const DEPOSIT_RATE = .03, LOAN_RATE = .06;

// ================= 유틸 =================
const $ = id => document.getElementById(id);
const rand = (a, b) => a + Math.random() * (b - a);
const chance = p => Math.random() < p;
function gauss() { let u = 0, v = 0; while (!u) u = Math.random(); while (!v) v = Math.random(); return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v); }

function fmt(n) {
  const s = n < 0 ? '-' : '';
  n = Math.abs(n);
  if (n >= 1e12) return s + (n / 1e12).toFixed(2).replace(/\.?0+$/, '') + '조';
  if (n >= 1e8) {
    const eok = Math.floor(n / 1e8), man = Math.floor((n % 1e8) / 1e4);
    return s + eok.toLocaleString() + '억' + (man && eok < 100 ? ' ' + man.toLocaleString() + '만' : '') + '원';
  }
  if (n >= 1e4) return s + Math.floor(n / 1e4).toLocaleString() + '만원';
  return s + Math.floor(n).toLocaleString() + '원';
}
function pct(x) { return (x >= 0 ? '+' : '') + (x * 100).toFixed(1) + '%'; }

// ================= 상태 =================
let S;
function newState() {
  const st = {
    month: 0, cash: 100e4, skill: 0, job: 0,
    deposit: 0, loan: 0,
    stocks: {}, estate: {}, biz: {},
    housing: 1, market: { s: 'norm', left: 12 },
    hist: [], log: [], miles: 0, over: false, clicks: 0,
  };
  STOCKS.forEach(k => st.stocks[k.id] = { p: k.p, qty: 0, cost: 0, h: [k.p] });
  ESTATE.forEach(e => st.estate[e.id] = 0);
  BIZ.forEach(b => st.biz[b.id] = 0);
  return st;
}
function save() { try { localStorage.setItem('richgame_v1', JSON.stringify(S)); } catch (e) {} }
function load() {
  try { const t = localStorage.getItem('richgame_v1'); if (t) return JSON.parse(t); } catch (e) {}
  return null;
}

// ================= 계산 =================
const job = () => JOBS[S.job];
const clickValue = () => Math.round(job().click * (1 + S.skill * 0.1));
const salary = () => Math.round(job().sal * (1 + S.skill * 0.03));
const skillCost = () => Math.round(20e4 * Math.pow(1.32, S.skill));
const living = () => Math.round(70e4 + salary() * 0.35);
const estatePrice = e => Math.round(e.p * S.housing);
const estateRent = e => Math.round(e.rent * Math.sqrt(S.housing));
const bizCost = b => Math.round(b.cost * Math.pow(BIZ_GROW, S.biz[b.id]));
const bizProfit = b => b.profit * S.biz[b.id] * (1 + 0.15 * Math.max(0, S.biz[b.id] - 1));
const marketMul = () => S.market.s === 'boom' ? 1.2 : S.market.s === 'bust' ? 0.75 : 1;

function stockValue() { return STOCKS.reduce((a, k) => a + S.stocks[k.id].qty * S.stocks[k.id].p, 0); }
function estateValue() { return ESTATE.reduce((a, e) => a + S.estate[e.id] * estatePrice(e), 0); }
function bizValue() {   // 사업체 가치 = 투자한 돈의 절반
  return BIZ.reduce((a, b) => {
    let sum = 0; for (let i = 0; i < S.biz[b.id]; i++) sum += b.cost * Math.pow(BIZ_GROW, i);
    return a + sum * 0.5;
  }, 0);
}
function netWorth() { return S.cash + S.deposit + stockValue() + estateValue() + bizValue() - S.loan; }
function loanLimit() {
  return Math.max(0, Math.round(5000e4 + estateValue() * 0.6 + S.deposit * 0.9 + stockValue() * 0.3 + bizValue() * 0.5) - S.loan);
}
function rentIncome() { return ESTATE.reduce((a, e) => a + S.estate[e.id] * estateRent(e), 0); }
function bizIncome() { return BIZ.reduce((a, b) => a + bizProfit(b), 0) * marketMul(); }
function monthlyFlow() {
  return salary() + rentIncome() + bizIncome() + S.deposit * DEPOSIT_RATE / 12 - living() - S.loan * LOAN_RATE / 12;
}

// ================= 로그 / 토스트 =================
function ageStr(m = S.month) { return (START_AGE + Math.floor(m / 12)) + '세 ' + (m % 12 + 1) + '월'; }
function log(msg) {
  S.log.unshift({ t: ageStr(), m: msg });
  if (S.log.length > 60) S.log.length = 60;
  renderLog();
}
let toastT;
function toast(msg) {
  const t = $('toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('show'), 2200);
}

// ================= 모달 =================
let paused = false;
function modal(title, html, buttons) {
  paused = true;
  $('mTitle').textContent = title;
  $('mBody').innerHTML = html;
  const mb = $('mBtns'); mb.innerHTML = '';
  buttons.forEach(([label, cls, fn]) => {
    const b = document.createElement('button'); b.textContent = label; if (cls) b.className = cls;
    b.onclick = () => { $('modal').classList.add('hidden'); paused = false; fn && fn(); render(); save(); };
    mb.appendChild(b);
  });
  $('modal').classList.remove('hidden');
}

// ================= 이벤트 =================
const EVENTS = [
  { w: 10, f: () => { const v = 5e4; S.cash += v; log('🎫 로또 4등 당첨! +' + fmt(v)); } },
  { w: 0.15, f: () => { const v = 20e8; S.cash += v; log('🎉🎉 로또 1등 당첨!!! +' + fmt(v)); toast('로또 1등!!! +20억'); } },
  { w: 6, f: () => { const v = 30e4; S.cash -= v; log('🤧 독감에 걸렸어요. 병원비 -' + fmt(v)); } },
  { w: 5, f: () => { const v = 120e4; S.cash -= v; log('📱 휴대폰을 떨어뜨렸어요. 수리비 -' + fmt(v)); } },
  { w: 6, f: () => { const v = salary(); S.cash += v; log('🎁 성과급이 나왔어요! +' + fmt(v)); } },
  { w: 4, c: () => S.month < 120, f: () => { const v = 50e4; S.cash += v; log('👵 할머니가 용돈을 주셨어요. +' + fmt(v)); } },
  { w: 3, c: () => netWorth() > 10e8, f: () => { const v = Math.round(S.cash * 0.03); S.cash -= v; log('🧾 세무조사! 추가 세금 -' + fmt(v)); } },
  { w: 4, f: () => { stockShock('dog', rand(2.5, 5)); log('🚀 유명 인플루언서가 멍멍코인을 언급! 가격 폭등'); } },
  { w: 4, f: () => { stockShock('dog', rand(.2, .4)); log('💥 코인 거래소 해킹! 멍멍코인 폭락'); } },
  { w: 4, f: () => { stockShock('star', 1.2); log('📱 별빛전자 신제품 대박! 주가 +20%'); } },
  { w: 4, f: () => { stockShock('mal', 1.6); log('🎮 말랑게임즈 신작 흥행 대성공! 주가 +60%'); } },
  { w: 4, f: () => { stockShock('mal', .55); log('😱 말랑게임즈 신작 폭망... 주가 -45%'); } },
  { w: 3, f: () => { S.housing *= .93; log('🏛 정부가 부동산 규제 발표. 집값 -7%'); } },
  { w: 3, f: () => { S.housing *= 1.08; log('🚇 신도시·지하철 개발 호재! 집값 +8%'); } },
  { w: 3, c: () => S.biz.cafe + S.biz.chick + S.biz.fish > 0, f: () => {
      const v = Math.round(bizIncome() * 1.5); S.cash += v; log('📺 내 가게가 맛집 방송에 나왔어요! 추가 수익 +' + fmt(v)); } },
  // 선택 이벤트
  { w: 3, c: () => S.cash >= 3000e4, f: () => {
      const amt = Math.round(Math.max(3000e4, S.cash * 0.2) / 1e6) * 1e6;

function stockShock(id, mul) { const s = S.stocks[id]; s.p = Math.max(1, s.p * mul); s.h[s.h.length - 1] = s.p; }
function randomEvent() {
  const list = EVENTS.filter(e => !e.c || e.c());
  const tot = list.reduce((a, e) => a + e.w, 0);
  let r = Math.random() * tot;
  for (const e of list) { r -= e.w; if (r <= 0) { e.f(); return; } }
}

// ================= 한 달 진행 =================
function nextMonth() {
  if (S.over) return;
  S.month++;

  // 경기 변화
  if (--S.market.left <= 0) {
    const r = Math.random();
    const ns = r < .3 ? 'boom' : r < .55 ? 'bust' : 'norm';
    S.market = { s: ns, left: Math.floor(rand(8, 30)) };
    if (ns === 'boom') log('📈 경기 호황이 시작됐어요! 주식·사업이 잘 돼요.');
    else if (ns === 'bust') log('📉 경기 불황이 찾아왔어요… 조심하세요.');
    else log('➖ 경기가 평범해졌어요.');
  }
  const mDrift = S.market.s === 'boom' ? .02 : S.market.s === 'bust' ? -.025 : 0;
  const common = gauss() * .03;   // 시장 전체 움직임

  // 주가
  STOCKS.forEach(k => {
    const s = S.stocks[k.id];
    let r = k.drift + k.beta * (mDrift + common) + k.vol * gauss();
    if (k.id === 'dog' && chance(.04)) r += Math.log(rand(2, 6));    // 코인 펌핑
    if (k.id === 'dog' && chance(.04)) r += Math.log(rand(.15, .5)); // 코인 폭락
    s.p = Math.max(1, s.p * Math.exp(r));
    s.h.push(s.p); if (s.h.length > 48) s.h.shift();
  });

  // 집값
  S.housing *= Math.exp(.004 + mDrift * .3 + gauss() * .012);

  // 돈 들어오고 나가기
  S.cash += salary() + rentIncome() + bizIncome() * rand(.85, 1.15);
  S.cash -= living();
  S.deposit *= 1 + DEPOSIT_RATE / 12;
  S.cash -= S.loan * LOAN_RATE / 12;

  // 이벤트
  if (chance(.22)) randomEvent();

  // 현금이 마이너스면 자동 대출
  if (S.cash < 0) {
    const need = -S.cash;
    if (S.deposit >= need) { S.deposit -= need; S.cash = 0; log('🏦 현금이 부족해 예금에서 ' + fmt(need) + ' 인출했어요.'); }
    else { need > 0 && (S.loan += need); S.cash = 0; log('⚠️ 현금이 부족해 ' + fmt(need) + '을 자동 대출받았어요.'); }
  }

  const nw = netWorth();
  S.hist.push(nw);

  // 파산
  if (nw < -5000e4) { gameOver(true); return; }

  // 목표 달성
  while (S.miles < MILESTONES.length && nw >= MILESTONES[S.miles]) {
    const m = MILESTONES[S.miles++];
    log('🏆 순자산 ' + fmt(m) + ' 돌파!');
    toast('🏆 순자산 ' + fmt(m) + ' 돌파!');
  }

  if (S.month % 12 === 0) log('🎂 ' + (START_AGE + S.month / 12) + '살이 됐어요.');
  if (S.month >= (END_AGE - START_AGE) * 12) { gameOver(false); return; }

  save();
}

function rankOf(nw) {
  if (nw < 0) return ['💸 빚쟁이', '다음 생엔 꼭…'];
  if (nw < 1e8) return ['🙂 평범한 서민', '그래도 열심히 살았어요!'];
  if (nw < 10e8) return ['🏡 든든한 중산층', '내 집 마련 성공!'];
  if (nw < 100e8) return ['💎 자산가', '동네에서 알아주는 부자!'];
  if (nw < 1000e8) return ['🏰 재벌', '뉴스에 나오는 부자!'];
  if (nw < 1e12) return ['👑 대재벌', '나라에서 손꼽히는 부자!'];
  return ['🌟 전설의 갑부', '조 단위 자산! 당신은 전설입니다!'];
}

function gameOver(bankrupt) {
  S.over = true; save(); render();
  const nw = netWorth();
  if (bankrupt) {
    modal('💥 파산!', `<p>빚을 감당할 수 없게 되었어요…<br>${ageStr()}에 게임이 끝났습니다.</p><div class="big">${fmt(nw)}</div><p class="muted">대출은 신중하게! 코인 몰빵은 위험해요.</p>`,
      [['다시 시작', 'gold', restart]]);
  } else {
    const [t, d] = rankOf(nw);
    modal('🎊 은퇴! (60세)', `<p>40년 동안의 부자되기 도전이 끝났어요.</p><div class="muted">최종 순자산</div><div class="big">${fmt(nw)}</div><p style="font-size:22px;font-weight:900">${t}</p><p class="muted">${d}<br>일하기 버튼 ${S.clicks.toLocaleString()}번 클릭</p>`,
      [['다시 도전', 'gold', restart]]);
  }
}
function restart() { S = newState(); log('👋 20살, 통장에 100만원으로 시작! 60살까지 최대한 부자가 되어 보세요.'); tab = 'stock'; render(); save(); }

// ================= 행동 =================
function act(a, id, arg) {
  if (S.over) return;
  if (a === 'buyS') {
    const k = STOCKS.find(x => x.id === id), s = S.stocks[id];
    const qty = Math.floor(S.cash * arg / s.p);
    if (qty < 1) return toast('돈이 부족해요!');
    const cost = qty * s.p;
    S.cash -= cost; s.cost += cost; s.qty += qty;
    log(`🛒 ${k.n} ${qty.toLocaleString()}주 매수 (${fmt(cost)})`);
  }
  if (a === 'sellS') {
    const k = STOCKS.find(x => x.id === id), s = S.stocks[id];
    const qty = arg === 1 ? s.qty : Math.floor(s.qty * arg);
    if (qty < 1) return toast('팔 주식이 없어요!');
    const avg = s.cost / s.qty, gain = qty * (s.p - avg);
    S.cash += qty * s.p; s.cost -= avg * qty; s.qty -= qty;
    if (s.qty === 0) s.cost = 0;
    log(`💵 ${k.n} ${qty.toLocaleString()}주 매도 (${gain >= 0 ? '수익' : '손실'} ${fmt(Math.abs(gain))})`);
  }
  if (a === 'buyE') {
    const e = ESTATE.find(x => x.id === id), p = estatePrice(e);
    if (S.cash < p) return toast('현금이 ' + fmt(p - S.cash) + ' 부족해요! (은행 대출을 써 보세요)');
    S.cash -= p; S.estate[id]++; log(`🏠 ${e.n} 구입! (${fmt(p)})`);
  }
  if (a === 'sellE') {
    const e = ESTATE.find(x => x.id === id), p = estatePrice(e);
    if (!S.estate[id]) return;
    S.cash += p; S.estate[id]--; log(`🔑 ${e.n} 매각 (${fmt(p)})`);
  }
  if (a === 'biz') {
    const b = BIZ.find(x => x.id === id), c = bizCost(b);
    if (S.cash < c) return toast('현금이 ' + fmt(c - S.cash) + ' 부족해요!');
    S.cash -= c; S.biz[id]++;
    log(S.biz[id] === 1 ? `🎉 ${b.n} 창업!` : `📈 ${b.n} Lv.${S.biz[id]}로 확장!`);
  }
  if (a === 'dep') {
    const v = Math.floor(S.cash * arg); if (v <= 0) return toast('현금이 없어요!');
    S.cash -= v; S.deposit += v; log('🏦 예금 ' + fmt(v) + ' 입금');
  }
  if (a === 'wd') {
    const v = Math.floor(S.deposit * arg); if (v <= 0) return toast('예금이 없어요!');
    S.deposit -= v; S.cash += v; log('🏦 예금 ' + fmt(v) + ' 출금');
  }
  if (a === 'loan') {
    const lim = loanLimit(); const v = arg === 0 ? lim : Math.min(arg, lim);
    if (v < 1e4) return toast('대출 한도가 없어요!');
    S.loan += v; S.cash += v; log('💳 ' + fmt(v) + ' 대출 (연 ' + LOAN_RATE * 100 + '%)');
  }
  if (a === 'repay') {
    const v = Math.min(S.cash, S.loan, arg === 0 ? Infinity : arg);
    if (v <= 0) return toast(S.loan ? '현금이 없어요!' : '갚을 빚이 없어요!');
    S.loan -= v; S.cash -= v; log('✅ 대출 ' + fmt(v) + ' 상환');
  }
  render(); save();
}

function spark(h) {
  if (h.length < 2) return '';
  const mn = Math.min(...h), mx = Math.max(...h), r = mx - mn || 1;
  const pts = h.map((v, i) => `${(i / (h.length - 1) * 100).toFixed(1)},${(38 - (v - mn) / r * 34).toFixed(1)}`).join(' ');
  const col = h[h.length - 1] >= h[0] ? 'var(--up)' : 'var(--down)';
  return `<svg class="spark" viewBox="0 0 100 40" preserveAspectRatio="none"><polyline points="${pts}" fill="none" stroke="${col}" stroke-width="1.6" vector-effect="non-scaling-stroke"/></svg>`;
}

function drawChart() {
  const c = $('chart'), dpr = devicePixelRatio || 1;
  const w = c.clientWidth, hgt = c.clientHeight;
  c.width = w * dpr; c.height = hgt * dpr;
  const g = c.getContext('2d'); g.scale(dpr, dpr); g.clearRect(0, 0, w, hgt);
  const h = S.hist;
  if (h.length < 2) {
    g.fillStyle = '#8e9ab8'; g.font = '13px sans-serif'; g.fillText('한 달이 지나면 그래프가 그려져요', 10, hgt / 2); return;
  }
  const mn = Math.min(0, ...h), mx = Math.max(...h), r = mx - mn || 1;
  const x = i => i / (h.length - 1) * (w - 4) + 2, y = v => hgt - 6 - (v - mn) / r * (hgt - 22);
  if (mn < 0) { g.strokeStyle = '#2c3854'; g.beginPath(); g.moveTo(0, y(0)); g.lineTo(w, y(0)); g.stroke(); }
  const grad = g.createLinearGradient(0, 0, 0, hgt); grad.addColorStop(0, 'rgba(255,204,77,.35)'); grad.addColorStop(1, 'rgba(255,204,77,0)');
  g.beginPath(); g.moveTo(x(0), y(mn)); h.forEach((v, i) => g.lineTo(x(i), y(v))); g.lineTo(x(h.length - 1), y(mn)); g.fillStyle = grad; g.fill();
  g.beginPath(); h.forEach((v, i) => i ? g.lineTo(x(i), y(v)) : g.moveTo(x(i), y(v))); g.strokeStyle = '#ffcc4d'; g.lineWidth = 2; g.stroke();
  g.fillStyle = '#8e9ab8'; g.font = '12px sans-serif'; g.fillText('최고 ' + fmt(mx), 6, 13);
}

function render() {
  $('sAge').textContent = ageStr();
  $('sCash').textContent = fmt(S.cash);
  $('sNet').textContent = fmt(netWorth());
  const f = monthlyFlow();
  $('sFlow').innerHTML = `<span class="${f >= 0 ? 'good' : 'bad'}">${f >= 0 ? '+' : ''}${fmt(f)}</span>`;
  const ms = S.market.s;
  $('sMarket').innerHTML = `<span class="badge ${ms}">${ms === 'boom' ? '호황 🔥' : ms === 'bust' ? '불황 🥶' : '보통'}</span>`;

  $('clickVal').textContent = '+' + fmt(clickValue()) + ' / 클릭';
  $('jobName').textContent = job().n;
  $('jobSal').textContent = '월급 ' + fmt(salary());
  $('ladder').innerHTML = JOBS.map((_, i) => `<span class="${i <= S.job ? 'on' : ''}"></span>`).join('');
  $('skLv').textContent = S.skill;
  $('skBtn').textContent = fmt(skillCost());
  $('skBtn').disabled = S.cash < skillCost() || S.over;
  const nj = JOBS[S.job + 1];
  if (nj) {
    $('promoTxt').innerHTML = `다음: <b>${nj.n}</b> (자기계발 Lv.${nj.req} 필요)`;
    $('promoBtn').disabled = S.skill < nj.req || S.over;
  } else { $('promoTxt').textContent = '최고 자리에 올랐어요! 👑'; $('promoBtn').disabled = true; }

  document.querySelectorAll('#speed button').forEach(b => b.classList.toggle('on', +b.dataset.speed === speed));
  renderTab();
  drawChart();
}

// ================= 입력 =================
$('workBtn').addEventListener('click', e => {
  if (S.over) return;
  const v = clickValue(); S.cash += v; S.clicks++;
  const f = document.createElement('div'); f.className = 'float'; f.textContent = '+' + fmt(v);
  const x = e.clientX || (e.target.getBoundingClientRect().left + 100), y = e.clientY || e.target.getBoundingClientRect().top + 40;
  f.style.left = (x - 30 + rand(-20, 20)) + 'px'; f.style.top = (y - 20) + 'px';
  document.body.appendChild(f); setTimeout(() => f.remove(), 900);
  render();
});
$('skBtn').addEventListener('click', () => {
  const c = skillCost(); if (S.cash < c) return;
  S.cash -= c; S.skill++; log('📚 자기계발 Lv.' + S.skill + ' 달성!'); render(); save();
});
$('promoBtn').addEventListener('click', () => {
  const nj = JOBS[S.job + 1]; if (!nj || S.skill < nj.req) return;
  S.job++; log('🎊 승진! 이제 ' + job().n + ' (월급 ' + fmt(salary()) + ')'); toast('🎊 승진! ' + job().n); render(); save();
});
$('tabs').addEventListener('click', e => { const b = e.target.closest('button'); if (b) { tab = b.dataset.tab; renderTab(); } });
$('tabBody').addEventListener('click', e => {
  const b = e.target.closest('button[data-a]'); if (!b) return;
  act(b.dataset.a, b.dataset.id, b.dataset.arg !== undefined ? +b.dataset.arg : undefined);
});
$('speed').addEventListener('click', e => { const b = e.target.closest('button'); if (b) { speed = +b.dataset.speed; render(); } });
$('resetBtn').addEventListener('click', () => {
  modal('새 게임?', '<p>지금까지의 기록이 모두 사라져요.</p>', [['새로 시작', 'red', restart], ['취소', '', null]]);
});
addEventListener('resize', drawChart);

// ================= 시간 흐름 =================
let acc = 0, last = performance.now();
function loop(now) {
  const dt = Math.min(now - last, 200); last = now;
  if (!paused && !S.over && speed > 0) {
    acc += dt * speed;
    if (acc >= MONTH_MS) { acc -= MONTH_MS; nextMonth(); if (!S.over) render(); }
  }
  $('timebar').firstElementChild.style.width = (acc / MONTH_MS * 100) + '%';
  requestAnimationFrame(loop);
}

// ================= 시작 =================
S = load();
if (!S || S.over) {
  S = newState();
  log('👋 20살, 통장에 100만원으로 시작! 60살까지 최대한 부자가 되어 보세요.');
  render();
  modal('💰 부자되기 대작전', `<p style="text-align:left">
    20살, 통장 잔고 <b>100만원</b>.<br>60살 은퇴할 때까지 <b>최대한 부자</b>가 되어 보세요!<br><br>
    💼 <b>일하기</b> 버튼을 눌러 돈 벌기<br>
    📚 <b>자기계발</b>로 실력을 쌓고 <b>승진</b><br>
    📊 주식·코인으로 한탕? 🏠 부동산으로 월세?<br>
    🏪 사업을 키워 매달 수익 올리기<br>
    🏦 대출로 레버리지! 단, 빚이 너무 많으면 <b class="bad">파산</b><br><br>
    <span class="muted">1달 = 2.5초. 오른쪽 위에서 속도 조절·일시정지 가능. 자동 저장돼요.</span></p>`,
    [['게임 시작!', 'gold', null]]);
} else {
  render();
  toast('저장된 게임을 불러왔어요');
}
requestAnimationFrame(loop);
</script>
</body>
</html>
