let S = null;

const $ = id => document.getElementById(id);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const rand = (a, b) => a + Math.random() * (b - a);
const pickOne = arr => arr[Math.floor(Math.random() * arr.length)];
function pick2() { const a = MAJORS.slice().sort(() => Math.random() - .5); return [a[0], a[1]]; }
function avgGpa(s) { return s.gpas.length ? s.gpas.reduce((a, b) => a + b, 0) / s.gpas.length : 0; }
function avgMajor(s) { return MAJORS.reduce((a, k) => a + s[k], 0) / MAJORS.length; }

function newState(name, gender, trait) {
  const s = {
    name, gender, trait, advisor: pickOne(FULLTIME).name, year: 1, sem: 1, turn: 0,
    org: 10, svc: 10, dig: 10, edu: 10, arc: 10,
    hp: 80, stress: 20, money: 100, social: 10, exp: 0, prep: 0,
    gpas: [], studyCount: 0, teacher: false, teacherAsked: false, career: null,
    bonusGpa: 0, log: [], done: false
  };
  applyFx(s, TRAITS[trait].fx);
  return s;
}

// 효과 적용 + 설명 문자열 반환
function applyFx(s, fx) {
  const parts = [];
  for (const k in fx) {
    let v = fx[k];
    if (!v) continue;
    // 인싸 특성: 스트레스 증가 20% 감소
    if (k === 'stress' && v > 0 && s.trait === 'insider') v = Math.round(v * 0.8);
    s[k] += v;
    if (k !== 'money') s[k] = clamp(s[k], 0, 100);
    const good = k === 'stress' ? v < 0 : v > 0;
    parts.push(`<span class="${good ? 'up' : 'down'}">${LABEL[k]} ${v > 0 ? '+' : ''}${fmt1(v)}${k === 'money' ? '만원' : ''}</span>`);
  }
  return parts.join(' · ');
}

function whenText(s) {
  if (s.done) return '졸업';
  const t = Math.min(s.turn, TURNS - 1);
  return `${s.year}학년 ${s.sem}학기 · ${monthOf(s)}월 ${t % 4 + 1}주차`;
}

function addLog(html) {
  S.log.unshift({ t: whenText(S), h: html });
  if (S.log.length > 80) S.log.pop();
}

      ${S.career ? `<div class="sub">목표: ${CAREERS[S.career].emoji} ${CAREERS[S.career].name}</div>` : ''}</div></div>
    <h2>전공 능력</h2>${MAJORS.map(bar).join('')}
    <h2 style="margin-top:14px">컨디션</h2>${bar('hp')}${bar('stress')}
    <h2 style="margin-top:14px">스펙</h2>${bar('social')}${bar('exp')}${bar('prep')}
    <div class="kv">
      <div><span>돈</span><b>${Math.round(S.money)}만원</b></div>
      <div><span>평균 학점</span><b>${S.gpas.length ? avgGpa(S).toFixed(2) : '-'} / 4.5</b></div>
    </div>`;

  if (S.done) { $('actions').innerHTML = '<h2>졸업을 축하합니다 🎓</h2><p>‘처음부터’를 눌러 다시 시작할 수 있어요.</p>'; }
  else {
    normalizeSchedule();
    const acts = availableActions(S);
    const okActs = acts.filter(x => !x.need || x.need(S));
    if (!okActs.find(x => x.id === brush)) brush = okActs[0].id;
    const groups = {};
    acts.forEach(x => { if (x.id === 'teach' && !x.need(S)) return; (groups[x.group] = groups[x.group] || []).push(x); });
    const gCls = g => g === '전공 공부' ? 'g-study' : (g === '휴식' || g === '놀기') ? 'g-rest' : 'g-act';
    let html = `<h2>${monthOf(S)}월 ${S.turn % 4 + 1}주차 시간표 <span style="font-weight:500">(${S.turn + 1}/${TURNS}주)</span></h2>
      <p class="hint">① 아래에서 활동을 고르고 ② 시간표 칸을 눌러 채운 뒤 ③ ‘이번 주 보내기’. 시간표는 다음 주에도 그대로 이어진다.</p>`;
    for (const g in groups) {
      html += `<h3>${g}</h3><div class="palette">` + groups[g].map(x => {
        const ok = !x.need || x.need(S);
        return `<button data-brush="${x.id}" class="${x.id === brush ? 'sel' : ''}" ${ok ? '' : 'disabled'} title="${x.desc}">${x.name}</button>`;
      }).join('') + '</div>';
    }
    html += `<div class="tt"><div></div>${DAYS.map(d => `<div class="hd">${d}</div>`).join('')}`;
    PERIODS.forEach((pd, r) => {
      html += `<div class="hd">${pd}</div>`;
      DAYS.forEach((d, c) => {
        const i = r * DAYS.length + c, x = acts.find(y => y.id === S.schedule[i]);
        html += `<button class="cell ${gCls(x.group)}" data-slot="${i}" title="${d} ${pd}: ${x.name}">${x.name}</button>`;
      });
    });
    html += '</div>';
    const cnt = { '전공 공부': 0, '활동': 0, '휴식': 0, '놀기': 0 };
    S.schedule.forEach(id => cnt[acts.find(y => y.id === id).group]++);
    html += `<div class="tt-sum">이번 주: 공부 ${cnt['전공 공부']}칸 · 활동 ${cnt['활동']}칸 · 휴식 ${cnt['휴식']}칸 · 놀기 ${cnt['놀기']}칸</div>
      <div class="run"><button id="fillBtn">선택한 활동으로 전부 채우기</button><button class="primary" id="weekBtn">▶ 이번 주 보내기</button></div>`;
    $('actions').innerHTML = html;
    $('actions').querySelectorAll('[data-brush]').forEach(b => b.onclick = () => { brush = b.dataset.brush; render(); });
    $('actions').querySelectorAll('[data-slot]').forEach(b => b.onclick = () => { S.schedule[+b.dataset.slot] = brush; render(); });
    $('fillBtn').onclick = () => { S.schedule = Array(SLOTS).fill(brush); render(); };
    $('weekBtn').onclick = playWeek;
  }
  $('log').innerHTML = S.log.map(l => `<p><span class="t">${l.t}</span>${l.h}</p>`).join('');
}

function esc(t) { return String(t).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }

// ================= 모달 =================
function showModal(m) {
  // m: {emoji, title, body, choices:[{label, sub, fn}]}
  const box = $('modal');
  box.innerHTML = `${m.emoji ? `<div class="emoji">${m.emoji}</div>` : ''}<h2>${m.title}</h2><div class="body">${m.body || ''}</div><div class="choices"></div>`;
  const wrap = box.querySelector('.choices');
  (m.choices || [{ label: '확인' }]).forEach(c => {
    const b = document.createElement('button');
    b.className = 'choice';
    b.innerHTML = `${c.label}${c.sub ? `<small>${c.sub}</small>` : ''}`;
    b.onclick = () => {
      $('modalBg').classList.add('hidden');
      if (c.fn) c.fn();
      render();
      nextModal();
    };
    wrap.appendChild(b);
  });
  $('modalBg').classList.remove('hidden');
  const first = wrap.querySelector('button'); if (first) first.focus();
}
function queue(m) { pendingQueue.push(m); }
function nextModal() {
  if (!$('modalBg').classList.contains('hidden')) return;
  const m = pendingQueue.shift();
  if (m) showModal(typeof m === 'function' ? m() : m);
}
function fxSub(fx) {
  return Object.keys(fx).filter(k => fx[k]).map(k => `${LABEL[k]} ${fx[k] > 0 ? '+' : ''}${fx[k]}`).join(', ');
}

// ================= 게임 진행 =================
let brush = null;
const isStudyId = id => /^c\d\d_\d$/.test(id) || id === 'teach';
// 시간표를 지금 학기에 맞게 정리 (학기가 바뀌면 과목도 바뀐다)
function normalizeSchedule() {
  const subj = studyList(S), acts = availableActions(S);
  const ok = id => { const x = acts.find(y => y.id === id); return x && (!x.need || x.need(S)); };
  if (!Array.isArray(S.schedule) || S.schedule.length !== SLOTS) {
    // 기본 시간표: 오전은 전공 수업, 오후는 공부·근로·동아리·휴식
    S.schedule = [...DAYS.map((_, i) => subj[i % subj.length].id), subj[0].id, 'work', subj[1 % subj.length].id, 'club', 'rest'];
  }
  let k = 0;
  S.schedule = S.schedule.map(id => ok(id) ? id : isStudyId(id) ? subj[k++ % subj.length].id : 'rest');
}

function runWeek() {
  const acts = availableActions(S);
  const before = {}; for (const k in LABEL) before[k] = S[k];
  let study = 0;
  S.schedule.forEach(id => {
    const x = acts.find(y => y.id === id);
    if (!x || (x.need && !x.need(S))) return;
    applyFx(S, scaleFx(x.fx));
    if (x.study) study++;
  });
  S.studyCount += study;
  const drinks = S.schedule.filter(id => id === 'drink').length;
  if (drinks >= 3) {
    S.studyCount = Math.max(0, S.studyCount - 2);
    applyFx(S, { hp: -4, stress: 3 });
    addLog(`🍺 술자리가 ${drinks}번… 숙취로 다음 날 수업에 집중하지 못했다. (공부 2칸 무효 · 체력 -4)`);
  }
  const diff = Object.keys(LABEL).map(k => {
    const d = S[k] - before[k];
    if (Math.abs(d) < 0.05) return '';
    const good = k === 'stress' ? d < 0 : d > 0;
    return `<span class="${good ? 'up' : 'down'}">${LABEL[k]} ${d > 0 ? '+' : ''}${fmt1(d)}</span>`;
  }).filter(Boolean).join(' · ');
  addLog(`📅 <b>한 주 마무리</b> (공부 ${study}칸) — ${diff || '변화 없음'}`);

  // 컨디션 체크
  if (S.money < 0) {
    S.money = 0; applyFx(S, { stress: 5 });
    addLog('💳 통장이 바닥났다… 이번 주는 라면으로 버텼다. 스트레스 +5');
  }
  if (S.hp <= 0) {
    S.hp = 25; S.studyCount = Math.max(0, S.studyCount - SLOTS);
    const r = applyFx(S, { money: -10, stress: 5 });
    addLog(`🚑 과로로 쓰러졌다. 병원 신세… ${r}`);
    queue({ emoji: '🚑', title: '쓰러졌다!', body: '<p>무리하다가 결국 몸살이 났다. 일주일 내내 수업을 빠졌다.</p><p>시간표에 휴식 칸을 꼭 넣자!</p>' });
  } else if (S.stress >= 100) {
    S.stress = 70;
    addLog('🔥 번아웃이 왔다. 아무것도 손에 잡히지 않는다.');
    queue({ emoji: '🔥', title: '번아웃', body: '<p>스트레스가 한계에 달했다. 이번 학기 성적에 영향이 있을지도…</p><p>시간표에 휴식을 늘려 보자.</p>' });
    S.burnout = true;
  }
  S.turn++;
  fixedOrRandomEvent();
  if (S.turn >= TURNS) queue(() => endSemester());
}

// 한 주를 월요일 오전부터 금요일 오후까지 한 칸씩 보여 주며 진행
let busy = false;
function playWeek() {
  if (busy) return;
  busy = true;
  $('actions').classList.add('busy');
  $('weekBtn').textContent = '⏳ 한 주를 보내는 중…';
  const order = [];
  DAYS.forEach((_, c) => PERIODS.forEach((_, r) => order.push(r * DAYS.length + c)));
  let i = 0;
  const step = () => {
    $('actions').querySelectorAll('[data-slot]').forEach(el => {
      const k = order.indexOf(+el.dataset.slot);
      el.classList.toggle('now', k === i);
      el.classList.toggle('past', k < i);
    });
    if (i++ < order.length) setTimeout(step, 220);
    else {
      busy = false;
      $('actions').classList.remove('busy');
      runWeek();
      render();
      nextModal();
    }
  };
  step();
}

function fixedOrRandomEvent() {
  const w = S.turn - 1; // 방금 끝난 주 (0~15)
  if (w === 7) { queue(midterm()); return; }                                   // 4월·10월 4주차
  if (S.sem === 1 && w === 9) { queue(festival()); return; }                   // 5월 2주차
  if (S.sem === 2 && w === 3) { queue(fieldTrip()); return; }                  // 9월 4주차
  if (S.sem === 2 && w === 10 && S.year >= 2) { queue(conference()); return; } // 11월 3주차
  if (S.year === 4 && S.sem === 1 && w === 13 && S.teacher) { queue(practicum()); return; } // 6월 2주차
  if (w < TURNS - 1 && Math.random() < 0.15) randomEvent();
}
function randomEvent() {
  const r = Math.random();
  if (r < 0.22) queue(professorEvent());
  else if (r < 0.27 && S.year >= 2) queue(lectureEvent());
  else if (r < 0.6) queue(quizEvent());
  else queue(eventModal(pickOne(EVENTS)));
}

function eventModal(e) {
  return {
    emoji: e.emoji, title: e.title, body: `<p>${e.body}</p>`,
    choices: e.choices.map(c => ({ label: c.label, sub: fxSub(c.fx), fn: () => {
      let r = applyFx(S, c.fx);
      if (c.after) r += (r ? ' · ' : '') + c.after();
      addLog(`${e.emoji} ${e.title}: ${c.label}${r ? ' — ' + r : ''}`);
    } }))
  };
}

function quizEvent() {
  const q = pickOne(QUIZ);
  const opts = [q.a, ...q.w].sort(() => Math.random() - .5);
  return {
    emoji: '🔎', title: '참고봉사 데스크', body: `<p>${q.q}</p>`,
    choices: opts.map(o => ({ label: o, fn: () => {
      const right = o === q.a;
      const r = applyFx(S, right ? { svc: 4, org: 3, stress: -3 } : { stress: 4 });
      addLog(`🔎 참고봉사 퀴즈 ${right ? '정답!' : '오답…'} — ${r}`);
      pendingQueue.unshift({ emoji: right ? '⭕' : '❌', title: right ? '정답!' : '아쉽다!', body: `<p>${q.ex}</p><p>${r}</p>` });
    } }))
  };
}

function professorEvent() {
  const advisor = S.advisor && Math.random() < 0.5;
  const p = advisor ? profByName(S.advisor) : pickOne(PROFESSORS.filter(x => !x.emeritus));
  const who = `${p.name} ${p.title.replace(' · 학과장', '')}님`;
  return eventModal({
    emoji: '🧑‍🏫', title: advisor ? '지도교수 면담' : `${p.name} 교수님 연구실`,
    body: `${advisor ? `지도교수 ${who}께서 면담을 하자고 부르셨다.` : `${who}의 연구실 앞을 지나가다 인사를 드렸다.`}<br><small style="color:var(--muted)">담당 과목: ${p.subj}</small>`,
    choices: [
      { label: '수업 내용 중 궁금했던 걸 여쭤본다', fx: Object.assign({ stress: 2 }, p.fx) },
      { label: '진로 고민을 털어놓는다', fx: { prep: 3, exp: 2, stress: -5 } }
    ] });
}
function lectureEvent() {
  const p = profByName('윤희윤');
  return eventModal({ emoji: '🎙️', title: `${p.name} 명예교수님 특강`, body: `학과에서 ${p.name} 명예교수님 특강이 열렸다.<br><small style="color:var(--muted)">담당 과목: ${p.subj}</small>`, choices: [
    { label: '맨 앞자리에서 경청한다', fx: p.fx },
    { label: '용기 내서 질문한다', fx: { svc: 3, social: 3, stress: 4 } },
    { label: '과제 때문에 못 갔다', fx: { stress: 3 } } ] });
}
function midterm() {
  return eventModal({ emoji: '✍️', title: '중간고사 기간', body: `${S.sem === 1 ? '4월' : '10월'} 말, 중간고사가 다가왔다. 중앙도서관 열람실 자리 잡기 전쟁이 시작됐다.`, choices: [
    { label: '열람실에서 밤샘 공부', fx: { hp: -10, stress: 10 }, after: () => { S.bonusGpa += 0.2; return '<span class="up">학점 보너스</span>'; } },
    { label: '평소 실력으로 본다', fx: { stress: 4 } },
    { label: '이번 중간은 내려놓는다…', fx: { stress: -8 }, after: () => { S.bonusGpa -= 0.25; return '<span class="down">학점 감점</span>'; } } ] });
}
function festival() {
  return eventModal({ emoji: '🎆', title: '대동제 시즌', body: '캠퍼스가 축제로 들썩인다. 학과에서도 부스를 연다고 한다.', choices: [
    { label: '학과 주점 운영 돕기', fx: { social: 10, money: 10, hp: -10 } },
    { label: '공연 보며 즐기기', fx: { stress: -18, money: -10 } },
    { label: '축제? 나는 도서관으로', fx: { org: 3, svc: 3, social: -3 } } ] });
}
function conference() {
  return eventModal({ emoji: '🎤', title: '5개대학 문헌정보학과 학술연합제', body: '여러 대학 문헌정보학과 학생들이 모이는 학술연합제가 열린다.', choices: [
    { label: '팀을 꾸려 발표자로 참가', fx: { svc: 3, dig: 3, exp: 5, social: 6, stress: 10, hp: -5 } },
    { label: '청중으로 참석해 교류', fx: { social: 6, svc: 2, stress: -3 } },
    { label: '이번엔 쉬어 간다', fx: { hp: 5 } } ] });
}
function fieldTrip() {
  return eventModal({ emoji: '🚌', title: '문헌정보학기행', body: '학과 비교과 프로그램 ‘문헌정보학기행’! 이번 행선지를 고를 수 있다.', choices: [
    { label: '국립중앙도서관 견학 (서울)', fx: { svc: 5, org: 4, exp: 3, money: -15 } },
    { label: '대구 지역 공공도서관 탐방', fx: { svc: 4, edu: 4, exp: 2 } },
    { label: '기록관 견학', fx: { arc: 8, exp: 2, money: -5 } } ] });
}
function practicum() {
  return eventModal({ emoji: '🏫', title: '교생 실습', body: '학교도서관으로 교생 실습을 나갔다. 학생들이 “선생님!” 하고 부른다.', choices: [
    { label: '독서 수업을 열심히 준비한다', fx: { edu: 10, exp: 6, hp: -10, stress: 6 } },
    { label: '도서관 행사를 기획한다', fx: { edu: 6, social: 6, exp: 6, hp: -6 } } ] });
}

function endSemester() {
  let g = 2.2 + (S.studyCount / (TURNS * SLOTS)) * 1.92 + (avgMajor(S) / 100) * 0.6 + S.bonusGpa + rand(-0.15, 0.15);
  if (S.stress >= 80 || S.burnout) g -= 0.4;
  if (S.hp < 20) g -= 0.2;
  g = Math.round(clamp(g, 0, 4.5) * 100) / 100;
  S.gpas.push(g);
  const label = `${S.year}학년 ${S.sem}학기`;
  addLog(`📄 <b>${label} 성적: ${g.toFixed(2)}</b> (공부 ${S.studyCount}칸 / ${TURNS * SLOTS}칸)`);
  S.studyCount = 0; S.bonusGpa = 0; S.burnout = false;
  const comment = g >= 4.2 ? '과탑을 노려볼 만하다!' : g >= 3.5 ? '꽤 괜찮은 성적이다.' : g >= 2.5 ? '조금 더 분발하자.' : '학사경고는 피했지만… 위험하다.';

  // 방학 선택 (4학년 2학기면 바로 졸업)
  if (S.year === 4 && S.sem === 2) queue(() => graduation());
  else queue(() => vacationModal());

  return { emoji: '📄', title: `${label} 기말고사 끝!`, body: `<p>이번 학기 학점은 <b>${g.toFixed(2)}</b> / 4.5</p><p>${comment}</p><p>누적 평균 ${avgGpa(S).toFixed(2)}</p>` };
}

function vacationModal() {
  const season = S.sem === 1 ? '여름방학' : '겨울방학';
  return {
    emoji: S.sem === 1 ? '🏖️' : '⛄', title: `${S.year}학년 ${season}`, body: '<p>방학을 어떻게 보낼까?</p>',
    choices: VACATIONS.filter(v => !v.need || v.need(S)).map(v => ({ label: v.name, sub: v.desc, fn: () => {
      if (v.fx.money < 0 && S.money + v.fx.money < 0) { addLog(`💳 돈이 부족해 ${v.name}은(는) 포기하고 집에서 쉬었다.`); applyFx(S, { hp: 15, stress: -10 }); }
      else {
        let r = applyFx(S, v.fx);
        if (v.run) r += (r ? ' · ' : '') + `<span class="up">${v.run(S)}</span>`;
        addLog(`${season}: <b>${v.name}</b> — ${r}`);
      }
      startNextSemester();
    } }))
  };
}

function startNextSemester() {
  if (S.sem === 1) S.sem = 2; else { S.sem = 1; S.year++; }
  S.turn = 0;
  // 생활비와 장학금
  const last = S.gpas[S.gpas.length - 1];
  let msg = applyFx(S, { money: -40 });
  let body = `<p>새 학기 생활비가 나갔다. ${msg}</p>`;
  if (last >= 4.2) { const r = applyFx(S, { money: 100 }); body += `<p>🏅 성적우수 장학금! ${r}</p>`; addLog(`🏅 성적우수 장학금 — ${r}`); }
  else if (last >= 3.8) { const r = applyFx(S, { money: 50 }); body += `<p>🎖️ 성적 장학금 일부 지급! ${r}</p>`; addLog(`🎖️ 성적 장학금 — ${r}`); }
  if (S.money < 0) { S.money = 20; applyFx(S, { stress: 10 }); body += '<p>😥 돈이 바닥나 부모님께 손을 벌렸다. 스트레스 +10</p>'; }
  addLog(`🌱 ${S.year}학년 ${S.sem}학기 개강`);
  queue({ emoji: '🌱', title: `${S.year}학년 ${S.sem}학기 개강`, body });

  // 2학년 1학기: 교직 이수 신청
  if (S.year === 2 && S.sem === 1 && !S.teacherAsked) {
    S.teacherAsked = true;
    const g = avgGpa(S);
    if (g >= 3.3) queue({ emoji: '🍎', title: '교직 이수 선발', body: `<p>1학년 평균 학점 ${g.toFixed(2)}로 교직 이수 신청 자격이 생겼다. 사서교사가 되려면 교직 과정이 필요하다.</p><p>대신 수업 부담이 늘어난다.</p>`, choices: [
      { label: '신청한다', sub: '‘교직 수업’ 행동 해금 · 스트레스 +5', fn: () => { S.teacher = true; applyFx(S, { stress: 5 }); addLog('🍎 교직 이수 확정!'); } },
      { label: '신청하지 않는다', fn: () => addLog('교직 이수는 신청하지 않았다.') } ] });
    else queue({ emoji: '🍎', title: '교직 이수 선발', body: `<p>1학년 평균 학점 ${g.toFixed(2)}로는 교직 이수 기준(3.3)에 못 미쳤다. 사서교사의 길은 닫혔지만 다른 길은 많다!</p>` });
  }
  // 3학년 1학기: 시험공부 해금 안내
  if (S.year === 3 && S.sem === 1) queue({ emoji: '📘', title: '3학년이 되었다', body: '<p>이제 ‘임용·공무원 시험공부’와 방학 중 ‘도서관 현장실습’을 할 수 있다. 진로를 슬슬 정해야 할 때다.</p>' });
  // 4학년 1학기: 진로 결정
  if (S.year === 4 && S.sem === 1) queue(() => careerModal());
}

function careerModal() {
  return {
    emoji: '🧭', title: '진로 결정', body: '<p>졸업까지 1년. 어떤 길을 목표로 할까? 목표를 이루려면 조건을 채워야 한다.</p>',
    choices: Object.keys(CAREERS).filter(k => !CAREERS[k].need || CAREERS[k].need(S)).map(k => ({
      label: `${CAREERS[k].emoji} ${CAREERS[k].name}`, sub: careerHint(k),
      fn: () => { S.career = k; addLog(`🧭 진로 목표: <b>${CAREERS[k].name}</b>`); }
    }))
  };
}
function careerHint(k) {
  return {
    gov: '시험준비 70+, 정보서비스 45+',
    teacher: '시험준비 70+, 독서·교육 60+, 학점 3.5+',
    univ: '실무경력 35+, 자료조직 55+, 학점 3.3+',
    arc: '기록관리 50+, 학점 3.5+',
    data: '디지털·데이터 65+, 실무경력 25+',
    pub: '독서·교육 55+, 인맥 45+',
    grad: '학점 4.0+, 전공 평균 55+'
  }[k];
}

function graduation() {
  S.done = true;
  let key = 'none', missed = false;
  if (S.career && CAREERS[S.career].check(S)) key = S.career;
  else {
    if (S.career) missed = true;
    for (const k of Object.keys(CAREERS)) if (CAREERS[k].check(S)) { key = k; break; }
  }
  const [emoji, title, text] = ENDINGS[key](S);
  addLog(`🎓 졸업! 엔딩: <b>${title}</b>`);
  render();
  const rows = [...MAJORS, 'social', 'exp', 'prep'].map(k => `<tr><td>${LABEL[k]}</td><td>${Math.round(S[k])}</td></tr>`).join('');
  const gp = S.gpas.map((g, i) => `${Math.floor(i / 2) + 1}-${i % 2 + 1}: ${g.toFixed(2)}`).join(' · ');
  try { localStorage.removeItem('lis-sim-save'); } catch (e) {}
  return {
    emoji, title: `엔딩 — ${title}`,
    body: `${missed ? `<p style="color:var(--warn)">목표였던 ‘${CAREERS[S.career].name}’은(는) 아쉽게 이루지 못했다. 하지만…</p>` : ''}
      <p>${text}</p>
      ${S.advisor ? `<p>졸업식 날, 지도교수 ${S.advisor} 교수님께 감사 인사를 드렸다.</p>` : ''}
      <p><b>${esc(S.name)}</b> · 최종 평균 학점 <b>${avgGpa(S).toFixed(2)}</b></p>
      <p style="font-size:12px;color:var(--muted)">${gp}</p>
      <table class="tr">${rows}</table>`,
    choices: [{ label: '🔁 다시 하기', fn: () => startScreen() }, { label: '기록 보기' }]
  };
}

// ================= 시작 / 저장 =================
function startScreen() {
  S = null; pendingQueue = [];
  $('side').innerHTML = ''; $('actions').innerHTML = ''; $('log').innerHTML = ''; $('when').textContent = '';
  const pick = { gender: null, trait: null };
  const box = $('modal');
  box.innerHTML = `<div class="emoji">🎒</div><h2>어서 와, 대구대학교 문헌정보학과는 처음이지?</h2>
    <div class="body"><p>교육목표는 ‘미래사회를 선도하는 지식정보 전문가’. 경산 캠퍼스에서의 4년 동안 매달 할 일을 고르고, 방학을 보내고, 졸업 후의 진로를 찾아보자.</p>
    <p class="field-label">이름</p>
    <input class="name" id="nameIn" maxlength="10" placeholder="예시) 홍길동" autocomplete="off">
    <p class="field-label">성별</p>
    <div class="seg" id="genderCh"></div>
    <p class="field-label">나는 어떤 신입생일까?</p></div>
    <div class="choices" id="traitCh"></div>
    <p class="err" id="startErr"></p>
    <button class="go" id="goBtn">입학하기</button>`;
  const select = (wrap, key, val, btn) => {
    pick[key] = val;
    wrap.querySelectorAll('.choice').forEach(x => x.classList.toggle('sel', x === btn));
  };
  const gWrap = $('genderCh');
  Object.keys(GENDERS).forEach(k => {
    const b = document.createElement('button');
    b.className = 'choice'; b.style.textAlign = 'center';
    b.textContent = (k === 'm' ? '🙋‍♂️ ' : '🙋‍♀️ ') + GENDERS[k];
    b.onclick = () => select(gWrap, 'gender', k, b);
    gWrap.appendChild(b);
  });
  const tWrap = $('traitCh');
  Object.keys(TRAITS).forEach(k => {
    const b = document.createElement('button');
    b.className = 'choice';
    b.innerHTML = `${TRAITS[k].name}<small>${TRAITS[k].desc}</small>`;
    b.onclick = () => select(tWrap, 'trait', k, b);
    tWrap.appendChild(b);
  });
  $('goBtn').onclick = () => {
    const name = $('nameIn').value.trim().slice(0, 10);
    const err = !name ? '이름을 적어 주세요.' : !pick.gender ? '성별을 골라 주세요.' : !pick.trait ? '신입생 유형을 골라 주세요.' : '';
    $('startErr').textContent = err;
    if (err) { if (!name) $('nameIn').focus(); return; }
    S = newState(name, pick.gender, pick.trait);
    addLog(`🎒 ${esc(name)}, 문헌정보학과 입학! (${TRAITS[pick.trait].name}) · 지도교수 ${S.advisor} 교수님`);
    $('modalBg').classList.add('hidden');
    render();
    queue({ emoji: '🎉', title: '개강총회', body: `<p>학과 개강총회. 학과장 박광헌 교수님의 환영 인사와 함께 동기·선배들을 만났다.</p><p>“${esc(name)} 학생, 반가워요! 지도교수는 <b>${S.advisor} 교수님</b>이에요.” 조교 선배가 알려준다. “문정과는 졸업하면 정사서 2급 자격증이 나와!”</p><p>한 학기는 16주. 매주 월~금 오전·오후, 일주일에 10칸의 시간표를 짜서 보낸다. 4월·10월 말에는 중간고사도 있다. 공부·활동·휴식의 균형을 잘 맞춰 보자. 체력이 0이 되거나 스트레스가 100이 되면 위험하다!</p>`, choices: [{ label: '시작하기', fn: () => applyFx(S, { social: 3 }) }] });
    nextModal();
  };
  $('modalBg').classList.remove('hidden');
  $('nameIn').focus();
}

function showProfessors() {
  queue({ emoji: '🧑‍🏫', title: '문헌정보학과 교수진', body: `<ul class="prof-list">${PROFESSORS.map(p => `<li><b>${p.name}</b> ${p.title}<span>담당 과목: ${p.subj}</span></li>`).join('')}</ul><p style="font-size:12px;color:var(--muted);margin-top:10px">출처: 대구대학교 문헌정보학과 홈페이지 교수진 페이지</p>` });
  nextModal();
}

function save() {
  if (!S) return;
  try { localStorage.setItem('lis-sim-save', JSON.stringify(S)); toast('💾 저장했어요'); }
  catch (e) { toast('이 브라우저에서는 저장할 수 없어요'); }
}
function load() {
  let data = null;
  try { data = JSON.parse(localStorage.getItem('lis-sim-save')); } catch (e) {}
  if (!data) { toast('저장된 기록이 없어요'); return; }
  S = data; pendingQueue = []; $('modalBg').classList.add('hidden');
  render(); toast('📂 불러왔어요');
}
function toast(msg) {
  queue({ emoji: '', title: msg, choices: [{ label: '확인' }] }); nextModal();
}

$('saveBtn').onclick = save;
$('loadBtn').onclick = load;
$('profBtn').onclick = showProfessors;
$('resetBtn').onclick = () => {
  queue({ emoji: '⚠️', title: '처음부터 다시 할까요?', body: '<p>저장하지 않은 진행은 사라집니다.</p>', choices: [
    { label: '네, 새로 시작', fn: () => setTimeout(startScreen, 0) }, { label: '취소' } ] });
  nextModal();
};

startScreen();
</script>
</body>
</html>
