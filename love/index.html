<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
</head>
<body>
<title>봄빛 하숙</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Gowun+Dodum&display=swap">
<style>
/* Layout: one full-height stage — painted CSS scene, a framed portrait, a glass dialogue box; menus slide over it. Single night-spring look. */
:root {
  --night: #17121f;
  --plum: #2a2034;
  --paper: #fbf3ef;
  --mist: #c9bccb;
  --blossom: #f3a5bd;
  --lantern: #f2c46d;
  --glass: rgba(23, 18, 31, 0.84);
  --line: rgba(251, 243, 239, 0.14);
  --c-seoyul: #7fb2e5;
  --c-eunho: #eaa77e;
  --c-dohyun: #f2cf3d;
  --c-geon: #d9b38c;
  --c-hayul: #6fd0c0;
  --c-jaemin: #b4e07a;
  --f-story: "Gowun Batang", "Nanum Myeongjo", "AppleMyungjo", serif;
  --f-ui: "Gowun Dodum", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  color-scheme: dark;
}
[hidden] { display: none !important; }
html, body { height: 100%; margin: 0; }
body {
  background: var(--night);
  color: var(--paper);
  font-family: var(--f-ui);
  overflow: hidden;
  -webkit-tap-highlight-color: transparent;
}
button { font-family: inherit; color: inherit; }
button:focus-visible, input:focus-visible { outline: 2px solid var(--blossom); outline-offset: 2px; }

#app { position: relative; height: 100%; overflow: hidden; user-select: none; -webkit-user-select: none; }

/* ---------- scenes ---------- */
#bg { position: absolute; inset: 0; transition: opacity .6s ease; }
#bg::before, #bg::after { content: ""; position: absolute; inset: 0; }
.bg-street { background: linear-gradient(180deg, #f4b9c6 0%, #c79bc4 45%, #6d5a8f 100%); }
.bg-street::after { background: radial-gradient(120% 40% at 30% 105%, #3d2f52 60%, transparent 61%), radial-gradient(90% 35% at 85% 108%, #2e2440 60%, transparent 61%); }
.bg-house { background: linear-gradient(180deg, #5a3b2c 0%, #8a5a3c 55%, #3b261d 100%); }
.bg-house::before { background: linear-gradient(90deg, transparent 12%, rgba(255,214,150,.35) 12% 30%, transparent 30% 70%, rgba(255,214,150,.28) 70% 88%, transparent 88%); clip-path: inset(12% 0 52% 0); filter: blur(1px); }
.bg-house::after { background: radial-gradient(60% 50% at 50% 30%, rgba(255,200,120,.35), transparent 70%); }
.bg-campus { background: linear-gradient(180deg, #bfe0f2 0%, #f6d3dc 60%, #e9b3c4 100%); }
.bg-campus::after { background: radial-gradient(140% 30% at 50% 110%, #b98aa6 60%, transparent 61%); }
.bg-gym { background: linear-gradient(180deg, #0f1726 0%, #1c2b45 50%, #5a3a22 51%, #2d1d12 100%); }
.bg-gym::before { background: radial-gradient(50% 35% at 50% 0%, rgba(200,225,255,.35), transparent 70%); }
.bg-gym::after { border: 2px solid rgba(255,255,255,.2); border-radius: 50%; inset: 58% 18% 10% 18%; }
.bg-rooftop { background: linear-gradient(180deg, #0c0d24 0%, #252154 60%, #4a3768 100%); }
.bg-rooftop::after { background: repeating-linear-gradient(90deg, rgba(0,0,0,.55) 0 4px, transparent 4px 38px), linear-gradient(transparent 78%, rgba(10,8,20,.9) 78%); clip-path: inset(72% 0 0 0); }
.bg-studio { background: linear-gradient(180deg, #2b1830 0%, #48263f 60%, #1d1220 100%); }
.bg-studio::before { background: radial-gradient(18% 22% at 22% 18%, rgba(255,190,120,.45), transparent 70%), radial-gradient(18% 22% at 78% 18%, rgba(255,150,180,.35), transparent 70%); }
.bg-library { background: linear-gradient(180deg, #3a2618 0%, #5e3f27 60%, #2a1b11 100%); }
.bg-library::before { background: repeating-linear-gradient(90deg, rgba(120,60,40,.6) 0 14px, rgba(60,90,110,.5) 14px 22px, rgba(170,130,70,.5) 22px 34px, rgba(30,20,12,.8) 34px 38px); clip-path: inset(6% 0 46% 0); opacity: .7; }
.bg-library::after { background: radial-gradient(40% 30% at 50% 60%, rgba(255,210,140,.3), transparent 70%); }
.bg-store { background: linear-gradient(180deg, #dcefe9 0%, #a9cfc6 55%, #5f7f86 100%); }
.bg-store::before { background: repeating-linear-gradient(180deg, transparent 0 46px, rgba(40,60,70,.35) 46px 50px), repeating-linear-gradient(90deg, rgba(255,120,120,.25) 0 18px, rgba(120,170,255,.22) 18px 30px, rgba(255,230,120,.25) 30px 44px, transparent 44px 52px); clip-path: inset(10% 0 40% 0); opacity: .7; }
.bg-store::after { background: linear-gradient(180deg, rgba(255,255,255,.4), transparent 20%); }
.bg-rain { background: linear-gradient(180deg, #4b5a72 0%, #6f7d93 50%, #2c3444 100%); }
.bg-rain::after { background: radial-gradient(30% 12% at 30% 92%, rgba(242,207,61,.25), transparent 70%); }
.bg-festival { background: linear-gradient(180deg, #120f2a 0%, #2b1d45 55%, #4a2a3d 100%); }
.bg-festival::before { background: repeating-linear-gradient(90deg, transparent 0 60px, rgba(242,196,109,.0) 60px 61px), radial-gradient(3% 3% at 10% 22%, #f2c46d, transparent), radial-gradient(3% 3% at 24% 18%, #f3a5bd, transparent), radial-gradient(3% 3% at 38% 23%, #f2c46d, transparent), radial-gradient(3% 3% at 52% 19%, #f3a5bd, transparent), radial-gradient(3% 3% at 66% 24%, #f2c46d, transparent), radial-gradient(3% 3% at 80% 18%, #f3a5bd, transparent), radial-gradient(3% 3% at 92% 23%, #f2c46d, transparent); filter: blur(2px); }
.bg-field { background: linear-gradient(180deg, #070a1c 0%, #1a1a3e 65%, #23331f 66%, #111a10 100%); }
.bg-dawn { background: linear-gradient(180deg, #4b5d9a 0%, #b9a6c9 50%, #f6c9b0 85%, #f4b9a0 100%); }
.bg-dawn::after { background: radial-gradient(120% 35% at 50% 108%, #4a3a5a 60%, transparent 61%); }
.bg-dark { background: #0d0a12; }
.bg-cafe { background: linear-gradient(180deg, #6b4a36 0%, #a9774f 55%, #4a3022 100%); }
.bg-cafe::before { background: linear-gradient(90deg, transparent 8%, rgba(255,232,190,.4) 8% 44%, transparent 44% 56%, rgba(255,232,190,.35) 56% 92%, transparent 92%); clip-path: inset(8% 0 50% 0); }
.bg-cafe::after { background: radial-gradient(12% 10% at 25% 62%, rgba(255,210,150,.5), transparent 70%), radial-gradient(12% 10% at 75% 62%, rgba(255,210,150,.5), transparent 70%); }
.bg-pool { background: linear-gradient(180deg, #0e2433 0%, #12455c 45%, #1b7a8f 46%, #0c3a4a 100%); }
.bg-pool::before { background: repeating-linear-gradient(90deg, transparent 0 18%, rgba(255,255,255,.18) 18% 18.6%); clip-path: inset(46% 0 0 0); }
.bg-pool::after { background: radial-gradient(60% 20% at 50% 70%, rgba(140,230,255,.25), transparent 70%); }
.bg-attic { background: linear-gradient(160deg, #1b1830 0%, #2c2547 60%, #141120 100%); }
.bg-attic::before { background: linear-gradient(135deg, transparent 49.5%, rgba(10,8,18,.9) 50%), linear-gradient(225deg, transparent 49.5%, rgba(10,8,18,.9) 50%); clip-path: inset(0 0 60% 0); }
.bg-attic::after { background: radial-gradient(22% 18% at 70% 45%, rgba(150,190,255,.35), transparent 70%); }
.bg-office { background: linear-gradient(180deg, #2a2f3a 0%, #46505f 55%, #232731 100%); }
.bg-office::before { background: repeating-linear-gradient(180deg, transparent 0 30px, rgba(255,255,255,.05) 30px 31px), radial-gradient(40% 25% at 50% 20%, rgba(255,240,200,.25), transparent 70%); }
.bg-ballpark { background: linear-gradient(180deg, #9fd0f0 0%, #d8eef5 45%, #6aa35a 46%, #b88a5a 75%, #8c643e 100%); }
.bg-ballpark::after { background: radial-gradient(40% 12% at 50% 80%, rgba(200,150,100,.6), transparent 70%); }

#fx { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
#veil { position: absolute; inset: 0; background: linear-gradient(180deg, rgba(0,0,0,.25), transparent 18%, transparent 55%, rgba(13,10,18,.7)); pointer-events: none; }

/* ---------- portrait ---------- */
#portrait {
  position: absolute; left: 50%; bottom: 120px;
  height: min(70%, 640px); aspect-ratio: 3 / 4.3; max-width: 92%;
  transform: translate(-50%, 18px); opacity: 0;
  transition: opacity .45s ease, transform .45s ease;
  border-radius: 200px 200px 18px 18px; overflow: hidden;
  box-shadow: 0 20px 60px rgba(0,0,0,.45), 0 0 0 1px var(--line);
  -webkit-mask-image: linear-gradient(180deg, #000 72%, transparent 100%);
          mask-image: linear-gradient(180deg, #000 72%, transparent 100%);
}
#portrait.on { opacity: 1; transform: translate(-50%, 0); }
#portrait img { width: 100%; height: 100%; object-fit: cover; object-position: 50% 12%; display: block; transition: opacity .12s ease; }
#portrait::after { content: ""; position: absolute; inset: 0; border-radius: inherit; box-shadow: inset 0 0 0 3px var(--who, transparent); opacity: .5; }

/* ---------- top bar ---------- */
#bar {
  position: absolute; top: 0; left: 0; right: 0; z-index: 5;
  display: flex; justify-content: space-between; align-items: center; gap: 8px;
  padding-top: 12px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
#dayTag { font-family: var(--f-story); font-size: 14px; letter-spacing: .08em; background: var(--glass); border: 1px solid var(--line); border-radius: 999px; padding: 6px 14px; white-space: nowrap; }
#dayTag b { color: var(--blossom); font-weight: 700; }
.tools { display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }
.tool { background: var(--glass); border: 1px solid var(--line); border-radius: 999px; padding: 6px 12px; font-size: 13px; cursor: pointer; }
.tool[aria-pressed="true"] { background: var(--blossom); color: var(--night); border-color: var(--blossom); }

/* ---------- dialogue ---------- */
#dlgWrap {
  position: absolute; left: 0; right: 0; bottom: 0; z-index: 4;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 0 16px;
}
#dlg {
  position: relative; max-width: 860px; margin: 0 auto;
  background: var(--glass); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  border: 1px solid var(--line); border-radius: 16px;
  padding: 26px 22px 20px; min-height: 128px; cursor: pointer;
}
#who {
  position: absolute; top: -15px; left: 18px;
  font-family: var(--f-story); font-weight: 700; font-size: 15px; letter-spacing: .06em;
  background: var(--paper); color: var(--night); border-radius: 8px; padding: 5px 14px;
  border-bottom: 3px solid var(--whoC, var(--blossom));
}
#who[hidden] { display: none !important; }
#txt { font-family: var(--f-story); font-size: clamp(16px, 2.2vw, 19px); line-height: 1.8; min-height: 3.6em; word-break: keep-all; overflow-wrap: anywhere; }
#txt.narr { color: var(--mist); }
#next { position: absolute; right: 18px; bottom: 12px; color: var(--blossom); font-size: 12px; animation: bob 1s ease-in-out infinite; }
@keyframes bob { 50% { transform: translateY(3px); } }

/* ---------- choices ---------- */
#choices {
  position: absolute; inset: 0; z-index: 6; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 60px 170px;
  background: rgba(13,10,18,.35);
  overflow-y: auto; justify-content: safe center;
}
.opt {
  width: min(560px, 100%); text-align: left; cursor: pointer;
  font-family: var(--f-story); font-size: 16px; line-height: 1.5; word-break: keep-all;
  background: rgba(251,243,239,.94); color: var(--night);
  border: none; border-left: 4px solid var(--blossom); border-radius: 10px; padding: 14px 18px;
  box-shadow: 0 8px 24px rgba(0,0,0,.3);
  transition: transform .15s ease, background .15s ease;
  animation: rise .35s ease both;
}
.opt:hover { transform: translateX(6px); background: #fff; }
.opt:nth-child(2) { animation-delay: .06s; } .opt:nth-child(3) { animation-delay: .12s; }
@keyframes rise { from { opacity: 0; transform: translateY(10px); } }

/* ---------- toast ---------- */
#toasts { position: absolute; top: 62px; right: max(16px, env(safe-area-inset-right, 0px)); z-index: 9; display: flex; flex-direction: column; gap: 6px; align-items: flex-end; pointer-events: none; }
.toast { background: var(--glass); border: 1px solid var(--line); border-radius: 999px; padding: 6px 14px; font-size: 14px; animation: toast 2.2s ease forwards; }
.toast .h { color: var(--blossom); }
.toast.down .h { color: var(--mist); }
@keyframes toast { 0% { opacity: 0; transform: translateY(-6px); } 12%, 75% { opacity: 1; transform: none; } 100% { opacity: 0; } }

/* ---------- full overlays ---------- */
.layer {
  position: absolute; inset: 0; z-index: 10; overflow-y: auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 28px;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
}
.layer.dim { background: rgba(13,10,18,.82); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); }
.panel { width: min(640px, 100%); display: flex; flex-direction: column; gap: 16px; }
.panel h2 { margin: 0; font-family: var(--f-story); font-size: 24px; text-wrap: balance; }
.panel .sub { margin: 0; color: var(--mist); font-size: 14px; }
.btn { cursor: pointer; border: 1px solid var(--line); background: var(--plum); border-radius: 12px; padding: 12px 18px; font-size: 16px; }
.btn.main { background: var(--blossom); color: var(--night); border-color: var(--blossom); font-weight: 700; }
.btn:disabled { opacity: .4; cursor: default; }
.row { display: flex; gap: 10px; flex-wrap: wrap; }
.row .btn { flex: 1 1 140px; }

/* title */
#title { background: linear-gradient(180deg, rgba(23,18,31,.15), rgba(23,18,31,.75) 70%); justify-content: flex-end; }
.titleBox { width: min(560px, 100%); display: flex; flex-direction: column; gap: 18px; align-items: center; text-align: center; padding-bottom: 4vh; }
.fan { display: flex; justify-content: center; margin-bottom: 4px; }
.fan { flex-wrap: nowrap; }
.fan img { width: clamp(54px, 14vw, 96px); aspect-ratio: 3/4.2; object-fit: cover; object-position: 50% 12%; border-radius: 60px 60px 10px 10px; border: 2px solid var(--paper); box-shadow: 0 10px 30px rgba(0,0,0,.4); margin: 0 -8px; }
.fan img:nth-child(1) { transform: rotate(-10deg) translateY(12px); } .fan img:nth-child(2) { transform: rotate(-6deg) translateY(4px); z-index: 1; }
.fan img:nth-child(3) { transform: rotate(-2deg); z-index: 2; } .fan img:nth-child(4) { transform: rotate(2deg); z-index: 2; }
.fan img:nth-child(5) { transform: rotate(6deg) translateY(4px); z-index: 1; } .fan img:nth-child(6) { transform: rotate(10deg) translateY(12px); }
.logo { margin: 0; font-family: var(--f-story); font-weight: 700; font-size: clamp(48px, 12vw, 84px); letter-spacing: .12em; line-height: 1; text-shadow: 0 4px 30px rgba(243,165,189,.55); }
.logo span { color: var(--blossom); }
.tag { margin: 0; font-family: var(--f-story); color: var(--mist); font-size: 15px; letter-spacing: .04em; }
.titleBox .row { width: 100%; }

/* name */
.field { display: flex; flex-direction: column; gap: 8px; }
.field label { font-size: 14px; color: var(--mist); }
#nameIn { font-family: var(--f-story); font-size: 20px; padding: 12px 14px; border-radius: 10px; border: 1px solid var(--line); background: var(--night); color: var(--paper); }

/* day card */
#dayCard { pointer-events: none; background: rgba(13,10,18,.6); }
#dayCard .big { font-family: var(--f-story); font-size: clamp(40px, 10vw, 68px); font-weight: 700; letter-spacing: .1em; margin: 0; animation: rise .6s ease both; }
#dayCard .small { color: var(--blossom); letter-spacing: .2em; margin: 6px 0 0; animation: rise .6s .15s ease both; }

/* map */
.spots { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.spot { display: grid; grid-template-columns: 64px minmax(0, 1fr); gap: 12px; align-items: center; text-align: left; cursor: pointer; background: var(--plum); border: 1px solid var(--line); border-radius: 14px; padding: 12px; transition: transform .15s, border-color .15s; }
.spot:disabled { opacity: .45; cursor: default; }
.spot:hover { transform: translateY(-2px); border-color: var(--c); }
.spot img { width: 64px; height: 80px; object-fit: cover; object-position: 50% 12%; border-radius: 32px 32px 8px 8px; }
.spot .place { font-size: 12px; color: var(--c); letter-spacing: .06em; }
.spot .nm { font-family: var(--f-story); font-size: 18px; font-weight: 700; margin: 2px 0 6px; }
.meter { height: 6px; background: rgba(255,255,255,.1); border-radius: 3px; overflow: hidden; }
.meter i { display: block; height: 100%; background: var(--c); border-radius: 3px; }
.spot .ep { font-size: 12px; color: var(--mist); margin-top: 6px; font-variant-numeric: tabular-nums; }
@media (max-width: 520px) {
  .spots { gap: 8px; }
  .spot { grid-template-columns: 40px minmax(0, 1fr); gap: 8px; padding: 8px; }
  .spot img { width: 40px; height: 52px; }
  .spot .place { font-size: 11px; letter-spacing: 0; }
  .spot .nm { font-size: 15px; margin: 0 0 4px; }
  .spot .ep { font-size: 11px; margin-top: 4px; }
}

/* status & log & endings */
.list { display: flex; flex-direction: column; gap: 10px; }
.stat { display: grid; grid-template-columns: 48px minmax(0,1fr) auto; gap: 12px; align-items: center; }
.stat img { width: 48px; height: 48px; object-fit: cover; object-position: 50% 12%; border-radius: 50%; border: 2px solid var(--c); }
.stat .num { font-variant-numeric: tabular-nums; color: var(--c); font-weight: 700; }
#logList { max-height: 60vh; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; font-family: var(--f-story); line-height: 1.7; }
#logList .l b { display: block; font-size: 13px; color: var(--c, var(--blossom)); }
#logList .l.n { color: var(--mist); }
.end { display: flex; justify-content: space-between; gap: 10px; border-bottom: 1px solid var(--line); padding-bottom: 8px; font-family: var(--f-story); }
.end span:last-child { color: var(--mist); font-size: 13px; white-space: nowrap; }
.end.lock { color: var(--mist); }

/* ending card */
#endCard .kind { font-size: 13px; letter-spacing: .3em; color: var(--lantern); margin: 0; }
#endCard h2 { font-size: clamp(28px, 7vw, 42px); }

@media (max-width: 600px) {
  #portrait { bottom: 150px; height: min(62%, 520px); }
  #dlg { padding: 24px 16px 22px; }
  .tool { padding: 6px 10px; font-size: 12px; }
  #dayTag { font-size: 12px; padding: 6px 10px; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}
</style>

<div id="app">
  <div id="bg" class="bg-campus"></div>
  <canvas id="fx"></canvas>
  <div id="veil"></div>
  <div id="portrait"><img id="pImg" alt=""></div>

  <div id="bar" hidden>
    <div id="dayTag">프롤로그</div>
    <div class="tools">
      <button class="tool bgmBtn" id="bBgm" aria-pressed="true">♪</button>
      <button class="tool" id="bAuto" aria-pressed="false">자동</button>
      <button class="tool" id="bLog">기록</button>
      <button class="tool" id="bStat">호감도</button>
      <button class="tool" id="bMenu">타이틀</button>
    </div>
  </div>

  <div id="dlgWrap" hidden>
    <div id="dlg" role="button" tabindex="0" aria-label="다음 대사">
      <div id="who" hidden></div>
      <div id="txt"></div>
      <div id="next" hidden>▼</div>
    </div>
  </div>

  <div id="choices" hidden></div>
  <div id="toasts"></div>

  <!-- title -->
  <div id="title" class="layer">
    <div class="titleBox">
      <div class="fan">
        <img src="img/seoyul.jpg" alt="한서율"><img src="img/eunho.jpg" alt="여은호"><img src="img/dohyun.jpg" alt="강도현"><img src="img/geon.jpg" alt="류건"><img src="img/hayul.jpg" alt="정하율"><img src="img/jaemin.jpg" alt="오재민">
      </div>
      <h1 class="logo">봄빛<span>·</span>하숙</h1>
      <p class="tag">언덕 끝 하숙집, 여섯 사람과 축제까지 두 주</p>
      <div class="row">
        <button class="btn main" id="bNew">새로 시작</button>
        <button class="btn" id="bCont">이어하기</button>
        <button class="btn" id="bEnds">엔딩 모음</button>
      </div>
      <button class="tool bgmBtn" id="bBgmT" aria-pressed="true">♪ BGM</button>
    </div>
  </div>

  <!-- name -->
  <div id="nameLayer" class="layer dim" hidden>
    <form class="panel" id="nameForm">
      <h2>당신의 이름은?</h2>
      <p class="sub">봄빛 하숙에 새로 들어온 신입생. 대사 속에서 이 이름으로 불려요.</p>
      <div class="field">
        <label for="nameIn">이름 (최대 6자)</label>
        <input id="nameIn" maxlength="6" value="이봄" autocomplete="off">
      </div>
      <button class="btn main" type="submit">하숙집으로 출발</button>
    </form>
  </div>

  <div id="dayCard" class="layer" hidden><p class="big" id="dcBig"></p><p class="small" id="dcSmall"></p></div>

  <!-- map -->
  <div id="mapLayer" class="layer dim" hidden>
    <div class="panel">

</div>

<script>window.SC = {};</script>
<script src="story/common.js"></script>
<script src="story/seoyul.js"></script>
<script src="story/eunho.js"></script>
<script src="story/dohyun.js"></script>
<script src="story/geon.js"></script>
<script src="story/hayul.js"></script>
<script src="story/jaemin.js"></script>
<script>
// ================= 데이터 =================
const CH = {
  seoyul: { name: '한서율', place: '무용과 연습실', img: 'img/seoyul.jpg', c: 'var(--c-seoyul)' },
  eunho:  { name: '여은호', place: '언덕 아래 카페', img: 'img/eunho.jpg', c: 'var(--c-eunho)' },
  dohyun: { name: '강도현', place: '실내 수영장', img: 'img/dohyun.jpg', c: 'var(--c-dohyun)' },
  geon:   { name: '류건', place: '총학생회실', img: 'img/geon.jpg', c: 'var(--c-geon)' },
  hayul:  { name: '정하율', place: '응원단 연습장', img: 'img/hayul.jpg', c: 'var(--c-hayul)' },
  jaemin: { name: '오재민', place: '태권도장', img: 'img/jaemin.jpg', c: 'var(--c-jaemin)' },
};
const IDS = Object.keys(CH);
// 1주차 월~금, 2주차 월~목은 자유 행동. 2주차 금요일 밤이 축제.
const DAYS = ['1주차 월요일', '1주차 화요일', '1주차 수요일', '1주차 목요일', '1주차 금요일', '2주차 월요일', '2주차 화요일', '2주차 수요일', '2주차 목요일'];
const FREE = DAYS.length, EPS = 9;
const MAX = 100, GOOD = 70, GOOD_VISITS = 8;

const ENDINGS = [
  ['seoyul_good', 'HAPPY', '말 대신 춤으로', '한서율'], ['seoyul_norm', 'NORMAL', '무대 위의 봄', '한서율'],
  ['eunho_good', 'HAPPY', '빈 의자에 앉은 사람', '여은호'], ['eunho_norm', 'NORMAL', '오후 세시의 라떼', '여은호'],
  ['dohyun_good', 'HAPPY', '물 밖에서 숨 쉬는 법', '강도현'], ['dohyun_norm', 'NORMAL', '노란 킥판', '강도현'],
  ['geon_good', 'HAPPY', '21시, 점화', '류건'], ['geon_norm', 'NORMAL', '완벽한 축제', '류건'],
  ['hayul_good', 'HAPPY', '응원 말고 진심', '정하율'], ['hayul_norm', 'NORMAL', '엄지 척', '정하율'],
  ['jaemin_good', 'HAPPY', '당첨, 한 개 더', '오재민'], ['jaemin_norm', 'NORMAL', '입대 전날', '오재민'],
  ['solo', 'SOLO', '혼자 보는 불꽃', '나'],
];

// ================= 시나리오 =================
// 대본은 story/*.js 파일에 있다. 각 파일이 window.SC에 장면을 추가한다.
const SC = window.SC;

const FEST_OPT = {
  seoyul: '잔디밭으로 간다 — 서율의 무대가 막 끝났다',
  eunho:  '카페 테라스로 간다 — 은호의 사진전이 열려 있다',
  dohyun: '수영장으로 간다 — 도현이 불을 켜 두겠다고 했다',
  geon:   '축제 본부 옥상으로 간다 — 건이 불꽃을 쏘아 올린다',
  hayul:  '응원단 무대 뒤로 간다 — 하율의 공연이 끝났다',
  jaemin: '언덕 버스 정류장으로 간다 — 재민은 다음 주에 떠난다',
};

// ================= 상태 =================
const $ = id => document.getElementById(id);
const KEY = 'bomhouse.save.v3', EKEY = 'bomhouse.endings.v3';
let S = fresh();
function fresh() { const z = () => Object.fromEntries(IDS.map(id => [id, 0])); return { name: '이봄', day: 0, aff: z(), visits: z() }; }
function store(k, v) { try { if (v === null) localStorage.removeItem(k); else localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
function load(k) { try { return JSON.parse(localStorage.getItem(k)); } catch (e) { return null; } }
function seenEndings() { const v = load(EKEY); return Array.isArray(v) ? v : []; }

// ================= 엔진 =================
let stack = [], onEnd = null, cur = null, mode = 'idle', typing = null, full = '', autoOn = false, autoT = null;
const LOG = [];

function run(lines, char, after) { stack = [{ lines, i: 0 }]; cur = char; onEnd = after; showUI(true); step(); }
function step() {
  clearTimeout(autoT);
  for (;;) {
    const f = stack[stack.length - 1];
    if (!f) { mode = 'idle'; const cb = onEnd; onEnd = null; cb && cb(); return; }
    if (f.i >= f.lines.length) { stack.pop(); continue; }
    const c = f.lines[f.i++];
    if (typeof c === 'string') return say('', c);
    if (Array.isArray(c)) return say(c[0], c[1]);
    if (c.bg) setBg(c.bg);
    if (c.fx) setFx(c.fx);
    if (c.show) show(c.show, c.f);
    if (c.face) setFace(c.face);
    if (c.hide) hide();
    if ('bgm' in c) { moodLock = c.bgm; Music.play(c.bgm); }
    if (c.choice) return choose(c.choice);
    if (c.end) { stack = []; onEnd = null; return ending(c.end); }
  }
}
function fill(t) { return t.replace(/\{n\}/g, S.name); }
function say(who, text) {
  mode = 'say';
  if (who && who.includes('.')) { const [id, f] = who.split('.'); who = id; if (shown === id) setFace(f); }
  text = fill(text);
  const w = $('who'), t = $('txt');
  if (who && who !== '') {
    w.hidden = false;
    w.textContent = CH[who] ? CH[who].name : who;
    w.style.setProperty('--whoC', CH[who] ? CH[who].c : 'var(--blossom)');
    t.classList.remove('narr');
  } else { w.hidden = true; t.classList.add('narr'); }
  LOG.push({ who, text }); if (LOG.length > 200) LOG.shift();
  full = text; t.textContent = ''; $('next').hidden = true;
  let i = 0; clearInterval(typing);
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (reduce) return doneTyping();
  typing = setInterval(() => { i++; t.textContent = full.slice(0, i); if (i >= full.length) doneTyping(); }, 32);
}
function doneTyping() {
  clearInterval(typing); typing = null; $('txt').textContent = full; $('next').hidden = false;
  if (autoOn) autoT = setTimeout(() => { if (mode === 'say' && !typing) step(); }, 1100 + full.length * 35);
}
function advance() {
  if (mode !== 'say') return;
  if (typing) return doneTyping();
  step();
}
function choose(opts) {
  mode = 'choice'; clearTimeout(autoT);
  const box = $('choices'); box.innerHTML = '';
  opts.forEach(o => {
    const b = document.createElement('button'); b.className = 'opt'; b.textContent = fill(o[0]);
    b.onclick = () => {
      box.hidden = true;
      const eff = typeof o[1] === 'number' ? { [cur]: o[1] } : o[1];
      addAff(eff);
      LOG.push({ who: 'me', text: '▶ ' + fill(o[0]) });
      stack.push({ lines: o[2] || [], i: 0 }); step();
    };
    box.appendChild(b);
  });
  box.hidden = false;
  box.querySelector('.opt').focus({ preventScroll: true });
}
function addAff(eff) {
  for (const k in eff) {
    const v = eff[k]; if (!v) continue;
    S.aff[k] = Math.max(0, Math.min(MAX, S.aff[k] + v));
    toast(k, v);
  }
}
function toast(k, v) {
  const d = document.createElement('div'); d.className = 'toast' + (v < 0 ? ' down' : '');
  d.innerHTML = `${CH[k].name} <span class="h">${v > 0 ? '♥ +' + v : '♡ ' + v}</span>`;
  $('toasts').appendChild(d); setTimeout(() => d.remove(), 2300);
}
function setBg(b) { $('bg').className = 'bg-' + b; setMood(b); }
let shown = null, curFace = null;
const faceSrc = (id, f) => (f && CH[id].faces && CH[id].faces[f]) || CH[id].img;
function show(id, f) {
  const p = $('portrait'), img = $('pImg');
  if (p.classList.contains('on') && shown === id) return setFace(f || 'base');
  curFace = f;
  const go = () => { img.src = faceSrc(id, curFace); img.alt = CH[id].name; img.style.objectPosition = CH[id].pos || ''; p.style.setProperty('--who', CH[id].c); p.classList.add('on'); };
  if (p.classList.contains('on')) { p.classList.remove('on'); setTimeout(go, 260); } else go();
  shown = id;
}
// 같은 인물의 표정만 바꿀 때: 짧게 깜빡이며 교체
function setFace(f) {
  if (!shown) return;
  curFace = f;
  const img = $('pImg'), src = faceSrc(shown, f);
  if (img.getAttribute('src') === src) return;
  img.style.opacity = 0;
  setTimeout(() => { img.src = src; img.style.opacity = 1; }, 120);
}
function hide() { $('portrait').classList.remove('on'); shown = null; }
// 표정 이미지 미리 불러오기
Object.values(CH).forEach(c => c.faces && Object.values(c.faces).forEach(u => { const i = new Image(); i.src = u; }));
function showUI(on) { $('bar').hidden = !on; $('dlgWrap').hidden = !on; if (!on) { $('choices').hidden = true; } }
function layer(id, on) { $(id).hidden = !on; }

// ================= 흐름 =================
function newGame() { S = fresh(); LOG.length = 0; layer('title', false); layer('nameLayer', true); setTimeout(() => $('nameIn').select(), 50); }
$('nameForm').addEventListener('submit', e => {
  e.preventDefault();
  S.name = ($('nameIn').value.trim() || '이봄').slice(0, 6);
  layer('nameLayer', false);
  $('dayTag').innerHTML = '프롤로그';
  run(SC.prologue, null, () => { S.day = 1; dayStart(); });
});
function dayStart() {
  if (S.day > FREE) return festival();
  store(KEY, S);
  hide(); $('dlgWrap').hidden = true; setBg('house'); setFx('petals');
  const dd = FREE + 1 - S.day;
  $('dayTag').innerHTML = `${DAYS[S.day - 1]} <b>D-${dd}</b>`;
  $('dcBig').textContent = DAYS[S.day - 1].split(' ')[1]; $('dcSmall').textContent = `${DAYS[S.day - 1].split(' ')[0]} · 축제까지 D-${dd}`;
  layer('dayCard', true);
  setTimeout(() => { layer('dayCard', false); run(SC['morning' + S.day] || [], null, openMap); }, 1500);
}
function endDay() {
  const next = () => { S.day++; dayStart(); };
  if (S.day === 5) run(SC.bbq.concat(SC.weekend), null, next); else next();
}
function openMap() {
  $('mapTitle').textContent = '방과 후, 어디로 갈까?';
  hide(); $('dlgWrap').hidden = true;
  $('mapSub').textContent = `${S.name}의 ${DAYS[S.day - 1]}. 한 곳만 갈 수 있어요.`;
  const box = $('spots'); box.innerHTML = '';
  IDS.forEach(id => {
    const c = CH[id], v = S.visits[id];
    const b = document.createElement('button'); b.className = 'spot'; b.style.setProperty('--c', c.c);
    b.innerHTML = `<img src="${c.img}" alt="" style="object-position:${c.pos || '50% 12%'}"><div><div class="place">${c.place}</div><div class="nm">${c.name}</div>
      <div class="meter"><i style="width:${S.aff[id] / MAX * 100}%"></i></div><div class="ep">이야기 ${v}/${EPS} · 호감 ${S.aff[id]}</div></div>`;
    if (v >= EPS) b.disabled = true;
    b.onclick = () => visit(id);
    box.appendChild(b);
  });
  layer('mapLayer', true);
}
function visit(id) {
  layer('mapLayer', false);
  S.visits[id] = Math.min(EPS, S.visits[id] + 1);
  addAff({ [id]: 2 });
  run(SC[id + S.visits[id]], id, endDay);
}
function festival() {
  store(KEY, S);
  $('dayTag').innerHTML = '2주차 금요일 <b>축제</b>';
  run(SC.festival_day.concat(SC.festival), null, () => {
    hide();
    choose([
      ...IDS.map(id => [FEST_OPT[id], {}, [{ end: id }]]),
      ['아무 데도 가지 않는다 — 혼자 불꽃놀이를 본다', {}, [{ end: 'solo' }]],
    ]);
  });
}
function ending(who) {
  let key = 'solo';
  if (who !== 'solo') key = who + (S.aff[who] >= GOOD && S.visits[who] >= GOOD_VISITS ? '_good' : '_norm');
  moodLock = null;
  const pre = key.endsWith('_good') ? [{ bgm: 'love' }] : key === 'solo' ? [{ bgm: 'night' }] : [];
  run(pre.concat(SC[key]), who === 'solo' ? null : who, () => showEnd(key));
}
function showEnd(key) {
  const e = ENDINGS.find(x => x[0] === key);
  const seen = seenEndings(); if (!seen.includes(key)) { seen.push(key); store(EKEY, seen); }
  store(KEY, null);
  $('ecKind').textContent = e[1] + ' ENDING';
  $('ecTitle').textContent = e[2];
  $('ecSub').textContent = `${seen.length} / ${ENDINGS.length} 엔딩 수집` + (e[1] === 'NORMAL' ? ` · 호감도 ${GOOD} 이상, 이야기 ${GOOD_VISITS}편 이상이면 다른 결말이 열려요.` : '');
  $('ecStats').innerHTML = statHTML();
  $('dlgWrap').hidden = true;
  layer('endCard', true);
}
function statHTML() {
  return IDS.map(id => `<div class="stat" style="--c:${CH[id].c}"><img src="${CH[id].img}" alt="" style="object-position:${CH[id].pos || '50% 12%'}">
    <div><div style="font-family:var(--f-story);font-weight:700">${CH[id].name}</div><div class="meter"><i style="width:${S.aff[id] / MAX * 100}%"></i></div></div>
    <span class="num">${S.aff[id]}</span></div>`).join('');
}
function toTitle() {
  moodLock = null;
  clearInterval(typing); clearTimeout(autoT); stack = []; onEnd = null; mode = 'idle';
  ['mapLayer', 'panelLayer', 'endCard', 'dayCard', 'nameLayer'].forEach(l => layer(l, false));
  showUI(false); hide(); setBg('campus'); setFx('petals');
  $('bCont').disabled = !load(KEY);
  $('bEnds').textContent = `엔딩 모음 ${seenEndings().length}/${ENDINGS.length}`;
  layer('title', true);
}
function panel(title, html) { $('pTitle').textContent = title; $('pBody').innerHTML = html; layer('panelLayer', true); }

// ================= 입력 =================
$('dlg').addEventListener('click', advance);
document.addEventListener('keydown', e => {
  if ((e.key === ' ' || e.key === 'Enter') && mode === 'say' && $('panelLayer').hidden && !/^(BUTTON|INPUT)$/.test(document.activeElement.tagName)) { e.preventDefault(); advance(); }
  if (e.key === 'Escape') layer('panelLayer', false);
});
$('app').addEventListener('click', e => {
  if (mode === 'say' && e.target.closest('#bg, #veil, #portrait, #fx')) advance();
});
$('bNew').onclick = newGame;
$('bCont').onclick = () => { const s = load(KEY); if (!s) return; S = s; LOG.length = 0; layer('title', false); showUI(true); dayStart(); };
$('bEnds').onclick = () => {
  const seen = seenEndings();
  panel('엔딩 모음', '<div class="list">' + ENDINGS.map(e => seen.includes(e[0])
    ? `<div class="end"><span>${e[2]}</span><span>${e[3]} · ${e[1]}</span></div>`
    : `<div class="end lock"><span>？？？</span><span>${e[3]} · ${e[1]}</span></div>`).join('') + '</div>');
};
$('bLog').onclick = () => {
  panel('대사 기록', '<div id="logList">' + LOG.map(l => {
    const nm = l.who === 'me' ? S.name : (CH[l.who] ? CH[l.who].name : l.who);
    const col = CH[l.who] ? CH[l.who].c : 'var(--blossom)';
    return l.who ? `<div class="l" style="--c:${col}"><b>${nm}</b>${esc(l.text)}</div>` : `<div class="l n">${esc(l.text)}</div>`;
  }).join('') + '</div>');
  const ll = $('logList'); ll.scrollTop = ll.scrollHeight;
};
$('bStat').onclick = () => panel('호감도', `<p class="sub" style="margin-bottom:12px">최대 ${MAX} · 호감도 ${GOOD} 이상, 이야기를 ${GOOD_VISITS}편 이상 본 사람을 축제 날 찾아가면 특별한 결말이 기다려요.</p><div class="list">${statHTML()}</div>`);
$('bMenu').onclick = () => {
  panel('타이틀로 돌아갈까요?', '<p class="sub" style="margin-bottom:12px">하루가 시작될 때마다 자동 저장돼요. 이어하기를 누르면 그날 아침부터 다시 시작해요.</p><button class="btn main" id="goTitle" style="width:100%">타이틀로</button>');
  $('goTitle').onclick = toTitle;
};
$('bAuto').onclick = () => { autoOn = !autoOn; $('bAuto').setAttribute('aria-pressed', autoOn); if (autoOn && mode === 'say' && !typing) doneTyping(); };
$('pClose').onclick = () => layer('panelLayer', false);
$('ecBack').onclick = toTitle;
function esc(s) { return s.replace(/[&<>]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c])); }

// ================= 효과 캔버스 =================
const cv = $('fx'), cx = cv.getContext('2d');
let fxMode = 'none', parts = [], W = 0, H = 0, DPR = 1;
function resize() { DPR = Math.min(2, devicePixelRatio || 1); W = cv.clientWidth; H = cv.clientHeight; cv.width = W * DPR; cv.height = H * DPR; cx.setTransform(DPR, 0, 0, DPR, 0, 0); }
addEventListener('resize', resize); resize();
function setFx(m) {
  if (m === fxMode) return; fxMode = m; parts = [];
  const n = { petals: 40, rain: 140, stars: 90, dust: 40, lanterns: 26 }[m] || 0;
  for (let i = 0; i < n; i++) parts.push(spawn(true));
}
const R = (a, b) => a + Math.random() * (b - a);
function spawn(init) {
  switch (fxMode) {
    case 'petals': return { x: R(0, W), y: init ? R(0, H) : -10, s: R(4, 8), vy: R(.4, 1.1), vx: R(-.3, .6), a: R(0, 6.28), va: R(-.03, .03) };
    case 'rain': return { x: R(0, W), y: init ? R(0, H) : -20, l: R(10, 22), vy: R(9, 15) };
    case 'stars': return { x: R(0, W), y: R(0, H * .7), r: R(.5, 1.6), t: R(0, 6.28) };
    case 'dust': return { x: R(0, W), y: R(0, H), r: R(.6, 1.8), vy: R(-.2, -.05), t: R(0, 6.28) };
    case 'lanterns': return { x: R(0, W), y: init ? R(0, H) : H + 20, r: R(2, 5), vy: R(-.5, -.2), t: R(0, 6.28), hue: Math.random() < .5 ? '242,196,109' : '243,165,189' };
  }
}
let fw = [], fwT = 0;
const reduceMo = matchMedia('(prefers-reduced-motion: reduce)');
function tick() {
  cx.clearRect(0, 0, W, H);
  const still = reduceMo.matches;
  if (fxMode === 'fireworks') {
    if (!still && (fwT -= 1) <= 0) {
      fwT = R(35, 70);
      const x = R(W * .15, W * .85), y = R(H * .1, H * .4), col = ['243,165,189', '242,196,109', '127,178,229', '143,211,182', '255,255,255'][Math.floor(R(0, 5))];
      for (let i = 0; i < 70; i++) { const a = R(0, 6.28), sp = R(1, 4); fw.push({ x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, life: R(50, 80), max: 80, col }); }
    }
    fw = fw.filter(p => p.life > 0);
    fw.forEach(p => { p.x += p.vx; p.y += p.vy; p.vy += .04; p.vx *= .985; p.life--; cx.fillStyle = `rgba(${p.col},${p.life / p.max})`; cx.beginPath(); cx.arc(p.x, p.y, 1.8, 0, 6.28); cx.fill(); });
  } else fw = [];
  parts.forEach((p, i) => {
    switch (fxMode) {
      case 'petals':
        if (!still) { p.y += p.vy; p.x += p.vx + Math.sin(p.y / 40) * .3; p.a += p.va; }
        cx.save(); cx.translate(p.x, p.y); cx.rotate(p.a); cx.fillStyle = 'rgba(248,190,208,.85)';
        cx.beginPath(); cx.ellipse(0, 0, p.s, p.s * .55, 0, 0, 6.28); cx.fill(); cx.restore();
        if (p.y > H + 10) parts[i] = spawn(false); break;
