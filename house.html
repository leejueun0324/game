<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>우리 마을</title>
<style>
  @font-face { font-family: 'Galmuri11'; font-display: swap;
    src: url('https://cdn.jsdelivr.net/npm/galmuri@2.40.3/dist/Galmuri11.woff2') format('woff2'); }
  @font-face { font-family: 'Galmuri11'; font-weight: 700; font-display: swap;
    src: url('https://cdn.jsdelivr.net/npm/galmuri@2.40.3/dist/Galmuri11-Bold.woff2') format('woff2'); }
  :root {
    --ink: #3b2e2a; --paper: #fff8ec; --paper2: #f3e3c8; --accent: #ff7a59; --mint: #4fb39f;
    --muted: #8c7564; --sky: #6aa8e8;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #1d1a2b; color: var(--ink);
    font-family: 'Galmuri11', "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif; }
  #cv { position: fixed; inset: 0; display: block; touch-action: none; }
  .hidden { display: none !important; }
  #hud { z-index: 5; } #editPanel { z-index: 6; } #title { z-index: 10; } #creator { z-index: 20; } #modal { z-index: 30; }
  .pix { background: var(--paper); border: 3px solid var(--ink); border-radius: 10px; box-shadow: 0 4px 0 rgba(0,0,0,.28); }
  .btn { font-family: inherit; font-size: 14px; font-weight: 700; color: var(--ink); background: var(--paper);
    border: 3px solid var(--ink); border-radius: 10px; padding: 7px 12px; cursor: pointer;
    box-shadow: 0 3px 0 var(--ink); transition: transform .05s, box-shadow .05s; white-space: nowrap; }
  .btn:active { transform: translateY(3px); box-shadow: 0 0 0 var(--ink); }
  .btn:disabled { opacity: .5; cursor: default; }
  .btn.primary { background: var(--accent); color: #fff; }
  .btn.mint { background: var(--mint); color: #fff; }
  .btn.sel { background: #ffe3a3; }
  input.txt { font-family: inherit; font-size: 15px; padding: 9px 10px; border: 3px solid var(--ink); border-radius: 10px;
    background: #fff; color: var(--ink); outline: none; min-width: 0; }

  /* ===== 표지 ===== */
  #title { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 18px; text-align: center; padding: 20px; background: radial-gradient(ellipse at center, rgba(20,16,40,.12), rgba(20,16,40,.6)); }
  .logo { font-size: clamp(48px, 11vw, 96px); font-weight: 700; color: #fff8ec; letter-spacing: 4px; line-height: 1;
    text-shadow: 0 4px 0 #3b2e2a, 4px 0 0 #3b2e2a, -4px 0 0 #3b2e2a, 0 -4px 0 #3b2e2a, 4px 4px 0 #3b2e2a, -4px 4px 0 #3b2e2a,
      4px -4px 0 #3b2e2a, -4px -4px 0 #3b2e2a, 0 10px 0 rgba(0,0,0,.3); animation: float 3s ease-in-out infinite; }
  .logo small { display: block; font-size: .28em; letter-spacing: 6px; color: #ffd36e; margin-top: 14px; }
  @keyframes float { 50% { transform: translateY(-6px); } }
  .subtitle { color: #fff; font-size: 16px; text-shadow: 0 2px 0 #3b2e2a; }
  #inviteNote { color: #ffd36e; font-size: 16px; text-shadow: 0 2px 0 #3b2e2a; }
  #startBtn { font-size: 22px; padding: 14px 40px; animation: blink 1.4s steps(2) infinite; }
  @keyframes blink { 50% { filter: brightness(1.12); } }
  .foot { color: rgba(255,255,255,.85); font-size: 12px; text-shadow: 0 2px 0 #3b2e2a; }

  /* ===== 캐릭터 만들기 ===== */
  #creator { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; padding: 14px;
    background: rgba(20,16,40,.55); }
  #creator > .pix { width: min(640px, 100%); max-height: 100%; overflow: auto; padding: 18px; display: grid;
    grid-template-columns: 180px 1fr; gap: 16px; }
  #creator h2 { grid-column: 1 / -1; margin: 0; font-size: 22px; }
  #previewBox { background: linear-gradient(#bfe3ff, #e9f6ff 62%, #9bd472 62%); border: 3px solid var(--ink); border-radius: 10px;
    display: flex; align-items: center; justify-content: center; height: 220px; }
  #preview { width: 128px; height: 192px; image-rendering: pixelated; }
  .opt { margin-bottom: 10px; }
  .opt > b { display: block; font-size: 13px; margin-bottom: 5px; color: var(--muted); }
  .sw { display: flex; flex-wrap: wrap; gap: 6px; }
  .sw span { width: 26px; height: 26px; border-radius: 7px; border: 3px solid var(--ink); cursor: pointer; }
  .sw span.on { outline: 3px solid var(--accent); outline-offset: 1px; }
  .seg { display: flex; gap: 6px; flex-wrap: wrap; }
  .seg .btn { padding: 6px 10px; font-size: 13px; }
  #creator .actions { grid-column: 1 / -1; display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  #creator .actions .btn.primary { flex: 1; font-size: 18px; padding: 12px; }
  #codeRow { display: flex; gap: 6px; width: 100%; }
  @media (max-width: 560px) { #creator > .pix { grid-template-columns: 1fr; } #previewBox { height: 160px; } #preview { width: 96px; height: 144px; } }

  /* ===== 게임 화면 ===== */
  #hud { position: fixed; inset: 0; pointer-events: none; }
  #hud > * { pointer-events: auto; }
  #hudTL { position: absolute; left: 10px; top: 10px; padding: 8px 10px; min-width: 210px; }
  .who { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; font-size: 14px; }
  .who canvas { width: 32px; height: 32px; image-rendering: pixelated; background: #e9f6ff; border: 2px solid var(--ink); border-radius: 6px; }
  .who .coins { margin-left: auto; font-weight: 700; }
  #saveMark { font-size: 12px; opacity: .25; transition: opacity .4s; }
  #saveMark.on { opacity: 1; }
  .needs { display: grid; grid-template-columns: 1fr 1fr; gap: 4px 10px; }
  .need { display: flex; align-items: center; gap: 5px; font-size: 12px; }
  .bar { flex: 1; height: 9px; min-width: 50px; background: #e8d9c2; border: 2px solid var(--ink); border-radius: 4px; overflow: hidden; }
  .bar i { display: block; height: 100%; width: 80%; background: #6fcf7f; transition: width .3s; }
  #hudTR { position: absolute; right: 10px; top: 10px; display: flex; flex-direction: column; align-items: flex-end; gap: 6px; }
  .chip { padding: 5px 10px; font-size: 13px; font-weight: 700; }
  .row { display: flex; gap: 6px; align-items: center; }
  #toast { position: absolute; left: 50%; top: 70px; transform: translateX(-50%); padding: 8px 16px; font-size: 14px; font-weight: 700;
    background: rgba(59,46,42,.92); color: #fff; border-radius: 10px; opacity: 0; transition: opacity .25s; pointer-events: none; white-space: nowrap; }
  #toast.show { opacity: 1; }
  #notes { position: absolute; right: 10px; top: 150px; display: flex; flex-direction: column; gap: 8px; align-items: stretch; width: min(320px, 92vw); }
  .note { padding: 10px 12px; width: 100%; animation: pop .25s ease-out; }
  .note p { margin: 0 0 8px; font-size: 14px; font-weight: 700; }
  .note .row { flex-wrap: wrap; }
  .note .btn { font-size: 13px; padding: 5px 9px; }
  @keyframes pop { from { transform: scale(.85); opacity: 0; } }
  #chatBox { position: absolute; left: 10px; bottom: 10px; width: min(330px, calc(100vw - 20px)); }
  #log { max-height: 150px; overflow-y: auto; font-size: 13px; line-height: 1.5; padding: 6px 8px; margin-bottom: 6px;
    background: rgba(29,26,43,.6); color: #fff; border-radius: 10px; word-break: break-all; }
  #log:empty { display: none; }
  #log .sys { color: #ffd98a; }
  #log .dm { color: #a8e6ff; }
  #chatForm { display: flex; gap: 6px; }
  #chatForm input { flex: 1; }
  #hudB { position: absolute; left: 50%; bottom: 10px; transform: translateX(-50%); display: flex; gap: 6px; }
  #actBtn { min-width: 150px; }
  #emotePop { position: absolute; left: 50%; bottom: 66px; transform: translateX(-50%); padding: 6px; display: flex; gap: 4px; flex-wrap: wrap; width: 230px; justify-content: center; }
  #emotePop button { font-size: 20px; background: none; border: none; cursor: pointer; padding: 4px; }
  @media (max-width: 860px) {
    #chatBox { bottom: 64px; }
  }
  @media (max-width: 760px) {
    #hudTL { min-width: 0; padding: 6px 8px; left: 6px; top: 6px; }
    .bar { min-width: 34px; }
    #hudTR { right: 6px; top: 6px; }
    #chatBox { left: 6px; width: calc(100vw - 12px); }
    #log { max-height: 76px; }
    #hudB { bottom: 8px; width: calc(100vw - 12px); justify-content: center; }
    #hudB .btn { padding: 7px 8px; font-size: 13px; }
    #actBtn { min-width: 0; flex: 1; overflow: hidden; text-overflow: ellipsis; }
    #toast { top: 120px; }
    #notes { top: 150px; right: auto; left: 50%; transform: translateX(-50%); }
  }

  #zoomBox { position: absolute; right: 10px; top: 50%; transform: translateY(-50%); display: flex; flex-direction: column; gap: 6px; }
  #zoomBox .btn { width: 42px; height: 42px; padding: 0; font-size: 20px; }

  /* ===== 꾸미기 ===== */
  #editPanel { position: fixed; left: 50%; bottom: 8px; transform: translateX(-50%); width: min(760px, calc(100vw - 12px));
    padding: 10px; display: flex; flex-direction: column; gap: 8px; max-height: 46vh; }
  #editTabs { display: flex; gap: 5px; overflow-x: auto; padding-bottom: 4px; flex: none; }
  #editTabs .btn { font-size: 13px; padding: 5px 9px; }
  #editBody { overflow-y: auto; display: flex; flex-wrap: wrap; gap: 6px; min-height: 70px; align-items: flex-start; }
  .card { border: 3px solid var(--ink); border-radius: 8px; background: #fff; padding: 4px; width: 84px; text-align: center; cursor: pointer; font-size: 11px; }
  .card.on { background: #ffe3a3; }
  .card canvas { image-rendering: pixelated; display: block; margin: 0 auto 2px; }
  .card .th { height: 50px; display: flex; align-items: flex-end; justify-content: center; }
  .card small { color: var(--muted); }
  #editFoot { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; flex: none; }
  #editInfo { font-size: 13px; flex: 1; min-width: 140px; }

  /* ===== 가로로 눕힌 휴대폰 (화면 높이가 낮을 때) ===== */
  @media (max-height: 520px) {
    #hudTL { padding: 5px 8px; left: 6px; top: 6px; min-width: 0; }
    .who { margin-bottom: 3px; font-size: 13px; }
    .who canvas { width: 24px; height: 24px; }
    .bar { min-width: 40px; height: 8px; }
    #hudTR { right: 6px; top: 6px; flex-direction: row; flex-wrap: wrap; justify-content: flex-end; max-width: 52vw; }
    .chip { padding: 4px 8px; font-size: 12px; }
    #hudTR .btn, #hudB .btn { padding: 5px 9px; font-size: 13px; }
    #chatBox { bottom: 8px; left: 6px; width: min(300px, 40vw); }
    #log { max-height: 64px; font-size: 12px; }
    #chatForm input { padding: 6px 8px; font-size: 13px; }
    #hudB { bottom: 8px; left: auto; right: 60px; transform: none; width: auto; }
    #actBtn { min-width: 0; max-width: 28vw; overflow: hidden; text-overflow: ellipsis; }
    #emotePop { left: auto; right: 60px; transform: none; bottom: 52px; }
    #zoomBox { right: 6px; }
    #zoomBox .btn { width: 38px; height: 38px; }
    #toast { top: 52px; }
    #notes { top: 52px; right: 52px; left: auto; transform: none; width: min(300px, 46vw); }
    .note { padding: 6px 8px; } .note p { margin-bottom: 5px; font-size: 13px; }
    #editPanel { left: auto; right: 6px; top: 6px; bottom: 6px; transform: none; width: min(420px, 46vw); max-height: none; }
    #title { gap: 10px; }
    .logo { font-size: clamp(40px, 9vh, 72px); }
    .logo small { margin-top: 8px; }
    #startBtn { font-size: 18px; padding: 10px 30px; }
    #creator { padding: 6px; }
    #creator > .pix { padding: 12px; gap: 10px; grid-template-columns: 140px 1fr; }
    #previewBox { height: 150px; } #preview { width: 80px; height: 120px; }
    .opt { margin-bottom: 6px; }
    #modal > .pix { padding: 12px; }
  }
  @media (max-height: 520px) and (max-width: 560px) { #creator > .pix { grid-template-columns: 1fr; } }

  /* ===== 창 ===== */
  #modal { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; padding: 14px; background: rgba(20,16,40,.5); }
  #modal > .pix { width: min(400px, 100%); max-height: 100%; overflow: auto; padding: 16px; }
  #modal h3 { margin: 0 0 10px; font-size: 18px; display: flex; align-items: center; }
  #modal p { font-size: 13px; color: var(--muted); line-height: 1.6; margin: 6px 0; }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .plist { list-style: none; padding: 0; margin: 0; }
  .plist li { display: flex; align-items: center; gap: 8px; padding: 6px 0; border-bottom: 2px dashed #ead9bf; font-size: 14px; }
  .plist li span.where { margin-left: auto; color: var(--muted); font-size: 12px; }
  .plist canvas { width: 24px; height: 24px; image-rendering: pixelated; }
  .phr { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 10px; }
  .phr .btn { font-size: 13px; padding: 5px 9px; }
</style>
</head>
<body>
<canvas id="cv"></canvas>

<!-- 표지 -->
<div id="title">
  <div class="logo">우리 마을<small>OUR PIXEL TOWN</small></div>
  <div class="subtitle">친구와 함께 사는 픽셀 마을 라이프</div>
  <div id="inviteNote" class="hidden"></div>
  <button id="startBtn" class="btn primary">▶ 시작하기</button>
  <button id="altStart" class="btn hidden">🎨 캐릭터 바꾸기 · 다른 마을</button>
  <div id="savedNote" class="foot"></div>
  <div class="foot">링크 하나로 친구와 같은 마을에 · 집 꾸미기 · 놀러 가기 · 수다 떨기</div>
</div>

<!-- 캐릭터 만들기 -->
<div id="creator" class="hidden">
  <div class="pix">
    <h2 id="creatorTitle">내 캐릭터 만들기</h2>
    <div>
      <div id="previewBox"><canvas id="preview" width="16" height="24"></canvas></div>
      <div class="seg" style="justify-content:center;margin-top:8px">
        <button class="btn" id="rotBtn">↻ 돌려 보기</button>
      </div>
    </div>
    <div>
      <div class="opt"><b>이름</b><input id="nameIn" class="txt" maxlength="8" placeholder="이름 (8자까지)" style="width:100%"></div>
      <div class="opt"><b>성별</b><div class="seg" id="optGender"></div></div>
      <div class="opt"><b>머리 모양</b><div class="seg" id="optHs"></div></div>
      <div class="opt"><b>피부</b><div class="sw" id="optSkin"></div></div>
      <div class="opt"><b>머리 색</b><div class="sw" id="optHair"></div></div>
      <div class="opt"><b>윗옷</b><div class="sw" id="optTop"></div></div>
      <div class="opt"><b>아래옷</b><div class="sw" id="optBot"></div></div>
      <div class="opt"><b>우리 집 지붕</b><div class="sw" id="optRoof"></div></div>
    </div>
    <div class="actions">
      <button class="btn primary" id="goBtn">마을로 가기 ▶</button>
      <details id="codeBox" style="width:100%"><summary style="cursor:pointer;font-size:13px">다른 마을 코드로 들어가기 (보통은 필요 없어요)</summary>
        <div id="codeRow" style="margin-top:6px"><input id="codeIn" class="txt" placeholder="마을 코드 (예: ab3k9x)" style="flex:1"><button class="btn mint" id="codeBtn">들어가기</button></div>
      </details>
    </div>
  </div>
</div>

<!-- 게임 HUD -->
<div id="hud" class="hidden">
  <div id="hudTL" class="pix">
    <div class="who"><canvas id="faceCv" width="16" height="16"></canvas><b id="hudName"></b><span id="saveMark" title="자동 저장">💾</span><span class="coins" id="hudCoins">💰 0</span></div>
    <div class="needs">
      <div class="need" title="배고픔">🍚<div class="bar"><i id="nb-hunger"></i></div></div>
      <div class="need" title="에너지">⚡<div class="bar"><i id="nb-energy"></i></div></div>
      <div class="need" title="청결">🫧<div class="bar"><i id="nb-hygiene"></i></div></div>
      <div class="need" title="재미">🎈<div class="bar"><i id="nb-fun"></i></div></div>
    </div>
  </div>
  <div id="hudTR">
    <div class="pix chip" id="clock">☀️ 1일차 08:00</div>
    <div class="pix chip" id="placeChip">📍 우리 마을</div>
    <button class="pix chip" id="netChip" style="cursor:pointer;font-family:inherit;color:inherit">🟡 연결 중…</button>
    <div class="row">
      <button class="btn" id="btnPeople">👥 <span id="pcount">1</span></button>
      <button class="btn" id="btnInvite">💌 초대</button>
      <button class="btn" id="btnSound">🔊</button>
    </div>
  </div>
  <div id="toast"></div>
  <div id="notes"></div>
  <div id="chatBox">
    <div id="log"></div>
    <form id="chatForm"><input id="chatIn" class="txt" maxlength="60" placeholder="모두에게 말하기 (Enter)" autocomplete="off"><button class="btn">전송</button></form>
  </div>
  <div id="hudB">
    <button class="btn primary" id="actBtn" disabled>둘러보기</button>
    <button class="btn" id="btnHome">🏠 집</button>
    <button class="btn" id="btnEdit">🔨 꾸미기</button>
    <button class="btn" id="btnEmote">😊</button>
  </div>
  <div id="emotePop" class="pix hidden"></div>
  <div id="zoomBox"><button class="btn" id="zoomIn" title="확대 (+)">＋</button><button class="btn" id="zoomOut" title="축소 (-)">－</button></div>
</div>

<!-- 꾸미기 -->
<div id="editPanel" class="pix hidden">
  <div id="editTabs"></div>
  <div id="editBody"></div>
  <div id="editFoot"><span id="editInfo"></span><span id="editExtra" class="row"></span><button class="btn mint" id="editDone">✔ 꾸미기 끝</button></div>
</div>

<div id="modal" class="hidden"><div class="pix" id="modalBody"></div></div>

<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script>
// =====================================================================
//  우리 마을 — 링크로 친구와 실시간으로 함께하는 픽셀 마을 생활 게임
//  · 마을을 만든 사람이 "호스트"가 되어 시간·집터를 관리하고, 나가면 다른 사람이 이어받아요.
//  · 각자 자기 집(꾸민 내용·돈·캐릭터)은 자기 브라우저에 저장돼요.
// =====================================================================
const $ = id => document.getElementById(id);
const rand = n => Math.floor(Math.random() * n);
const clamp = (v, a = 0, b = 100) => Math.max(a, Math.min(b, v));
const clampInt = (v, a, b) => Math.max(a, Math.min(b, (v | 0)));
const now = () => Date.now();
const TS = 16;
const FONT = "'Galmuri11','Apple SD Gothic Neo','Malgun Gothic',sans-serif";
const EMOJI = '"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif';
const ID_RE = /^[a-z0-9]{1,16}$/;
function mulberry(a) { return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function shade(hex, f) {
  const n = parseInt(hex.slice(1, 7), 16);
  const c = s => Math.max(0, Math.min(255, Math.round(((n >> s) & 255) * f)));
  return '#' + ((1 << 24) + (c(16) << 16) + (c(8) << 8) + c(0)).toString(16).slice(1);
}

// ===== 팔레트 =====
const SKINS = ['#ffe0c7', '#f5c9a6', '#d9a57c', '#9c6b4a'];
const HAIRS = ['#2b2121', '#5a3a28', '#a0663a', '#e8c06a', '#d65a5a', '#7a6fd6', '#eeeeee', '#4a8f6e'];
const CLOTH = ['#ff7a8a', '#ffb347', '#f5d33f', '#7bd389', '#5bc0eb', '#6f7dd8', '#c58be0', '#f4f0e8', '#3d3d4a', '#8d6e63'];
const ROOFS = ['#d9534f', '#4a7fc1', '#5aa469', '#e8a23a', '#9b6bc4', '#e57fa6', '#6b6b78', '#2f8f8f'];
const HS_NAMES = { m: ['짧은 머리', '삐죽 머리', '모자'], f: ['긴 머리', '포니테일', '단발'] };

// ===== 화면 =====
const cv = $('cv'), ctx = cv.getContext('2d');
const buf = document.createElement('canvas');
let g = buf.getContext('2d');
let S = 3, baseS = 3, BW = 320, BH = 200, DPR = 1, SW = 0, SH = 0;
function resize() {
  DPR = Math.min(2, window.devicePixelRatio || 1);
  SW = innerWidth; SH = innerHeight;
  baseS = Math.max(2, Math.floor(Math.min(SW / (20 * TS), SH / (12 * TS))));
  applyScale(baseS);
  cv.width = Math.round(SW * DPR); cv.height = Math.round(SH * DPR);

function sanitizeHouse(h) {
  const out = emptyHouse();
  if (!h || typeof h !== 'object') return out;
  out.name = String(h.name || '').slice(0, 8);
  if (Array.isArray(h.floor) && h.floor.length === HW * HH) out.floor = h.floor.map(v => clampInt(v, 0, FLOORS.length - 1));
  if (Array.isArray(h.walls) && h.walls.length === HW * HH) out.walls = h.walls.map((v, i) => {
    const x = i % HW, y = Math.floor(i / HW);

  out.wp = clampInt(h.wp, 0, WALLPAPERS.length - 1);
  out.roof = clampInt(h.roof, 0, ROOFS.length - 1);
  if (Array.isArray(h.items)) out.items = h.items.slice(0, 80).filter(it => it && Object.prototype.hasOwnProperty.call(CAT, it.k)).map(it => {

  if (r.pos.map === 'v') { resumeTo = null; return; }
  const owner = r.pos.map.slice(2);
  if (lotOf(owner) < 0 || (owner !== me.id && !houses[owner])) return;
  resumeTo = null;
  enterHouse(owner, owner === me.id ? '🏠 우리 집에서 이어서 시작해요' : `🏠 ${ownerName(owner)}의 집에서 이어서 시작해요`);
  me.x = Math.max(TS + 6, Math.min((HW - 1) * TS - 6, r.pos.x)); me.y = Math.max(2 * TS + 6, Math.min((HH - 1) * TS - 2, r.pos.y)); me.dir = r.pos.dir;
  lastTile = '';
}
function beginGame(c, resume) {
  inTitle = false; started = true;
  $('hud').classList.remove('hidden');
  code = c || genCode();
  const q = new URLSearchParams(params); q.delete('house'); q.delete('v'); if (code !== TOWN) q.set('v', code);
  history.replaceState(null, '', location.pathname + (q.toString() ? '?' + q.toString() : ''));
  curMap = me.map = 'v';
  me.x = (26 + rand(4)) * TS + 8; me.y = 22 * TS + 10; me.dir = 0;
  if (c) { loadVillage(); rebuildLotSolid(); }   // 연결되기 전에도 저장해 둔 마을을 바로 보여줘요
  const pos = resume && save.lastCode === code ? save.pos : null;
  if (pos && pos.map === 'v') { me.x = Math.max(TS, Math.min((VW - 1) * TS, pos.x)); me.y = Math.max(TS, Math.min((VH - 1) * TS, pos.y)); me.dir = pos.dir; }
  if (pos && pos.map !== 'v') resumeTo = { pos, until: now() + 10000 };
  lastTile = curMap + ':' + Math.floor(me.x / TS) + ',' + Math.floor(me.y / TS);
  saveMe();
  if (resume) setTimeout(() => toast('💾 저장된 곳에서 이어서 시작해요'), 400);
  logSys(code === TOWN ? '👫 이 게임 주소로 들어오는 친구들은 모두 이 마을에 살아요. 각자 집이 하나씩 생겨요!' : `🏡 마을 코드 [${code}] · 💌 초대 버튼으로 친구에게 링크를 보내요!`);
  logSys('🖱️ 바닥·물건·친구를 누르면 그곳으로 가요 · ⌨️ WASD 이동, E 행동, Enter 채팅');
  if (c) joinVillage(c);
  else if (typeof Peer === 'undefined') goOffline('네트워크 라이브러리를 못 불러왔어요');
  else { gotWorld = true; world = newWorld(); becomeHost(); }
  if (!resume) setTimeout(() => { if (lotOf(me.id) >= 0 && curMap === 'v') notify('🏠 마을에 내 집이 생겼어요! 꾸며 볼까요?', [['🔨 꾸미러 가기', () => openEdit(), 'primary'], ['🚪 집에 가기', () => goHome(), 'mint']], 10000); }, 2500);
}

// ===== 메인 루프 =====
buildVillage();
rebuildLotSolid();
let last = performance.now(), uiT = 0;
function frame(t) {
  const dt = Math.min(0.05, (t - last) / 1000); last = t;
  animT += dt;
  updateNature(dt);
  if (started) {
    update(dt);
    if (isHost) hostTick(dt);
    uiT += dt;
    if (uiT > 0.2) { uiT = 0; updateUI(); }
  } else updateNpcs(dt);
  draw();
  drawPreview();
  requestAnimationFrame(frame);
}
if (document.fonts && document.fonts.load) document.fonts.load(`12px ${FONT}`).catch(() => {});
requestAnimationFrame(frame);
</script>
